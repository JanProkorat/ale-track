services:
  postgres:
    image: postgres:17
    container_name: aletrack-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: AleTrack
    ports:
      # Host 5433, not 5432: the default port is routinely taken by another project's
      # Postgres, and the clash surfaces as a confusing auth failure against the wrong
      # database rather than as a port conflict. The container still listens on 5432.
      - "5433:5432"
    volumes:
      - aletrack-data:/var/lib/postgresql/data

volumes:
  aletrack-data: