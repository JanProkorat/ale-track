name: App Tests

on:
  pull_request:
    branches: [ dev, main ]
    paths:
      - 'app/**'
      - '.github/workflows/app-tests.yml'

defaults:
  run:
    working-directory: ./app

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The app is a yarn project — there is no package-lock.json, so the npm cache
      # lookup failed the job before a single test ran. This workflow had therefore
      # never passed since it was added.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test:run
