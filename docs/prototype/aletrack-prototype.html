    <option value="all" ${SH.regionFilter==='all'?'selected':''}>Vše (${avail.length})</option>
    ${regionsPresent.map(r=>{const n=avail.filter(o=>clientById(o.clientId).region===r).length;
      return `<option value="${r}" ${SH.regionFilter===r?'selected':''}>${L.region[r]||r} (${n})</option>`;}).join('')}</select>`;
  const availShown=avail.filter(o=>SH.regionFilter==='all'||clientById(o.clientId).region===SH.regionFilter||d.stops.some(st=>st.orderId===o.id));
  const availList=availShown.map(o=>{ const cl=clientById(o.clientId); const inRoute=d.stops.some(st=>st.orderId===o.id); const t=orderTotals(o);
    return `<label class="row gap12" style="padding:11px;border:1px solid ${inRoute?'var(--amber)':'var(--border)'};border-radius:var(--r);cursor:pointer;${inRoute?'background:var(--amber-soft)':''}">
      <input type="checkbox" ${inRoute?'checked':''} onchange="seToggleOrder('${o.id}')" style="width:17px;height:17px;accent-color:var(--amber)">
      <span class="dotc" style="width:10px;height:10px;border-radius:99px;background:${colorFor(cl.id)}"></span>
      <div style="flex:1;min-width:0"><div class="t-strong" style="font-size:13.5px">${esc(cl.name)}</div>
        <div class="t-mut" style="font-size:12px">${o.number} · ${t.items} ks · ${o.requiredDeliveryDate?fdate(o.requiredDeliveryDate):'bez termínu'}</div>
        <span class="tag" style="margin-top:4px">${icon('pin',11)}${L.region[cl.region]||cl.region}</span></div>
      ${pill('order',o.state)}</label>`; }).join('')||`<div class="empty" style="padding:24px"><div class="t">V tomto regionu nejsou objednávky</div>
        ${SH.regionFilter!=='all'?`<button class="btn btn-sm btn-ghost" style="margin-top:10px" onclick="seSetRegion('all')">Zobrazit vše</button>`:''}</div>`;
  // ordered stops (draggable)
  const stopRows=stopsSorted.map((st,i)=>{ const cl=clientById(st.clientId); const o=DB.orders.find(x=>x.id===st.orderId);
    return `<div class="row gap8" draggable="true" ondragstart="SH.drag='${st.orderId}'" ondragover="event.preventDefault()" ondrop="seDropOn('${st.orderId}')"
      style="padding:10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:grab">
      <span style="color:var(--text-3)">${icon('drag',16)}</span>
      <span class="av" style="width:28px;height:28px;background:${colorFor(cl.id)};color:#fff;font-size:12px">${i+1}</span>
      <div style="flex:1;min-width:0"><div class="t-strong" style="font-size:13px">${esc(cl.name)}</div>
        <div class="t-mut" style="font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o?o.number+' · ':''}${stopAddressText(st)}</div></div>
      ${seAddrSelect(st,cl)}
      <button class="icon-btn" style="width:30px;height:30px" onclick="seMove('${st.orderId}',-1)" ${i===0?'disabled':''}>${icon('arrowU',13)}</button>
      <button class="icon-btn" style="width:30px;height:30px" onclick="seMove('${st.orderId}',1)" ${i===stopsSorted.length-1?'disabled':''}>${icon('arrowD',13)}</button>
      <button class="icon-btn" style="width:30px;height:30px;color:var(--crit)" onclick="seRemoveStop('${st.orderId}')">${icon('trash',13)}</button></div>`; }).join('');
  const driverChips=DB.drivers.map(dr=>{ const on=d.driverIds.includes(dr.id); const free=driverAvailableOn(dr,d.deliveryDate);
    return `<button class="chip" style="height:34px;border-color:${on?dr.color:'var(--border)'};${on?`background:${dr.color}18`:''}" onclick="seToggleDriver('${dr.id}')">
      <span class="dotc" style="width:10px;height:10px;border-radius:99px;background:${dr.color}"></span>${esc(dr.firstName)} ${esc(dr.lastName)}
      ${on?`<span style="color:${dr.color}">${icon('check',13)}</span>`:free?'':`<span title="Nedostupný v tento den" style="color:var(--warn)">${icon('warnTri',13)}</span>`}</button>`; }).join('');
  return `<div class="page">
    ${detailHead(d.id?('shipments/'+d.id):'shipments','Zpět na vývozy',d.id?'Úprava vývozu':'Naplánovat vývoz',
      {lead:d.id?d.number:'',leadMono:true,meta:['Vyberte objednávky, seřaďte zastávky a přiřaďte vůz a řidiče.'],
       actions:`<button class="btn btn-ghost" onclick="history.back()">Zrušit</button><button class="btn btn-primary" onclick="seSave()">${icon('check',16)}${d.id?'Uložit':'Vytvořit vývoz'}</button>`})}
    <div class="grid" style="grid-template-columns:1.4fr 1fr;align-items:start">
      <div class="stack" style="gap:16px">
        ${routeMap(pts,{h:340,animate:false})}
        <div class="card"><div class="card-head">${icon('route',16)}<h3>Pořadí zastávek</h3>
          ${d.stops.length>1?`<button class="btn btn-sm btn-soft" style="margin-left:auto" onclick="seOptimize()">${icon('sparkle',14)}Optimalizovat trasu</button>`:''}</div>
          <div class="card-pad stack" style="gap:9px">${stopRows||'<div class="t-mut" style="text-align:center;padding:16px">Zatím žádné zastávky — vyberte objednávky vpravo.</div>'}</div></div>
      </div>
      <div class="stack" style="gap:16px">
        <div class="card"><div class="card-pad"><div class="form-grid" style="grid-template-columns:1fr">
          ${field('Název vývozu',inp('se-name',d.name,'Rozvoz Žitava + Hrádek'),{req:true})}
          ${field('Datum a čas',`<input class="input" type="datetime-local" id="se-date" value="${(d.deliveryDate||'').slice(0,16)}" onchange="SH.draft.deliveryDate=this.value;seRerender()">`)}
          ${field('Vůz',sel('se-veh',[['','— vyberte vůz —'],...DB.vehicles.map(v=>[v.id,v.name])],d.vehicleId||''))}
        </div>
        ${veh?`<div class="row" style="justify-content:space-between;margin-top:6px"><span class="t-mut" style="font-size:12.5px">Náklad / nosnost</span>
          <span class="tnum t-strong" style="color:${totalWeight>veh.maxWeight?'var(--crit)':'var(--ok)'}">${Math.round(totalWeight)} / ${num(veh.maxWeight)} kg</span></div>`:''}
        </div></div>
        <div class="card"><div class="card-head"><h3>Řidiči</h3></div><div class="card-pad" style="display:flex;flex-wrap:wrap;gap:8px">${driverChips}</div></div>
        <div class="card"><div class="card-head">${icon('order',16)}<h3>Objednávky k rozvozu</h3>
            <span class="tag">${d.stops.length}/${avail.length}</span><span style="margin-left:auto">${regionSelect}</span></div>
          <div class="card-pad stack" style="gap:9px;max-height:440px;overflow-y:auto">${availList}</div></div>
      </div></div></div>`;
}
function seSetRegion(r){ seSyncMeta(); SH.regionFilter=r; seRerender(); }
function driverAvailableOn(dr,dt){ if(!dt)return true; const day=dt.slice(0,10); return dr.availabilities.some(a=>a.from.slice(0,10)===day); }
function seSyncMeta(){ if($('#se-name'))SH.draft.name=$('#se-name').value; if($('#se-veh'))SH.draft.vehicleId=$('#se-veh').value||null; }
function seToggleOrder(orderId){ seSyncMeta(); const d=SH.draft; const ex=d.stops.find(s=>s.orderId===orderId);
  if(ex) d.stops=d.stops.filter(s=>s.orderId!==orderId);
  else { const o=DB.orders.find(x=>x.id===orderId); d.stops.push({ orderId, clientId:o.clientId, addressKind:'Official', placeId:null, order:d.stops.length+1 }); }
  reseq(); seRerender(); }
function reseq(){ SH.draft.stops.slice().sort((a,b)=>a.order-b.order).forEach((s,i)=>s.order=i+1); }
function seMove(orderId,dir){ seSyncMeta(); const arr=SH.draft.stops.slice().sort((a,b)=>a.order-b.order); const i=arr.findIndex(s=>s.orderId===orderId);
  const j=i+dir; if(j<0||j>=arr.length)return; [arr[i].order,arr[j].order]=[arr[j].order,arr[i].order]; seRerender(); }
function seDropOn(targetId){ const arr=SH.draft.stops.slice().sort((a,b)=>a.order-b.order); const from=arr.findIndex(s=>s.orderId===SH.drag); const to=arr.findIndex(s=>s.orderId===targetId);
  if(from<0||to<0||from===to)return; const [m]=arr.splice(from,1); arr.splice(to,0,m); arr.forEach((s,i)=>s.order=i+1); SH.drag=null; seRerender(); }
function seRemoveStop(orderId){ seSyncMeta(); SH.draft.stops=SH.draft.stops.filter(s=>s.orderId!==orderId); reseq(); seRerender(); }
/* Where this stop delivers: the client's two standard addresses, any of its
   saved places, or "+ Nové místo…" which authors one inline. The value is a
   single string because there are now N options, not two. */
function seAddrSelect(st,cl){
  const places=clientPlaces(cl.id);
  // A place selected earlier and since soft-deleted is no longer offered — keep
  // it in the list (disabled) so re-saving can't silently move the delivery.
  const gone=st.addressKind==='Place'&&st.placeId&&!places.some(p=>p.id===st.placeId)?placeById(cl.id,st.placeId):null;
  const cur=st.addressKind==='Place'?'place:'+st.placeId:st.addressKind;
  return `<select class="select" style="width:190px;height:32px;flex:0 0 auto" onchange="seAddrKind('${st.orderId}',this.value)">
    <option value="Official" ${cur==='Official'?'selected':''}>Fakturační</option>
    ${cl.contactAddress?`<option value="Contact" ${cur==='Contact'?'selected':''}>Kontaktní</option>`:''}
    ${places.length?`<optgroup label="Vlastní místa">${places.map(p=>
      `<option value="place:${p.id}" ${cur==='place:'+p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</optgroup>`:''}
    ${gone?`<optgroup label="Smazané"><option value="place:${gone.id}" selected>${esc(gone.name)} (smazáno)</option></optgroup>`:''}
    <option value="__new">+ Nové místo…</option></select>`;
}
function seAddrKind(orderId,value){
  const st=SH.draft.stops.find(s=>s.orderId===orderId);
  if(value==='__new'){
    seSyncMeta();
    // Deliberate: the place is saved onto the client straight away, even if the
    // shipment draft is never saved. Cancelling just re-renders the old choice.
    deliveryPlaceForm(st.clientId,null,placeId=>{ st.addressKind='Place'; st.placeId=placeId; seRerender(); });
    seRerender(); return;
  }
  if(value.startsWith('place:')){ st.addressKind='Place'; st.placeId=value.slice(6); }
  else { st.addressKind=value; st.placeId=null; }
  seRerender();
}
function seToggleDriver(id){ seSyncMeta(); const a=SH.draft.driverIds; const i=a.indexOf(id); if(i>=0)a.splice(i,1); else a.push(id); seRerender(); }
function seOptimize(){ seSyncMeta(); const arr=SH.draft.stops.slice(); if(arr.length<2){toast('Málo zastávek');return;}
  const pt=st=>{const a=stopAddress(st);return {lat:a.latitude,lng:a.longitude};};
  let cur={lat:DEPOT.lat,lng:DEPOT.lng}; const rem=[...arr]; const out=[];
  while(rem.length){ let bi=0,bd=1e9; rem.forEach((s,i)=>{const dd=haversine(cur,pt(s));if(dd<bd){bd=dd;bi=i;}}); const n=rem.splice(bi,1)[0]; out.push(n); cur=pt(n); }
  out.forEach((s,i)=>s.order=i+1); SH.draft.stops=out; seRerender(); toast('Trasa optimalizována (nejbližší soused)','sparkle'); }
function seSave(){ seSyncMeta(); const d=SH.draft; if(!d.name)return toast('Zadejte název','warnTri'); if(!d.stops.length)return toast('Přidejte alespoň jednu zastávku','warnTri');
  const build=st=>{ const o=DB.orders.find(x=>x.id===st.orderId);
    const existing=(DB.shipments.find(x=>x.id===d.id)||{stops:[]}).stops.find(x=>x.orderId===st.orderId);
    const keep=existing?existing.items.filter(i=>i.source==='dokladka'):[];
    // Supplier-good order lines (it.productId null) stay off the nakládka table —
    // the outgoing-shipment handling for them is being sorted out separately.
    return { ...st, items:[...o.items.filter(it=>it.productId).map(it=>{ const prev=existing&&existing.items.find(x=>x.orderItemId===it.id);
      return { id:it.id, orderItemId:it.id, productId:it.productId, quantity:it.quantity, dokladkaQty:prev?(prev.dokladkaQty||0):0, fromInventoryId:prev?prev.fromInventoryId:null, loaded:prev?prev.loaded:false, checked:prev?prev.checked:false, source:'order' }; }), ...keep] }; };
  if(d.id){ const s=DB.shipments.find(x=>x.id===d.id); Object.assign(s,{ name:d.name,deliveryDate:d.deliveryDate,vehicleId:d.vehicleId,driverIds:d.driverIds,stops:d.stops.map(build),extraCustom:d.extraCustom }); toast('Vývoz uložen'); go('shipments/'+d.id); }
  else { const s={ id:'s-'+Math.random().toString(36).slice(2,7), number:'VYV-2026-'+(53+DB.shipments.length), name:d.name, state:'Created',
    deliveryDate:d.deliveryDate, vehicleId:d.vehicleId, driverIds:d.driverIds, stops:d.stops.map(build), extraCustom:d.extraCustom };
    d.stops.forEach(st=>{const o=DB.orders.find(x=>x.id===st.orderId); if(o&&o.state==='New')o.state='Planning';});
    DB.shipments.push(s); toast('Vývoz naplánován'); go('shipments/'+s.id); }
}

    ${done?`<div class="card" style="margin-bottom:16px;background:var(--ok-tint);border-color:transparent"><div class="card-pad row gap12">
      <span style="color:var(--ok)">${icon('check',20)}</span><div><div class="t-strong">Naskladněno</div>
      <div class="t-mut" style="font-size:13px">${deliveryTotals(d)} kusů bylo propsáno na sklad.</div></div>

function advanceDelivery(id,to){ DB.deliveries.find(x=>x.id===id).state=to; toast(to==='OnTheWay'?'Dovoz vyrazil':'Stav aktualizován'); renderRoute(); }
function finishDelivery(id){ const d=DB.deliveries.find(x=>x.id===id);
  const preview=[]; d.stops.forEach(s=>s.items.forEach(it=>{ const p=prodById(it.productId); const inv=DB.inventory.find(i=>i.productId===it.productId);
    preview.push({ name:p.name, qty:it.quantity, before:inv?inv.quantity:0, after:(inv?inv.quantity:0)+it.quantity }); }));
  openOverlay(`<div class="modal-head">${icon('stock',20)}<h3>Naskladnit dovoz ${d.number}</h3><button class="icon-btn" data-scrim-close>${icon('close',16)}</button></div>

function deRerenderStop(sid){ const s=DE.draft.stops.find(x=>x.id===sid); const el=$('#de-stop-'+sid); if(el){ el.outerHTML=deStopCard(s); deWireStop(sid); } }

function dePickBrewery(bId){ DE.brewQuery=''; deAddStop(bId); }

/* brewery coordinates for the pickup route (warehouse -> breweries -> warehouse) */
function deliveryStopPoints(stops){ return stops.map((s,i)=>{ const b=breweryById(s.breweryId); const a=b.officialAddress;
  return { lat:a.latitude, lng:a.longitude, label:b.name.replace('Pivovar ','').replace('Brauerei','').trim(), seq:i+1, color:b.color }; }); }
/* ---- stop card with embedded catalog (collapsible + reorderable) ---- */
function deStopCard(s){
  const b=breweryById(s.breweryId); const ui=deStopUI(s.id); const cnt=s.items.length; const ks=s.items.reduce((x,i)=>x+i.quantity,0);
  const idx=DE.draft.stops.findIndex(x=>x.id===s.id); const n=DE.draft.stops.length;
  const head=`<div class="card-head" style="cursor:pointer;gap:9px" onclick="deToggleCollapse('${s.id}')">
      <span style="color:var(--text-3);transform:rotate(${ui.collapsed?0:90}deg);transition:.2s;display:inline-flex">${icon('chevR',16)}</span>
      <span class="av" style="width:26px;height:26px;border-radius:8px;background:${b.color}22;color:${b.color};font-size:12px;flex:0 0 auto">${idx+1}</span>
      <h3 style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name)}</h3>
      <span class="tag">${cnt} ${plural(cnt,'položka','položky','položek')} · ${ks} ks</span>
      <button class="icon-btn" style="width:30px;height:30px" onclick="event.stopPropagation();deMoveStop('${s.id}',-1)" ${idx===0?'disabled':''} title="Nahoru">${icon('arrowU',13)}</button>
      <button class="icon-btn" style="width:30px;height:30px" onclick="event.stopPropagation();deMoveStop('${s.id}',1)" ${idx===n-1?'disabled':''} title="Dolů">${icon('arrowD',13)}</button>
      <button class="icon-btn" style="width:30px;height:30px;color:var(--crit)" onclick="event.stopPropagation();deRemoveStop('${s.id}')" title="Odebrat pivovar">${icon('trash',14)}</button></div>`;
  const body=ui.collapsed ? '' : `<div class="card-pad" id="de-cat-${s.id}">${deStopCatalog(s)}</div>`;
  return `<div class="card" id="de-stop-${s.id}">${head}${body}</div>`;
}
function deToggleCollapse(sid){ deStopUI(sid).collapsed=!deStopUI(sid).collapsed; deRerenderStop(sid); }
function deMoveStop(sid,dir){ deSyncMeta(); const a=DE.draft.stops; const i=a.findIndex(s=>s.id===sid); const j=i+dir; if(j<0||j>=a.length)return; [a[i],a[j]]=[a[j],a[i]]; deRerender(); }
function deStopCatalog(s){
  const b=breweryById(s.breweryId); const ui=deStopUI(s.id); const prods=productsOf(b.id);
  const flt=p=>!ui.q||p.name.toLowerCase().includes(ui.q.toLowerCase());
  const kinds=['Keg','Bottle','Can','Multipack','Other']; const kc={}; prods.forEach(p=>{ if(flt(p)) kc[p.kind]=(kc[p.kind]||0)+1; });
  const kindTabs=`<div class="seg wrap" style="margin-bottom:12px;flex-wrap:wrap">
    <button class="${ui.kind==='all'?'on':''}" onclick="deSetKind('${s.id}','all')">Vše</button>
    ${kinds.filter(k=>kc[k]).map(k=>`<button class="${ui.kind===k?'on':''}" onclick="deSetKind('${s.id}','${k}')">${L.kind[k]} <span style="opacity:.6">${kc[k]}</span></button>`).join('')}</div>`;
  const kindOk=p=>ui.kind==='all'||p.kind===ui.kind;
  const shown=prods.filter(p=>flt(p)&&kindOk(p));
  const search=`<div class="fld" style="margin-bottom:12px">${icon('search',16)}<input id="de-q-${s.id}" placeholder="Hledat produkt v pivovaru…" value="${esc(ui.q)}"></div>`;
  const list=shown.length?`<div style="max-height:340px;overflow-y:auto;padding-right:2px">${deGroupList(s,shown)}</div>`
    :`<div class="empty" style="padding:22px"><div class="t">Nic nenalezeno</div></div>`;
  return search+kindTabs+list;
}
function deSetKind(sid,k){ deStopUI(sid).kind=k; deRerenderStopCat(sid); }
function deGroupList(s,prods){
  const groups=[]; const idx={};
  prods.forEach(p=>{ if(idx[p.name]==null){ idx[p.name]=groups.length; groups.push({name:p.name,items:[p]}); } else groups[idx[p.name]].items.push(p); });
  return `<div class="stack" style="gap:9px">${groups.map(g=>g.items.length>1?deVariantCard(s,g):deProductRow(s,g.items[0])).join('')}</div>`;
}
function deQtyCtrl(s,p,item){ return item?`<div class="row gap8" style="flex:0 0 auto"><button class="icon-btn" style="width:30px;height:30px" onclick="deItemQty('${s.id}','${p.id}',-1)">−</button>
    <span class="t-strong tnum" style="min-width:20px;text-align:center">${item.quantity}</span>
    <button class="icon-btn" style="width:30px;height:30px" onclick="deItemQty('${s.id}','${p.id}',1)">+</button></div>`
    :`<button class="btn btn-soft btn-sm" style="flex:0 0 auto" onclick="deAddItem('${s.id}','${p.id}')">${icon('plus',14)}Přidat</button>`; }
function deProductRow(s,p){
  const item=s.items.find(i=>i.productId===p.id);
  return `<div class="row gap12" style="padding:9px 10px;border:1px solid var(--border);border-radius:var(--r);${item?'background:var(--amber-soft);border-color:var(--amber-tint)':''}">

    ${deQtyCtrl(s,p,item)}</div>`;
}
function deVariantCard(s,g){
  const b=breweryById(g.items[0].breweryId);
  return `<div style="border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
    <div class="row gap8" style="padding:10px 11px;background:var(--surface-2)">
      <span class="dotc" style="width:10px;height:10px;border-radius:3px;background:${b.color};flex:0 0 auto"></span>
      <span class="t-strong" style="font-size:13.5px">${esc(g.name)}</span>
      <span class="tag" style="margin-left:auto">${g.items.length} ${plural(g.items.length,'velikost','velikosti','velikostí')}</span></div>
    ${g.items.map(v=>{ const item=s.items.find(i=>i.productId===v.id);
      return `<div class="row gap8" style="padding:9px 11px;border-top:1px solid var(--border);${item?'background:var(--amber-soft)':''}">
        <span class="tag">${kindChipText(v.kind)}</span>
        <span class="tag" style="font-weight:800">${fmtLiters(v.packageSize)}</span>
        <span class="t-mut" style="font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${esc(v.description||'')}</span>
        ${deQtyCtrl(s,v,item)}</div>`; }).join('')}</div>`;
}
function deAddStop(bId){ deSyncMeta(); DE.draft.stops.push({ id:'ds-'+Math.random().toString(36).slice(2,7), breweryId:bId, note:'', items:[] }); deRerender(); }
function deRemoveStop(sid){ deSyncMeta(); delete DE.ui[sid]; DE.draft.stops=DE.draft.stops.filter(s=>s.id!==sid); deRerender(); }
function deAddItem(sid,pid){ DE.draft.stops.find(s=>s.id===sid).items.push({ productId:pid, quantity:1, note:'' }); deRerenderStop(sid); }
function deItemQty(sid,pid,delta){ const it=DE.draft.stops.find(s=>s.id===sid).items.find(i=>i.productId===pid); if(!it)return; it.quantity+=delta; if(it.quantity<=0)return deRemoveItem(sid,pid); deRerenderStop(sid); }
function deRemoveItem(sid,pid){ const s=DE.draft.stops.find(s=>s.id===sid); s.items=s.items.filter(i=>i.productId!==pid); deRerenderStop(sid); }
function deToggleDriver(id){ deSyncMeta(); const a=DE.draft.driverIds; const i=a.indexOf(id); if(i>=0)a.splice(i,1); else a.push(id); deRerender(); }
function deSave(){ deSyncMeta(); const d=DE.draft; if(!d.stops.length)return toast('Přidejte alespoň jeden pivovar','warnTri');
  if(d.stops.some(s=>!s.items.length))return toast('Každý pivovar musí mít alespoň jeden produkt','warnTri');
  if(d.id){ const dv=DB.deliveries.find(x=>x.id===d.id); Object.assign(dv,{date:d.date,vehicleId:d.vehicleId,driverIds:d.driverIds,note:d.note,stops:d.stops}); toast('Dovoz uložen'); go('deliveries/'+d.id); }
  else { const dv={ id:'d-'+Math.random().toString(36).slice(2,7), number:'DOV-2026-'+(32+DB.deliveries.length), date:d.date, state:'InPlanning',
    vehicleId:d.vehicleId, driverIds:d.driverIds, note:d.note, stops:d.stops }; DB.deliveries.push(dv); toast('Dovoz vytvořen'); go('deliveries/'+dv.id); }

let INV_SEARCH='', INV_BREW='all', INV_LAYOUT='list';

          <button id="inv-lay-grid" class="${INV_LAYOUT==='grid'?'on':''}" onclick="invSetLayout('grid')" title="Mřížka">${icon('dash',15)}</button></div>

function invStat(label,val,ic,crit,first){
  return `<div style="flex:0 1 auto;min-width:112px;padding:11px 15px;${first?'':'border-left:1px solid var(--border)'};display:flex;align-items:center;gap:10px">
    <div style="width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;background:${crit?'var(--crit-tint)':'var(--surface-3)'};color:${crit?'var(--crit)':'var(--text-2)'}">${icon(ic,16)}</div>
    <div style="min-width:0"><div class="t-mut" style="font-size:11.5px;font-weight:600;white-space:nowrap">${esc(label)}</div>
      <div class="tnum" style="font-size:19px;font-weight:800;line-height:1.2;${crit?'color:var(--crit)':''}">${val}</div></div></div>`;
}
function invWire(){ const s=$('#inv-search'); if(s) s.oninput=()=>{ INV_SEARCH=s.value; invRerender(); };
  const b=$('#inv-brew'); if(b) b.onchange=()=>{ INV_BREW=b.value; invRerender(); }; }
function invSetLayout(l){ INV_LAYOUT=l; const a=$('#inv-lay-list'),g=$('#inv-lay-grid'); if(a)a.classList.toggle('on',l==='list'); if(g)g.classList.toggle('on',l==='grid'); invRerender(); }
function invRerender(){ const r=$('#inv-results'); if(r) r.innerHTML=invResults(); const c=$('#inv-count'); if(c) c.textContent=invCount()+' položek'; }
function invFiltered(){
  const q=INV_SEARCH.toLowerCase().trim();
  const spec=(INV_BREW!=='all'&&INV_BREW!=='__free');
  const linked=(INV_BREW==='__free')?[]:DB.inventory.filter(i=>i.productId).filter(i=>{ const p=prodById(i.productId); return (!spec||p.breweryId===INV_BREW)&&(!q||p.name.toLowerCase().includes(q)); });
  const free=spec?[]:DB.inventory.filter(i=>!i.productId).filter(i=>!q||(i.name||'').toLowerCase().includes(q));
  return {linked,free};
}
function invCount(){ const {linked,free}=invFiltered(); return linked.length+free.length; }
function invResults(){
  const ed=canEdit('inventory'); const {linked,free}=invFiltered();
  if(!linked.length&&!free.length) return `<div class="empty"><div>${icon('search',34)}</div><div class="t">Nic nenalezeno</div>
    <div>Zkuste jiný filtr nebo hledaný výraz.</div>${(INV_SEARCH||INV_BREW!=='all')?`<button class="btn btn-sm btn-ghost" style="margin-top:12px" onclick="INV_SEARCH='';INV_BREW='all';renderRoute()">Zrušit filtry</button>`:''}</div>`;
  if(INV_LAYOUT==='grid'){
    const all=[...linked,...free];
    return `<div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${all.map(i=>invTile(i,ed)).join('')}</div>`;

        <td class="t-mut">${esc(i.note||'')}</td>${ed?`<td style="text-align:right"><button class="icon-btn" style="width:30px;height:30px;color:var(--crit)" onclick="invDel('${i.id}')">${icon('trash',13)}</button></td>`:''}</tr>`; }).join('');

      <span class="dotc" style="width:12px;height:12px;border-radius:3px;background:${b.color}"></span>${esc(b.name)}<span class="t-mut">${items.length} položek</span></div>

  const freeSection=free.length?`<div style="margin-bottom:8px"><div class="section-label" style="margin:16px 0 8px">${icon('box',14)} Ostatní (ručně evidované)</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Položka</th><th style="text-align:right">Množství</th><th>Pozn.</th>${ed?'<th></th>':''}</tr></thead>
    <tbody>${free.map(i=>`<tr><td class="t-strong">${esc(i.name)}</td><td class="num"><div class="row gap8" style="justify-content:flex-end">
      ${ed?`<button class="icon-btn" style="width:28px;height:28px" onclick="invAdj('${i.id}',-1)">−</button>`:''}<span class="tnum t-strong" style="min-width:34px;text-align:center;font-size:15px">${i.quantity}</span>
      ${ed?`<button class="icon-btn" style="width:28px;height:28px" onclick="invAdj('${i.id}',1)">+</button>`:''}</div></td>
      <td class="t-mut">${esc(i.note||'')}</td>${ed?`<td style="text-align:right"><button class="icon-btn" style="width:30px;height:30px;color:var(--crit)" onclick="invDel('${i.id}')">${icon('trash',13)}</button></td>`:''}</tr>`).join('')}</tbody></table></div></div>`:'';
  return brewSections+freeSection;
}

function invAdj(id,delta){ const i=DB.inventory.find(x=>x.id===id); i.quantity=Math.max(0,i.quantity+delta); renderRoute(); }
function invDel(id){ const i=DB.inventory.find(x=>x.id===id); const nm=i.name||(prodById(i.productId||'')||{}).name||'položku';

    else { const nm=val('iv-name'); if(!nm)return toast('Zadejte název','warnTri');
      DB.inventory.push({ id:'inv-'+Math.random().toString(36).slice(2,7), productId:null, name:nm, quantity:parseInt(val('iv-qty2'))||0, note:val('iv-note2')||null }); }

function invFormTab(t){ window._ivTab=t; $('#iv-p').style.display=t==='p'?'block':'none'; $('#iv-f').style.display=t==='f'?'block':'none';
  $('#iv-tab-p').classList.toggle('on',t==='p'); $('#iv-tab-f').classList.toggle('on',t==='f'); }

/* ============ MODULE: GARÁŽOVÝ PRODEJ (SALES) ============
   Walk-in counter sales straight off the warehouse shelf. A sale stays a draft
   (stock untouched) until it is completed — completing deducts the sold pieces
   from Sklad and freezes the record. Paying by invoice adds a step: the goods
   leave the shelf, the sale waits in "Čeká na platbu", and only confirming the
   money arrived finishes it. Mirrors Dovozy' "Dokončit → naskladnit", run in the
   opposite direction. */

/* A sale carries no stored number — the tail of its id stands in for one, shown in
   mono. Same convention as the order / vývoz / dovoz display numbers. */
function saleNumber(s){ return s&&s.publicId?'#'+s.publicId:'—'; }
function newPublicId(){ return Math.random().toString(16).slice(2,8).toUpperCase().padEnd(6,'0'); }
/* A sold line snapshots the product's packaging as well as its price: the ceník can move
   and a finished sale must keep reading the way it was rung up. */
function saleLine(inv,qty,unitPrice,note){
  const pr=inv.productId?prodById(inv.productId):null;
  return { id:'sl-'+Math.random().toString(36).slice(2,7), inventoryId:inv.id, productId:inv.productId||null,
    name:pr?pr.name:inv.name, kind:pr?pr.kind:null, packageSize:pr?pr.packageSize:null,
    // A caller that knows the buyer passes the resolved price in; with none given this
    // falls back to the brewery's ceník. Resolution deliberately lives at the till
    // boundary (tillAdd) rather than here, because the seed builds historical sales with
    // this function long before any till state exists.
    // `listPrice` is the brewery's ceník price either way: it is what the line gets
    // compared *against* on screen and in the reports, snapshotted here so a later
    // reprice cannot restate a sale that already happened.
    quantity:qty, unitPrice:unitPrice!=null?unitPrice:(pr?pr.priceWithVat:null),
    listPrice:pr?pr.priceWithVat:null, note:note||'' };
}
function saleItemName(it){ return it.name+(it.packageSize!=null?' ('+fmtLiters(it.packageSize)+')':''); }
function saleTotals(s){ let items=0,total=0; s.items.forEach(it=>{ items+=(it.quantity||0); total+=(it.quantity||0)*(it.unitPrice||0); }); return {items,total}; }
function saleBuyer(s){ if(s.buyerKind==='Client'){ const c=clientById(s.clientId); return c?c.name:'— smazaný klient —'; }
  return (s.buyerName||'').trim()||'Neuvedený kupující'; }
function saleNamed(s){ return s.buyerKind==='Client'?!!clientById(s.clientId):!!(s.buyerName||'').trim(); }
function saleDraft(s){ return s.state==='Draft'; }
function saleAwaiting(s){ return s.state==='AwaitingPayment'; }
function saleDone(s){ return s.state==='Completed'; }
/* Money owed is exactly the AwaitingPayment state rather than a conjunction of state,
   payment method and a paid flag: the lifecycle is the single source of truth, so there
   is nothing left to disagree with it. A draft is never unpaid — nothing was handed over. */
function saleUnpaid(s){ return saleAwaiting(s); }
function saleOverdueDays(s){ if(!saleUnpaid(s)||!s.billing||!s.billing.dueDate) return 0;
  const d=Math.floor((new Date(SEED_TODAY)-new Date(s.billing.dueDate))/86400000); return d>0?d:0; }
function saleStock(invId){ const i=DB.inventory.find(x=>x.id===invId); return i?i.quantity:0; }
/* Plain text, not a chip: the state pill already carries the sale's colour, and a second
   coloured badge in the row fought it for attention. */
function salePayText(s){
  const unpaid=saleUnpaid(s);
  let t=L.payment[s.payment];
  if(s.payment==='Invoice'&&!saleDraft(s)) t+=' · '+(unpaid?'nezaplaceno':'zaplaceno');
  return `<span style="font-size:12.5px;font-weight:600;color:${unpaid?'var(--crit)':'var(--text-2)'}">${esc(t)}</span>`;
}
/* Label / value row used by the sale cards — label left, value right, unlike the stacked
   .kv the evidence screens use. */
function saleKv(k,v){ return `<div class="row" style="justify-content:space-between;align-items:baseline;gap:16px">
  <span style="font-size:12.5px;font-weight:600;color:var(--text-3);flex:0 0 auto">${esc(k)}</span>
  <span style="font-size:13.5px;text-align:right">${v}</span></div>`; }
/* A draft's lines measured against what is on the shelf right now. Stock moves between a
   draft being written and being finished — someone else sells the last keg — so the
   shortfall is checked on entering the detail, not only inside the confirm dialog. */
function saleCompletionRows(s){ return s.items.map(it=>{ const before=saleStock(it.inventoryId);
  return { id:it.id, name:saleItemName(it), quantity:it.quantity, before, after:before-it.quantity, short:before<it.quantity }; }); }
function saleShortRows(s){ return saleCompletionRows(s).filter(r=>r.short); }

/* ---- list ---- */
let SAL_FILTER='all', SAL_SEARCH='';
/* Diacritics stripped from both sides, so "kucerova" finds "Kučerová" — the counter types
   fast and a Czech keyboard is not always at hand. Substring, not prefix, so a surname
   finds a sale recorded under a full name. */
/* NFD splits an accented letter into its base plus a combining mark; U+0300-U+036F is
   the block those marks live in, so stripping it leaves the bare letter behind. */
function saleNorm(v){ return (v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function saleBuyerRaw(s){ const c=s.buyerKind==='Client'?clientById(s.clientId):null;
  return (c?c.name:'')+' '+(s.buyerName||''); }
function salSegment(list){ return SAL_FILTER==='Draft'?list.filter(saleDraft)
  :SAL_FILTER==='unpaid'?list.filter(saleUnpaid)
  :SAL_FILTER==='Completed'?list.filter(saleDone):list.slice(); }
function salAll(){ return DB.sales.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')); }
/* Segment first, then buyer: the segment counts describe the whole list, so a search must
   not change the numbers on the tabs — only which rows survive into the table. */
function salFiltered(){ const q=saleNorm(SAL_SEARCH);
  return salSegment(salAll()).filter(s=>!q||saleNorm(saleBuyerRaw(s)).includes(q)); }
function viewSales(){
  const ed=canEdit('sales');
  const all=salAll();
  const newBtn=ed?addBtn('Nový prodej','sales/new'):'';
  if(!all.length) return `<div class="page">
    ${pageHead('Garážový prodej','Prodeje','Prodej zboží ze skladu zákazníkovi na místě — hotově nebo na fakturu.',newBtn)}
    <div class="empty"><div>${icon('cart',36)}</div><div class="t">Zatím žádné prodeje</div>
      <div>Ze skladu se zatím nic neprodalo přímo na místě.</div>
      ${ed?`<div style="margin-top:14px">${newBtn}</div>`:''}</div></div>`;
  const drafts=all.filter(saleDraft), done=all.filter(saleDone), unpaid=all.filter(saleUnpaid);
  // Revenue counts completed sales only — a draft is not income, and counting it would
  // overstate the month the moment someone leaves a sale open.
  const monthDone=done.filter(s=>(s.date||'').slice(0,7)===SEED_TODAY.slice(0,7));
  const revenue=monthDone.reduce((a,s)=>a+saleTotals(s).total,0);
  const unpaidSum=unpaid.reduce((a,s)=>a+saleTotals(s).total,0);
  // Counted, not derived by subtraction: with a third state in play, "everything that is
  // not a draft" is no longer the same set as "completed".
  const counts={all:all.length,Draft:drafts.length,unpaid:unpaid.length,Completed:done.length};
  const seg=[['all','Vše'],['Draft','Rozpracované'],['unpaid','Nezaplacené'],['Completed','Dokončené']]
    .map(([v,l])=>`<button class="${SAL_FILTER===v?'on':''}" onclick="salSetFilter('${v}')">${l}${counts[v]?` <span style="opacity:.55">${counts[v]}</span>`:''}</button>`).join('');
  AFTER=salWire;
  return `<div class="page">
    ${pageHead('Garážový prodej','Prodeje','Prodej zboží ze skladu zákazníkovi na místě — hotově nebo na fakturu.',newBtn)}
    <!-- Same strip as Sklad: bordered stat cells, then the search and the filters in a
         cell of their own that takes the leftover width. -->
    <div class="card" style="margin-bottom:16px"><div style="display:flex;flex-wrap:wrap;align-items:stretch">
      ${invStat('Prodejů tento měsíc',monthDone.length,'cart',false,true)}
      ${invStat('Obrat tento měsíc',money(revenue),'wallet',false,false)}
      ${invStat('Rozpracované',drafts.length,'edit',false,false)}
      ${invStat('Nezaplaceno',unpaid.length?money(unpaidSum):'—','invoice',unpaid.length>0,false)}
      <div style="flex:1 1 340px;min-width:300px;border-left:1px solid var(--border);display:flex;align-items:center;gap:9px;padding:11px 14px;flex-wrap:wrap">
        <div class="fld" style="flex:1 1 auto;min-width:120px;height:38px">${icon('search',16)}<input id="sal-search" placeholder="Hledat kupujícího…" value="${esc(SAL_SEARCH)}"></div>
        <div class="seg" style="flex:0 0 auto">${seg}</div>
      </div>
    </div></div>
    <div class="row" style="justify-content:flex-end;margin:-8px 2px 10px"><span class="count-note" id="sal-count">${salFiltered().length} z ${all.length}</span></div>
    <div id="sal-results">${salResults()}</div></div>`;
}
function salWire(){ const s=$('#sal-search'); if(s) s.oninput=()=>{ SAL_SEARCH=s.value; salRerender(); }; }
function salSetFilter(v){ SAL_FILTER=v; renderRoute(); }
function salRerender(){ const r=$('#sal-results'); if(r) r.innerHTML=salResults();
  const c=$('#sal-count'); if(c) c.textContent=salFiltered().length+' z '+salAll().length; }
function salResults(){
  const list=salFiltered();
  if(!list.length) return `<div class="empty"><div>${icon('search',34)}</div><div class="t">Nic nenalezeno</div>
    <div>${SAL_SEARCH?'Žádný kupující neodpovídá hledanému výrazu.':'V tomto filtru nic není.'}</div>
    <button class="btn btn-sm btn-ghost" style="margin-top:12px" onclick="SAL_FILTER='all';SAL_SEARCH='';renderRoute()">Zrušit filtry</button></div>`;
  return salesTable(list);
}
function salesTable(list){
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Číslo</th><th>Datum</th><th>Kupující</th><th>Platba</th>
    <th style="text-align:right">Kusů</th><th style="text-align:right">Celkem</th><th>Stav</th><th></th></tr></thead>
    <tbody>${list.map(s=>{ const t=saleTotals(s); const od=saleOverdueDays(s);
      // An overdue invoice is a whole-record problem, so the row carries the flag rather
      // than leaving it to the pill in the last column, which is easy to scroll past.
      return `<tr class="clickable" onclick="go('sales/${s.id}')" ${od?'style="background:var(--crit-tint)"':''}>
        <td><span class="mono t-strong">${saleNumber(s)}</span></td>
        <td>${fdate(s.date)}</td>
        <td><span class="t-strong" ${saleNamed(s)?'':'style="color:var(--text-3);font-weight:600"'}>${esc(saleBuyer(s))}</span></td>
        <td>${salePayText(s)}</td>
        <td class="num tnum">${t.items}</td>
        <td class="num tnum t-strong">${money(t.total)}</td>
        <td><div class="row gap8 wrap">${pill('sale',s.state)}
          ${od?`<span class="pill s-crit"><span class="d"></span>po splatnosti ${od} ${plural(od,'den','dny','dní')}</span>`:''}</div></td>
        <td style="text-align:right">${icon('chevR',16)}</td></tr>`; }).join('')}</tbody></table></div>`;
}

/* ---- detail ---- */
function saleBanner(tone,title,body,action){
  const bg={amber:'var(--amber-soft)',ok:'var(--ok-tint)',crit:'var(--crit-tint)'}[tone];
  const bd=tone==='amber'?'var(--amber-tint)':'transparent';
  return `<div class="card" style="margin-bottom:16px;background:${bg};border-color:${bd}"><div class="card-pad row gap12">
    <div style="flex:1;min-width:0"><div class="t-strong">${esc(title)}</div>
      <div class="t-mut" style="font-size:13px">${body}</div></div>${action||''}</div></div>`;
}
function viewSaleDetail(id){
  id=id.split('?')[0]; const s=DB.sales.find(x=>x.id===id); if(!s) return notFound('Prodej');
  const ed=canEdit('sales'); const t=saleTotals(s);
  const draft=saleDraft(s), awaiting=saleAwaiting(s), od=saleOverdueDays(s);
  const cl=s.buyerKind==='Client'?clientById(s.clientId):null;
  const seller=DB.users.find(u=>u.id===s.soldBy);
  const short=draft?saleShortRows(s):[];
  const blocked=short.length>0;
  const shortById={}; short.forEach(r=>shortById[r.id]=r);
  const rows=s.items.map(it=>{ const sh=shortById[it.id];
    const discounted=it.listPrice!=null&&it.unitPrice!=null&&it.unitPrice!==it.listPrice;
    return `<tr ${sh?'style="background:var(--crit-tint)"':''}>
    <td><div class="row gap8 wrap"><span class="t-strong">${esc(saleItemName(it))}</span>
        ${it.kind?`<span class="tag">${kindChipText(it.kind)}</span>`:''}</div>
      ${sh?`<div style="font-size:11.5px;color:var(--crit);font-weight:700">skladem jen ${sh.before} — nelze vyskladnit</div>`:''}
      ${discounted?`<div class="t-mut" style="font-size:11.5px">ceník ${money(it.listPrice)} · ${it.unitPrice<it.listPrice?'sleva':'příplatek'} ${money(Math.abs(it.listPrice-it.unitPrice))}</div>`:''}
      ${it.note?`<div class="t-mut" style="font-size:11.5px">${icon('note',11)} ${esc(it.note)}</div>`:''}</td>
    <td class="num tnum" ${sh?'style="color:var(--crit);font-weight:700"':''}>${it.quantity} ks</td>
    <td class="num tnum">${money(it.unitPrice)}</td>
    <td class="num tnum t-strong">${money((it.quantity||0)*(it.unitPrice||0))}</td></tr>`; }).join('');
  const actions=[
    ed&&draft?`<button class="btn btn-primary" onclick="completeSale('${s.id}')" ${blocked?'disabled title="Na skladě není dost kusů — doskladněte nebo upravte prodej"':''}>${icon('check',16)}Dokončit prodej</button>`:'',
    ed&&draft?`<a class="btn btn-ghost" href="#/sales/${s.id}/edit">${icon('edit',16)}Upravit</a>`:'',
    ed&&draft?`<button class="btn btn-ghost" style="color:var(--crit)" onclick="deleteSale('${s.id}')">${icon('trash',15)}Smazat</button>`:'',
    ed&&awaiting?`<button class="btn btn-primary" onclick="confirmSalePayment('${s.id}')">${icon('wallet',16)}Platba dorazila</button>`:'',
  ].filter(Boolean).join('');
  const payAction=ed&&awaiting?`<button class="btn btn-sm btn-ghost" onclick="confirmSalePayment('${s.id}')">Platba dorazila</button>`:'';
  const lifecycle = draft
    ? (blocked
        ? saleBanner('crit','Na skladě už není dost kusů',
            `Od vytvoření prodeje se sklad změnil: ${short.map(r=>`${esc(r.name)} — potřeba ${r.quantity}, skladem ${r.before}`).join('; ')}. Doskladněte zboží, nebo prodej upravte.`,
            ed?`<a class="btn btn-sm btn-ghost" href="#/sales/${s.id}/edit">Upravit prodej</a>`:'')
        : saleBanner('amber','Rozpracovaný prodej','Zboží zatím nebylo odečteno ze skladu. Odečte se až dokončením prodeje.'))
    : (awaiting&&!od
        ? saleBanner('amber','Vyskladněno, čeká na platbu',
            `${t.items} ${plural(t.items,'kus byl','kusy byly','kusů bylo')} odečteno ze skladu. Faktura se splatností ${fdate(s.billing&&s.billing.dueDate)} zatím není uhrazena.`,payAction)
        : saleBanner('ok','Vyskladněno',
            `${t.items} ${plural(t.items,'kus byl','kusy byly','kusů bylo')} odečteno ze skladu.`,
            `<a class="btn btn-sm btn-ghost" href="#/inventory">Zobrazit sklad</a>`));
  return `<div class="page">
    ${detailHead('sales','Zpět na prodeje',saleNumber(s),{mono:true,status:pill('sale',s.state),
      meta:[fdate(s.date),esc(saleBuyer(s)),`${t.items} ${plural(t.items,'kus','kusy','kusů')}`],actions})}
    ${lifecycle}
    ${od?saleBanner('crit','Faktura po splatnosti',
      `Splatnost byla ${fdate(s.billing.dueDate)} — ${od} ${plural(od,'den','dny','dní')} po termínu, ${money(t.total)} neuhrazeno.`,payAction):''}
    <div class="grid" style="grid-template-columns:1.5fr 1fr;align-items:start">
      <div class="stack" style="gap:14px">
        <div class="card"><div class="card-head">${icon('cart',16)}<h3>Prodané zboží</h3>
          <span class="tag" style="margin-left:auto">${s.items.length} ${plural(s.items.length,'položka','položky','položek')}</span></div>
          <div class="tbl-wrap" style="border:0"><table class="tbl" style="min-width:0"><thead><tr><th>Položka</th>
            <th style="text-align:right">Počet</th><th style="text-align:right">Cena/ks</th><th style="text-align:right">Celkem</th></tr></thead>
            <tbody>${rows}</tbody>
            <tfoot><tr style="border-top:2px solid var(--border-2)"><td class="t-strong">Celkem</td>
              <td class="num tnum t-strong">${t.items} ks</td><td></td>
              <td class="num tnum t-strong" style="font-size:16px">${money(t.total)}</td></tr></tfoot></table></div></div>
        ${s.note?`<div class="card"><div class="card-head">${icon('note',16)}<h3>Poznámka</h3></div><div class="card-pad addr">${esc(s.note)}</div></div>`:''}
      </div>
      <div class="stack" style="gap:14px">
        <div class="card"><div class="card-head">${icon('client',16)}<h3>Kupující</h3></div><div class="card-pad stack" style="gap:11px">
          ${saleKv('Typ',cl?'Klient z evidence':'Jednorázový kupující')}
          ${saleKv('Jméno',cl?`<a href="#/clients/${cl.id}">${esc(cl.name)}</a>`:esc(saleBuyer(s)))}
          ${saleKv('Platba',esc(L.payment[s.payment]))}
          ${saleKv('Prodal',seller?esc(seller.firstName+' '+seller.lastName):'—')}
        </div></div>
        ${s.payment==='Invoice'&&s.billing?`<div class="card"><div class="card-head">${icon('invoice',16)}<h3>Fakturační údaje</h3>
          ${draft?'':`<span class="pill ${awaiting?'s-crit':'s-ok'}" style="margin-left:auto"><span class="d"></span>${awaiting?'nezaplaceno':'zaplaceno'}</span>`}</div>
          <div class="card-pad stack" style="gap:11px">
            ${saleKv('Název',esc(s.billing.name||'—'))}
            ${saleKv('IČO',`<span class="mono">${esc(s.billing.ico||'—')}</span>`)}
            ${saleKv('DIČ',`<span class="mono">${esc(s.billing.dic||'—')}</span>`)}
            ${saleKv('Adresa',esc([[s.billing.street,s.billing.no].filter(Boolean).join(' '),[s.billing.zip,s.billing.city].filter(Boolean).join(' ')].filter(Boolean).join(', ')||'—'))}
            ${saleKv('Splatnost',fdate(s.billing.dueDate))}
            ${s.billing.paidDate?saleKv('Zaplaceno',fdate(s.billing.paidDate)):''}
          </div></div>`:''}
        <div class="card"><div class="card-head"><h3>Souhrn</h3></div>
          <div class="card-pad row" style="gap:16px;align-items:stretch">
            <div style="flex:1"><div class="t-mut" style="font-size:11.5px;font-weight:600">Kusů</div>
              <div class="tnum" style="font-size:20px;font-weight:800">${t.items}</div></div>
            <div style="width:1px;background:var(--border)"></div>
            <div style="flex:1"><div class="t-mut" style="font-size:11.5px;font-weight:600">Celkem</div>
              <div class="tnum" style="font-size:20px;font-weight:800">${money(t.total)}</div></div>
          </div></div>
      </div></div></div>`;
}
/* "Platba dorazila" — the invoice was settled, which is what finishes an invoiced sale. */
function confirmSalePayment(id){ const s=DB.sales.find(x=>x.id===id); if(!s)return;
  s.state='Completed'; if(s.billing) s.billing.paidDate=SEED_TODAY;
  toast('Platba potvrzena · prodej dokončen','wallet'); renderRoute(); }
function deleteSale(id){ const s=DB.sales.find(x=>x.id===id); if(!s)return;
  confirmDialog('Smazat prodej?','Opravdu smazat rozpracovaný prodej '+saleNumber(s)+'? Skladu se to nedotkne.',()=>{
    DB.sales=DB.sales.filter(x=>x.id!==id); toast('Prodej smazán','trash'); go('sales'); }); }
/* Completing hands the goods over. Cash ends there; an invoice still has to be paid, so
   the sale lands in Čeká na platbu instead of Dokončený. */
function completeSale(id,onDone){
  const s=DB.sales.find(x=>x.id===id); if(!s)return;
  const preview=saleCompletionRows(s), short=preview.filter(p=>p.short);
  openOverlay(`<div class="modal-head">${icon('cart',20)}<h3>Dokončit prodej</h3><button class="icon-btn" data-scrim-close>${icon('close',16)}</button></div>
    <div class="modal-body"><p style="margin:0 0 14px;color:var(--text-2)">Dokončením se toto zboží odečte ze skladu a záznam se uzamkne.${
      s.payment==='Invoice'?' Prodej pak čeká na platbu — dokončí se až potvrzením, že faktura byla uhrazena.':''}</p>
      <div class="tbl-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>Položka</th><th style="text-align:right">Skladem</th>
        <th style="text-align:right">Prodej</th><th style="text-align:right">Zůstane</th></tr></thead>
      <tbody>${preview.map(r=>`<tr><td class="t-strong">${esc(r.name)}</td><td class="num tnum t-mut">${r.before}</td>
        <td class="num tnum" style="color:var(--crit)">−${r.quantity}</td>
        <td class="num tnum t-strong" ${r.short?'style="color:var(--crit)"':''}>${r.short?'nedostatek':r.after}</td></tr>`).join('')}</tbody></table></div>
      ${short.length?`<div class="hint" style="margin-top:12px;color:var(--crit)">Na skladě není dost kusů: ${short.map(r=>esc(r.name)).join(', ')}. Upravte počty v prodeji.</div>`:''}</div>
    <div class="modal-foot"><button class="btn btn-ghost" data-scrim-close>Zrušit</button>
      <button class="btn btn-primary" id="sale-fin" ${short.length?'disabled':''}>${icon('check',16)}Dokončit a vyskladnit</button></div>`,{center:true});
  const yes=$('#sale-fin');
  if(yes) yes.onclick=()=>{
    s.items.forEach(it=>{ const inv=DB.inventory.find(i=>i.id===it.inventoryId); if(inv) inv.quantity=Math.max(0,inv.quantity-it.quantity); });
    s.state=s.payment==='Invoice'?'AwaitingPayment':'Completed'; s.completedAt=SEED_TODAY; closeOverlay();
    const t=saleTotals(s); toast(`Prodej dokončen · ${t.items} ks odečteno ze skladu`,'cart');
    if(onDone) onDone(); else renderRoute(); };
  $$('[data-scrim-close]').forEach(x=>x.onclick=closeOverlay);
}

/* ---- editor (the till) ----
   Left: who is buying and how they pay, then the stock catalog you pick from. Right: the
   sticky summary rail carrying the total and the picked lines, because a line's amount,
   price and note belong next to the number they add up to. */
let TILL={ draft:null, tab:'browse', search:'', brewOpen:{}, noteOpen:{} };
function blankSaleBilling(){ return { name:'',ico:'',dic:'',street:'',no:'',city:'',zip:'',dueDate:daysFromNow(14),paidDate:null }; }
function viewSaleEditor(id){
  if(id){ const s=DB.sales.find(x=>x.id===id); if(!s) return notFound('Prodej');
    // A completed sale is frozen — reaching its edit URL directly must not present a form.
    if(!saleDraft(s)){ setTimeout(()=>go('sales/'+s.id),0);
      return `<div class="page"><div class="empty"><div>${icon('shield',36)}</div><div class="t">Dokončený prodej nelze upravovat</div>
        <div>Zboží už bylo odečteno ze skladu.</div></div></div>`; }
    TILL.draft={ ...s, billing:s.billing?{...s.billing}:blankSaleBilling(), items:s.items.map(i=>({...i})) };
  } else {
    TILL.draft={ id:null, publicId:null, date:SEED_TODAY, state:'Draft', buyerKind:'Walkin', clientId:null, buyerName:'',
      payment:'Cash', billing:blankSaleBilling(), items:[], note:'', soldBy:ME.id, completedAt:null };
  }
  TILL.tab='browse'; TILL.search=''; TILL.brewOpen={}; TILL.noteOpen={};
  AFTER=tillWire; return tillHTML();
}
function tillWire(){
  const c=$('#till-client'); if(c) c.onchange=()=>{ tillSync(); TILL.draft.clientId=c.value||null; tillPrefillFromClient(); tillRerender(); };
  const s=$('#till-search'); if(s) s.oninput=()=>{ TILL.search=s.value; tillRerenderCatalog(); };
}
function tillRerender(){ tillSync(); $('#view').innerHTML=tillHTML(); tillWire(); }
function tillSync(){
  const d=TILL.draft; if(!d) return;
  if($('#till-date')) d.date=$('#till-date').value;
  if($('#till-buyer')) d.buyerName=$('#till-buyer').value;
  if($('#till-note')) d.note=$('#till-note').value;
  ['name','ico','dic','street','no','city','zip'].forEach(k=>{ const el=$('#till-inv-'+k); if(el) d.billing[k]=el.value; });
  if($('#till-due')) d.billing.dueDate=$('#till-due').value;
}
/* Only empty fields are filled, so a billing block already typed by hand is never
   overwritten by picking the client. */
function tillPrefillFromClient(){
  const d=TILL.draft; const c=clientById(d.clientId); if(!c) return;
  const a=c.officialAddress||{};
  d.billing.name=d.billing.name||c.businessName||c.name;
  d.billing.street=d.billing.street||a.streetName||''; d.billing.no=d.billing.no||a.streetNumber||'';
  d.billing.city=d.billing.city||a.city||''; d.billing.zip=d.billing.zip||a.zip||'';
  if(d.payment==='Invoice') toast('Fakturační údaje předvyplněny z klienta','copy');
}
function tillSetBuyerKind(k){ tillSync(); TILL.draft.buyerKind=k; if(k==='Walkin') TILL.tab='browse'; tillRerender(); }
function tillSetPayment(p){ tillSync(); TILL.draft.payment=p;
  if(p==='Invoice'&&TILL.draft.buyerKind==='Client'&&TILL.draft.clientId&&!TILL.draft.billing.name) tillPrefillFromClient();
  tillRerender(); }
function tillSetTab(t){ TILL.tab=t; tillRerenderCatalog(); }
function tillHTML(){
  const d=TILL.draft;
  const overStock=d.items.filter(it=>it.quantity>saleStock(it.inventoryId));
  const actions=`<button class="btn btn-ghost" onclick="tillCancel()">Zrušit</button>
    <button class="btn btn-ghost" onclick="tillSave(false)">Uložit rozpracovaný</button>
    <button class="btn btn-primary" onclick="tillSave(true)" ${overStock.length?`disabled title="Na skladě není dost kusů: ${esc(overStock.map(i=>i.name).join(', '))}"`:''}>${icon('check',16)}Dokončit prodej</button>`;
  return `<div class="page">
    ${detailHead(d.id?('sales/'+d.id):'sales','Zpět na prodeje',d.id?'Úprava prodeje':'Nový prodej',
      {lead:d.id?saleNumber(d):'',leadMono:true,meta:['Vyberte zboží ze skladu, kupujícího a způsob platby.'],actions})}
    <div class="grid" style="grid-template-columns:1.5fr 1fr;align-items:start">
      <div class="stack" style="gap:14px">${tillBuyerCard()}${tillItemsCard()}</div>
      <div style="position:sticky;top:16px">${tillSummaryCard()}</div>
    </div></div>`;
}
function tillCancel(){ go(TILL.draft&&TILL.draft.id?('sales/'+TILL.draft.id):'sales'); }
/* Buyer and payment share one card: they are the same decision at the counter — who is
   this and how are they paying — and splitting them pushed the invoice fields a whole card
   away from the name they belong to. */
function tillBuyerCard(){
  const d=TILL.draft;
  const clientOpts=[['','Vyberte klienta'],...DB.clients.map(c=>[c.id,c.name+(c.businessName?' · '+c.businessName:'')])];
  const hint=d.payment==='Invoice'
    ? (d.buyerKind==='Client'?'Fakturační údaje se předvyplní z klienta.':'Fakturu vystavíte na údaje níže.')
    : (d.buyerKind==='Client'?'Placeno na místě — fakturační údaje nejsou potřeba.':'U hotovostního prodeje nepovinné.');
  return `<div class="card"><div class="card-head">${icon('client',16)}<h3>Kupující a platba</h3></div>
    <div class="card-pad stack" style="gap:14px">
      <div class="row wrap" style="justify-content:space-between;gap:12px">
        <div class="seg"><button class="${d.buyerKind==='Client'?'on':''}" onclick="tillSetBuyerKind('Client')">Klient z evidence</button>
          <button class="${d.buyerKind==='Walkin'?'on':''}" onclick="tillSetBuyerKind('Walkin')">Jednorázový kupující</button></div>
        <div class="seg"><button class="${d.payment==='Cash'?'on':''}" onclick="tillSetPayment('Cash')">Hotově</button>
          <button class="${d.payment==='Invoice'?'on':''}" onclick="tillSetPayment('Invoice')">Faktura</button></div>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr">
        ${d.buyerKind==='Client'
          ? field('Klient',sel('till-client',clientOpts,d.clientId||''),{req:true,hint})
          : field('Jméno kupujícího',inp('till-buyer',d.buyerName||'','Josef Vrána'),{hint})}
      </div>
      ${d.payment==='Invoice'?`<div class="section-label" style="margin:2px 0 0">Fakturační údaje</div>
        <div class="form-grid">
          ${field('Název / jméno',inp('till-inv-name',d.billing.name,'Na Rohu gastro s.r.o.'),{req:true,col2:true})}
          ${field('IČO',inp('till-inv-ico',d.billing.ico,'27412885'))}
          ${field('DIČ',inp('till-inv-dic',d.billing.dic,'CZ27412885'))}
          ${field('Ulice',inp('till-inv-street',d.billing.street,'Liberecká'))}
          ${field('Číslo',inp('till-inv-no',d.billing.no,'88'))}
          ${field('Město',inp('till-inv-city',d.billing.city,'Hrádek nad Nisou'))}
          ${field('PSČ',inp('till-inv-zip',d.billing.zip,'463 34'))}
          <!-- Required, not optional: an invoiced sale waits in "Čeká na platbu" until the
               money lands, and without a due date nothing can ever be called overdue. -->
          ${field('Splatnost',`<input class="input" type="date" id="till-due" value="${d.billing.dueDate||''}">`,{req:true,col2:true})}
        </div>`:''}
    </div></div>`;
}
/* ---- the stock catalog ---- */
/* Whose prices apply at the counter: a walk-in has none, so this is null unless a
   saved client is the buyer. Read from TILL rather than passed around because every
   caller of tillRow is already inside the till. */
function tillClientId(){ const d=TILL.draft; return d&&d.buyerKind==='Client'?(d.clientId||null):null; }
function tillRow(inv){ const p=inv.productId?prodById(inv.productId):null;
  const pr=p?priceFor(p,tillClientId()):{ price:null, list:null };
  return { id:inv.id, breweryId:p?p.breweryId:null, name:p?p.name:inv.name, kind:p?p.kind:null,
    packageSize:p?p.packageSize:null, price:pr.price, listPrice:pr.list, stock:inv.quantity }; }
function tillSellable(){ return DB.inventory.filter(i=>i.quantity>0).map(tillRow); }
function tillQtyOf(invId){ const it=TILL.draft.items.find(x=>x.inventoryId===invId); return it?it.quantity:0; }
/* What this client already bought at the counter — re-adding a regular's usual crate lands
   already priced as they last paid rather than at today's ceník. */
function tillHistoryRows(clientId){
  const last={};
  DB.sales.filter(s=>s.clientId===clientId&&!saleDraft(s)).sort((a,b)=>(a.date||'').localeCompare(b.date||''))
    .forEach(s=>s.items.forEach(it=>{ last[it.inventoryId]={ date:s.date, price:it.unitPrice, qty:it.quantity }; }));
  return tillSellable().filter(r=>last[r.id]).map(r=>({ ...r, last:last[r.id] }));
}
function tillSearchOk(r){ const q=saleNorm(TILL.search); return !q||saleNorm(r.name).includes(q); }
function tillItemsCard(){
  const d=TILL.draft;
  return `<div class="card"><div class="card-head">${icon('cart',16)}<h3>Položky</h3>
      <span class="tag" style="margin-left:auto">${d.items.length} ${plural(d.items.length,'položka','položky','položek')}</span></div>
    <div class="card-pad"><div id="till-catalog">${tillCatalog()}</div></div></div>`;
}
/* Re-rendered on its own so typing in the search box does not rebuild the whole page; the
   caret is put back where it was, as the order editor's catalog does. */
function tillRerenderCatalog(){ const w=$('#till-catalog'); if(!w) return; w.innerHTML=tillCatalog();
  const s=$('#till-search'); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length);
    s.oninput=()=>{ TILL.search=s.value; tillRerenderCatalog(); }; } }
function tillCatalog(){
  const d=TILL.draft;
  // The history tab exists only when there is a client to have a history — a walk-in gets
  // the browse tab alone, with no segmented control at all.
  const showHistory=d.buyerKind==='Client'&&!!d.clientId;
  const tab=showHistory?TILL.tab:'browse';
  const hist=showHistory?tillHistoryRows(d.clientId):[];
  const tabs=showHistory?`<div class="seg" style="margin-bottom:12px">
    <button class="${tab==='browse'?'on':''}" onclick="tillSetTab('browse')">Procházet sklad</button>
    <button class="${tab==='history'?'on':''}" onclick="tillSetTab('history')">Dříve prodané${hist.length?` <span style="opacity:.55">${hist.length}</span>`:''}</button></div>`:'';
  const search=`<div class="fld" style="margin-bottom:12px">${icon('search',16)}<input id="till-search" placeholder="Hledat ve skladu…" value="${esc(TILL.search)}"></div>`;
  let body='';
  if(tab==='history'){
    const rows=hist.filter(tillSearchOk);
    body=rows.length?`<div class="stack" style="gap:9px">${rows.map(r=>tillStockRow(r)).join('')}</div>`
      :`<div class="empty" style="padding:26px"><div class="t">${hist.length?'Nic neodpovídá hledanému výrazu.':'Tento klient u pultu zatím nic nekoupil.'}</div></div>`;
  } else {
    const all=tillSellable().filter(tillSearchOk);
    body=DB.breweries.map(b=>{ const rows=all.filter(r=>r.breweryId===b.id); if(!rows.length) return '';
      return tillPanel(b.id,b.name,b.color,rows); }).join('');
    const free=all.filter(r=>!r.breweryId);
    if(free.length) body+=tillPanel('__free','Ostatní','var(--text-3)',free);
    if(!body) body=`<div class="empty" style="padding:26px"><div class="t">${tillSellable().length?'Nic neodpovídá hledanému výrazu.':'Na skladě není nic k prodeji.'}</div></div>`;
  }
  return tabs+search+body;
}
/* One brewery as a collapsible bordered card — the products clearly live *within* the
   brewery rather than beside it. Mirrors the order editor's catalog. */
function tillPanel(key,name,color,rows){
  const open=TILL.brewOpen[key]!==false;
  const groups=[]; const idx={};
  rows.forEach(r=>{ if(idx[r.name]==null){ idx[r.name]=groups.length; groups.push({name:r.name,items:[r]}); } else groups[idx[r.name]].items.push(r); });
  return `<div style="border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px">
    <button class="row gap8" style="width:100%;background:var(--surface-2);border:0;${open?'border-bottom:1px solid var(--border);':''}padding:10px 12px;font-weight:700"
      onclick="TILL.brewOpen['${key}']=${!open};tillRerenderCatalog()" aria-expanded="${open}">
      <span style="transform:rotate(${open?90:0}deg);transition:.18s;color:var(--text-3);display:inline-flex">${icon('chevR',16)}</span>
      <span class="dotc" style="width:10px;height:10px;border-radius:3px;background:${color}"></span>${esc(name)}
      <span class="t-mut" style="font-weight:600;margin-left:6px">${rows.length}</span></button>
    ${open?`<div style="padding:12px;background:var(--surface-2)"><div class="stack" style="gap:9px">
      ${groups.map(g=>g.items.length>1?tillVariantCard(g,color):tillStockRow(g.items[0],color)).join('')}</div></div>`:''}</div>`;
}
/* A bare + until the row is in the cart, then − n +. Every label names its item: a catalog
   page is dozens of these, and a screen reader working through identical "Přidat" buttons
   has no way to tell which beer it is about to add. */
function tillQtyCtrl(r){
  const q=tillQtyOf(r.id); const label=esc(r.name+(r.packageSize!=null?' '+fmtLiters(r.packageSize):''));
  // An agreed client price beats what the client last paid: the first is a decision, the
  // second only an observation. The history row still *shows* the last price — that is the
  // point of the segment — but adding from it lands on the agreed one, so the same product
  // cannot cost two different amounts depending on which segment it was added from.
  // Quantity still comes from history: re-adding a regular's usual crate.
  const addPrice=r.listPrice!=null?r.price:(r.last?r.last.price:null);
  const addQty=r.last?r.last.qty:null;
  const add=`tillAdd('${r.id}',${addPrice==null?'null':addPrice},${addQty==null?'null':addQty})`;
  if(!q) return `<button class="btn btn-soft btn-sm" style="flex:0 0 auto" onclick="${add}" aria-label="Přidat ${label}">${icon('plus',14)}Přidat</button>`;
  return `<div class="row gap8" style="flex:0 0 auto">

}

function tillCart(){
