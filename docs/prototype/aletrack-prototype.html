function estWeight(p){ if(!p) return 0; if(p.kind==='Keg') return (p.packageSize||30)*1.05+8; if(p.kind==='Bottle') return (p.packageSize||0.5)*20*1.1; if(p.kind==='Can'||p.kind==='Multipack') return (p.packageSize||6)*1.05; return 5; }
function advanceShip(id,to){ const s=DB.shipments.find(x=>x.id===id); s.state=to;
  if(to==='Delivered'){ s.stops.forEach(st=>{ const o=DB.orders.find(x=>x.id===st.orderId); if(o){o.state='Finished';o.actualDeliveryDate=daysFromNow(0);} });
    toast('Vývoz doručen — objednávky dokončeny','check'); } else if(to==='InTransit'){ s.stops.forEach(st=>{const o=DB.orders.find(x=>x.id===st.orderId); if(o)o.state='Delivering';}); toast('Vývoz vyrazil'); } else toast('Stav aktualizován');
  renderRoute(); }

/* ---- Shipment planner ---- */
let SH={ draft:null, drag:null, regionFilter:'all' };
function shipmentUsedOrderIds(exceptId){ const set=new Set(); DB.shipments.forEach(s=>{ if(s.id===exceptId)return; s.stops.forEach(st=>set.add(st.orderId)); }); return set; }
function viewShipmentEditor(id){
  if(id){ const s=DB.shipments.find(x=>x.id===id); SH.draft={ id:s.id, number:s.number, name:s.name, deliveryDate:s.deliveryDate, vehicleId:s.vehicleId,
    driverIds:[...s.driverIds], stops:s.stops.map(st=>({...st})), extraCustom:(s.extraCustom||[]).map(e=>({...e})) }; }
  else SH.draft={ id:null, name:'', deliveryDate:daysFromNow(2)+'T07:00', vehicleId:null, driverIds:[], stops:[], extraCustom:[] };
  SH.regionFilter='all';
  return seHTML();
}
function seRerender(){ $('#view').innerHTML=seHTML(); }
function seHTML(){
  const d=SH.draft;
  const used=shipmentUsedOrderIds(d.id);
  const avail=DB.orders.filter(o=>['New','Planning','Delivering'].includes(o.state)&&(!used.has(o.id)||d.stops.some(st=>st.orderId===o.id)));
  const stopsSorted=d.stops.slice().sort((a,b)=>a.order-b.order);
  const pts=shipStopPoints(d.stops);
  const veh=vehicleById(d.vehicleId);
  const totalWeight=stopsSorted.reduce((w,st)=>{const o=DB.orders.find(x=>x.id===st.orderId);return w+ (o?o.items.reduce((x,it)=>x+estWeight(prodById(it.productId))*it.quantity,0):0);},0);
  // available orders list — region filter
  const regionsPresent=[...new Set(avail.map(o=>clientById(o.clientId).region))].sort((a,b)=>(L.region[a]||a).localeCompare(L.region[b]||b));
  if(SH.regionFilter!=='all'&&!regionsPresent.includes(SH.regionFilter)) SH.regionFilter='all';
  const regionSelect=`<select class="select" style="width:auto;height:32px;flex:0 0 auto;font-size:12.5px" onchange="seSetRegion(this.value)">
    <option value="all" ${SH.regionFilter==='all'?'selected':''}>Vše (${avail.length})</option>
    ${regionsPresent.map(r=>{const n=avail.filter(o=>clientById(o.clientId).region===r).length;
      return `<option value="${r}" ${SH.regionFilter===r?'selected':''}>${L.region[r]||r} (${n})</option>`;}).join('')}</select>`;
  const availShown=avail.filter(o=>SH.regionFilter==='all'||clientById(o.clientId).region===SH.regionFilter||d.stops.some(st=>st.orderId===o.id));
  const availList=availShown.map(o=>{ const cl=clientById(o.clientId); const inRoute=d.stops.some(st=>st.orderId===o.id); const t=orderTotals(o);
    return `<label class="row gap12" style="padding:11px;border:1px solid ${inRoute?'var(--amber)':'var(--border)'};border-radius:var(--r);cursor:pointer;${inRoute?'background:var(--amber-soft)':''}">
      <input type="checkbox" ${inRoute?'checked':''} onchange="seToggleOrder('${o.id}')" style="width:17px;height:17px;accent-color:var(--amber)">
      <span class="dotc" style="width:10px;height:10px;border-radius:99px;background:${colorFor(cl.id)}"></span>
      <div style="flex:1;min-width:0"><div class="t-strong" style="font-size:13.5px">${esc(cl.name)}</div>
        <div class="t-mut" style="font-size:12px">${o.number} · ${t.items} ks · ${o.requiredDeliveryDate?fdate(o.requiredDeliveryDate):'bez termínu'}</div>
        <span class="tag" style="margin-top:4px">${icon('pin',11)}${L.region[cl.region]||cl.region}</span></div>
      ${pill('order',o.state)}</label>`; }).join('')||`<div class="empty" style="padding:24px"><div class="t">V tomto regionu nejsou objednávky</div>
        ${SH.regionFilter!=='all'?`<button class="btn btn-sm btn-ghost" style="margin-top:10px" onclick="seSetRegion('all')">Zobrazit vše</button>`:''}</div>`;
  // ordered stops (draggable)
  const stopRows=stopsSorted.map((st,i)=>{ const cl=clientById(st.clientId); const o=DB.orders.find(x=>x.id===st.orderId);
    return `<div class="row gap8" draggable="true" ondragstart="SH.drag='${st.orderId}'" ondragover="event.preventDefault()" ondrop="seDropOn('${st.orderId}')"
      style="padding:10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:grab">
      <span style="color:var(--text-3)">${icon('drag',16)}</span>
      <span class="av" style="width:28px;height:28px;background:${colorFor(cl.id)};color:#fff;font-size:12px">${i+1}</span>
      <div style="flex:1;min-width:0"><div class="t-strong" style="font-size:13px">${esc(cl.name)}</div>
        <div class="t-mut" style="font-size:11.5px">${o?o.number:''}</div></div>
      <select class="select" style="width:130px;height:32px;flex:0 0 auto" onchange="seAddrKind('${st.orderId}',this.value)">
        <option value="Official" ${st.addressKind==='Official'?'selected':''}>Fakturační</option>
        ${cl.contactAddress?`<option value="Contact" ${st.addressKind==='Contact'?'selected':''}>Kontaktní</option>`:''}</select>
      <button class="icon-btn" style="width:30px;height:30px" onclick="seMove('${st.orderId}',-1)" ${i===0?'disabled':''}>${icon('arrowU',13)}</button>
      <button class="icon-btn" style="width:30px;height:30px" onclick="seMove('${st.orderId}',1)" ${i===stopsSorted.length-1?'disabled':''}>${icon('arrowD',13)}</button>
      <button class="icon-btn" style="width:30px;height:30px;color:var(--crit)" onclick="seRemoveStop('${st.orderId}')">${icon('trash',13)}</button></div>`; }).join('');
  const driverChips=DB.drivers.map(dr=>{ const on=d.driverIds.includes(dr.id); const free=driverAvailableOn(dr,d.deliveryDate);
    return `<button class="chip" style="height:34px;border-color:${on?dr.color:'var(--border)'};${on?`background:${dr.color}18`:''}" onclick="seToggleDriver('${dr.id}')">
      <span class="dotc" style="width:10px;height:10px;border-radius:99px;background:${dr.color}"></span>${esc(dr.firstName)} ${esc(dr.lastName)}
      ${on?`<span style="color:${dr.color}">${icon('check',13)}</span>`:free?'':`<span title="Nedostupný v tento den" style="color:var(--warn)">${icon('warnTri',13)}</span>`}</button>`; }).join('');
  return `<div class="page">
    ${crumbs([{t:'Vývozy',href:'#/shipments'},{t:d.id?('Úprava '+d.number):'Nový vývoz'}])}
    ${pageHead('Prodej', d.id?('Úprava vývozu'):'Naplánovat vývoz','Vyberte objednávky, seřaďte zastávky a přiřaďte vůz a řidiče.',
      `<button class="btn btn-ghost" onclick="history.back()">Zrušit</button><button class="btn btn-primary" onclick="seSave()">${icon('check',16)}${d.id?'Uložit':'Vytvořit vývoz'}</button>`)}
    <div class="grid" style="grid-template-columns:1.4fr 1fr;align-items:start">
      <div class="stack" style="gap:16px">
        ${routeMap(pts,{h:340,animate:false})}
        <div class="card"><div class="card-head">${icon('route',16)}<h3>Pořadí zastávek</h3>
          ${d.stops.length>1?`<button class="btn btn-sm btn-soft" style="margin-left:auto" onclick="seOptimize()">${icon('sparkle',14)}Optimalizovat trasu</button>`:''}</div>
          <div class="card-pad stack" style="gap:9px">${stopRows||'<div class="t-mut" style="text-align:center;padding:16px">Zatím žádné zastávky — vyberte objednávky vpravo.</div>'}</div></div>
      </div>
      <div class="stack" style="gap:16px">
        <div class="card"><div class="card-pad"><div class="form-grid" style="grid-template-columns:1fr">
          ${field('Název vývozu',inp('se-name',d.name,'Rozvoz Žitava + Hrádek'),{req:true})}
          ${field('Datum a čas',`<input class="input" type="datetime-local" id="se-date" value="${(d.deliveryDate||'').slice(0,16)}" onchange="SH.draft.deliveryDate=this.value;seRerender()">`)}
          ${field('Vůz',sel('se-veh',[['','— vyberte vůz —'],...DB.vehicles.map(v=>[v.id,v.name])],d.vehicleId||''))}
        </div>
        ${veh?`<div class="row" style="justify-content:space-between;margin-top:6px"><span class="t-mut" style="font-size:12.5px">Náklad / nosnost</span>
          <span class="tnum t-strong" style="color:${totalWeight>veh.maxWeight?'var(--crit)':'var(--ok)'}">${Math.round(totalWeight)} / ${num(veh.maxWeight)} kg</span></div>`:''}
        </div></div>
        <div class="card"><div class="card-head"><h3>Řidiči</h3></div><div class="card-pad" style="display:flex;flex-wrap:wrap;gap:8px">${driverChips}</div></div>
        <div class="card"><div class="card-head">${icon('order',16)}<h3>Objednávky k rozvozu</h3>
            <span class="tag">${d.stops.length}/${avail.length}</span><span style="margin-left:auto">${regionSelect}</span></div>
          <div class="card-pad stack" style="gap:9px;max-height:440px;overflow-y:auto">${availList}</div></div>
      </div></div></div>`;
}
function seSetRegion(r){ seSyncMeta(); SH.regionFilter=r; seRerender(); }
function driverAvailableOn(dr,dt){ if(!dt)return true; const day=dt.slice(0,10); return dr.availabilities.some(a=>a.from.slice(0,10)===day); }
function seSyncMeta(){ if($('#se-name'))SH.draft.name=$('#se-name').value; if($('#se-veh'))SH.draft.vehicleId=$('#se-veh').value||null; }
function seToggleOrder(orderId){ seSyncMeta(); const d=SH.draft; const ex=d.stops.find(s=>s.orderId===orderId);
  if(ex) d.stops=d.stops.filter(s=>s.orderId!==orderId);
  else { const o=DB.orders.find(x=>x.id===orderId); d.stops.push({ orderId, clientId:o.clientId, addressKind:'Official', order:d.stops.length+1 }); }
  reseq(); seRerender(); }
function reseq(){ SH.draft.stops.slice().sort((a,b)=>a.order-b.order).forEach((s,i)=>s.order=i+1); }
function seMove(orderId,dir){ seSyncMeta(); const arr=SH.draft.stops.slice().sort((a,b)=>a.order-b.order); const i=arr.findIndex(s=>s.orderId===orderId);
  const j=i+dir; if(j<0||j>=arr.length)return; [arr[i].order,arr[j].order]=[arr[j].order,arr[i].order]; seRerender(); }
function seDropOn(targetId){ const arr=SH.draft.stops.slice().sort((a,b)=>a.order-b.order); const from=arr.findIndex(s=>s.orderId===SH.drag); const to=arr.findIndex(s=>s.orderId===targetId);
  if(from<0||to<0||from===to)return; const [m]=arr.splice(from,1); arr.splice(to,0,m); arr.forEach((s,i)=>s.order=i+1); SH.drag=null; seRerender(); }
function seRemoveStop(orderId){ seSyncMeta(); SH.draft.stops=SH.draft.stops.filter(s=>s.orderId!==orderId); reseq(); seRerender(); }
function seAddrKind(orderId,kind){ SH.draft.stops.find(s=>s.orderId===orderId).addressKind=kind; seRerender(); }
function seToggleDriver(id){ seSyncMeta(); const a=SH.draft.driverIds; const i=a.indexOf(id); if(i>=0)a.splice(i,1); else a.push(id); seRerender(); }
function seOptimize(){ seSyncMeta(); const arr=SH.draft.stops.slice(); if(arr.length<2){toast('Málo zastávek');return;}
  const pt=st=>{const a=stopAddress(st);return {lat:a.latitude,lng:a.longitude};};
  let cur={lat:DEPOT.lat,lng:DEPOT.lng}; const rem=[...arr]; const out=[];
  while(rem.length){ let bi=0,bd=1e9; rem.forEach((s,i)=>{const dd=haversine(cur,pt(s));if(dd<bd){bd=dd;bi=i;}}); const n=rem.splice(bi,1)[0]; out.push(n); cur=pt(n); }
  out.forEach((s,i)=>s.order=i+1); SH.draft.stops=out; seRerender(); toast('Trasa optimalizována (nejbližší soused)','sparkle'); }
function seSave(){ seSyncMeta(); const d=SH.draft; if(!d.name)return toast('Zadejte název','warnTri'); if(!d.stops.length)return toast('Přidejte alespoň jednu zastávku','warnTri');
  const build=st=>{ const o=DB.orders.find(x=>x.id===st.orderId); return { ...st, items:o.items.map(it=>({orderItemId:it.id,productId:it.productId,quantity:it.quantity,loaded:false})) }; };
  if(d.id){ const s=DB.shipments.find(x=>x.id===d.id); Object.assign(s,{ name:d.name,deliveryDate:d.deliveryDate,vehicleId:d.vehicleId,driverIds:d.driverIds,stops:d.stops.map(build),extraCustom:d.extraCustom }); toast('Vývoz uložen'); go('shipments/'+d.id); }
  else { const s={ id:'s-'+Math.random().toString(36).slice(2,7), number:'VYV-2026-'+(53+DB.shipments.length), name:d.name, state:'Created',
    deliveryDate:d.deliveryDate, vehicleId:d.vehicleId, driverIds:d.driverIds, stops:d.stops.map(build), extraCustom:d.extraCustom };
    d.stops.forEach(st=>{const o=DB.orders.find(x=>x.id===st.orderId); if(o&&o.state==='New')o.state='Planning';});
    DB.shipments.push(s); toast('Vývoz naplánován'); go('shipments/'+s.id); }
}

/* ============ MODULE: DOVOZY ZBOŽÍ (PRODUCT DELIVERIES) ============ */
function deliveryTotals(d){ let items=0; d.stops.forEach(s=>s.items.forEach(i=>items+=i.quantity)); return items; }
function viewDeliveries(){
  const list=DB.deliveries.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const rows=list.map(d=>{ const veh=vehicleById(d.vehicleId);
    return `<tr class="clickable" onclick="go('deliveries/${d.id}')"><td><span class="mono t-strong">${d.number}</span></td>
      <td>${fdate(d.date)}</td><td>${pill('delivery',d.state)}</td>
      <td>${d.stops.map(s=>{const b=breweryById(s.breweryId);return `<span class="tag"><span class="dotc" style="background:${b.color}"></span>${esc(b.name.replace('Pivovar ','').replace('Brauerei','').trim())}</span>`;}).join(' ')}</td>
      <td class="num tnum">${deliveryTotals(d)} ks</td>
      <td>${veh?`<span class="tag">${icon('vehicle',12)}${esc(veh.name.split('(')[0])}</span>`:'<span class="t-mut">—</span>'}</td>
      <td style="text-align:right">${icon('chevR',16)}</td></tr>`; }).join('');
  return `<div class="page">
    ${pageHead('Sklad','Dovozy zboží','Navážení zboží z pivovarů na firemní sklad.', canEdit('deliveries')?addBtn('Nový dovoz','deliveries/new'):'')}
    <div class="toolbar"><span class="count-note">${list.length} dovozů</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Číslo</th><th>Datum</th><th>Stav</th><th>Pivovary</th><th style="text-align:right">Kusů</th><th>Vůz</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}
function viewDeliveryDetail(id){
  id=id.split('?')[0]; const d=DB.deliveries.find(x=>x.id===id); if(!d) return notFound('Dovoz');
  const ed=canEdit('deliveries'); const veh=vehicleById(d.vehicleId); const done=d.state==='Finished';
  const stopCards=d.stops.map((s,i)=>{ const b=breweryById(s.breweryId);
    return `<div class="card"><div class="card-pad">
      <div class="row gap12" style="margin-bottom:10px"><span class="av" style="background:${b.color}22;color:${b.color}">${icon('brewery',18)}</span>
        <div style="flex:1"><div class="t-strong">${esc(b.name)}</div><div class="t-mut" style="font-size:12.5px">${fmtAddr(b.officialAddress)}</div></div>
        ${s.note?`<span class="tag">${icon('note',12)}${esc(s.note)}</span>`:''}</div>
      <div class="tbl-wrap" style="border:0"><table class="tbl" style="min-width:0"><thead><tr><th>Produkt</th><th style="text-align:right">Množství</th><th>Pozn.</th></tr></thead>
        <tbody>${s.items.map(it=>{const p=prodById(it.productId);return `<tr><td class="t-strong" style="padding:8px 12px">${esc(p.name)}</td>
          <td class="num tnum" style="padding:8px 12px">${it.quantity} ks</td><td style="padding:8px 12px" class="t-mut">${esc(it.note||'')}</td></tr>`;}).join('')}</tbody></table></div></div></div>`; }).join('');
  return `<div class="page">
    ${crumbs([{t:'Dovozy zboží',href:'#/deliveries'},{t:d.number}])}
    <div class="page-head"><div class="titles"><div class="eyebrow">Dovoz z pivovarů</div><h1>${d.number}</h1>
      <div class="sub">${fdate(d.date)} · ${d.stops.length} ${plural(d.stops.length,'pivovar','pivovary','pivovarů')}</div></div>
      <div class="actions">${pill('delivery',d.state)}
        ${ed&&d.state==='InPlanning'?`<button class="btn btn-soft" onclick="advanceDelivery('${id}','OnTheWay')">${icon('vehicle',16)}Vyrazit</button>`:''}
        ${ed&&d.state==='OnTheWay'?`<button class="btn btn-primary" onclick="finishDelivery('${id}')">${icon('stock',16)}Dokončit → naskladnit</button>`:''}
        ${ed&&!done?`<a class="btn btn-ghost" href="#/deliveries/${id}/edit">${icon('edit',16)}Upravit</a>`:''}</div></div>
    ${done?`<div class="card" style="margin-bottom:16px;background:var(--ok-tint);border-color:transparent"><div class="card-pad row gap12">
      <span style="color:var(--ok)">${icon('check',20)}</span><div><div class="t-strong">Naskladněno</div>
      <div class="t-mut" style="font-size:13px">${deliveryTotals(d)} kusů bylo propsáno na sklad.</div></div>
      <a class="btn btn-sm btn-ghost" href="#/inventory" style="margin-left:auto">Zobrazit sklad</a></div></div>`:''}
    <div style="margin-bottom:16px">${routeMap(deliveryStopPoints(d.stops),{h:320,animate:d.state==='OnTheWay'})}</div>
    <div class="grid" style="grid-template-columns:1.5fr 1fr;align-items:start">
      <div class="stack" style="gap:14px"><div class="section-label">Zastávky (${d.stops.length})</div>${stopCards}</div>
      <div class="stack" style="gap:14px">
        <div class="card"><div class="card-head"><h3>Vůz a řidiči</h3></div><div class="card-pad stack" style="gap:12px">
          <div class="kv"><span class="k">Vůz</span><span class="v">${veh?esc(veh.name):'—'}</span></div>
          <div><span class="k" style="font-size:11.5px;color:var(--text-3);font-weight:600">Řidiči</span><div class="row wrap gap8" style="margin-top:6px">
            ${d.driverIds.map(did=>{const dr=driverById(did);return `<span class="chip"><span class="dotc" style="width:9px;height:9px;border-radius:99px;background:${dr.color}"></span>${esc(dr.firstName)} ${esc(dr.lastName)}</span>`;}).join('')||'<span class="t-mut">—</span>'}</div></div>
        </div></div>
        ${d.note?`<div class="card"><div class="card-head"><h3>Poznámka</h3></div><div class="card-pad addr">${esc(d.note)}</div></div>`:''}
        <div class="card"><div class="card-head"><h3>Souhrn</h3></div><div class="card-pad"><div class="tiles" style="grid-template-columns:1fr 1fr">
          ${miniStat('Kusů celkem',deliveryTotals(d),'box')}${miniStat('Pivovarů',d.stops.length,'brewery')}</div></div></div>
      </div></div></div>`;
}
function advanceDelivery(id,to){ DB.deliveries.find(x=>x.id===id).state=to; toast(to==='OnTheWay'?'Dovoz vyrazil':'Stav aktualizován'); renderRoute(); }
function finishDelivery(id){ const d=DB.deliveries.find(x=>x.id===id);
  const preview=[]; d.stops.forEach(s=>s.items.forEach(it=>{ const p=prodById(it.productId); const inv=DB.inventory.find(i=>i.productId===it.productId);
    preview.push({ name:p.name, qty:it.quantity, before:inv?inv.quantity:0, after:(inv?inv.quantity:0)+it.quantity }); }));
  openOverlay(`<div class="modal-head">${icon('stock',20)}<h3>Naskladnit dovoz ${d.number}</h3><button class="icon-btn" data-scrim-close>${icon('close',16)}</button></div>
    <div class="modal-body"><p style="margin:0 0 14px;color:var(--text-2)">Po dokončení se tyto položky připíšou na sklad:</p>
      <div class="tbl-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>Produkt</th><th style="text-align:right">Skladem</th><th style="text-align:right">Dovoz</th><th style="text-align:right">Nově</th></tr></thead>
      <tbody>${preview.map(r=>`<tr><td class="t-strong">${esc(r.name)}</td><td class="num tnum t-mut">${r.before}</td>
        <td class="num tnum" style="color:var(--ok)">+${r.qty}</td><td class="num tnum t-strong">${r.after}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" data-scrim-close>Zrušit</button><button class="btn btn-primary" id="fin-yes">${icon('check',16)}Dokončit a naskladnit</button></div>`,{center:true});
  $('#fin-yes').onclick=()=>{ d.stops.forEach(s=>s.items.forEach(it=>{ const inv=DB.inventory.find(i=>i.productId===it.productId);
    if(inv) inv.quantity+=it.quantity; else DB.inventory.push({ id:'inv-'+Math.random().toString(36).slice(2,7), productId:it.productId, name:null, quantity:it.quantity, note:null }); }));
    d.state='Finished'; closeOverlay(); toast('Dovoz naskladněn na sklad','stock'); renderRoute(); };
  $$('[data-scrim-close]').forEach(x=>x.onclick=closeOverlay);
}
/* ---- Delivery editor ---- */
let DE={ draft:null, brewQuery:'', ui:{} };
function deStopUI(sid){ if(!DE.ui[sid]) DE.ui[sid]={q:'',kind:'all'}; return DE.ui[sid]; }
function viewDeliveryEditor(id){
  if(id){ const d=DB.deliveries.find(x=>x.id===id); DE.draft={ id:d.id,number:d.number,date:d.date,vehicleId:d.vehicleId,driverIds:[...d.driverIds],note:d.note,
    stops:d.stops.map(s=>({ id:s.id, breweryId:s.breweryId, note:s.note, items:s.items.map(i=>({...i})) })) }; }
  else DE.draft={ id:null,date:daysFromNow(2),vehicleId:null,driverIds:[],note:'',stops:[] };
  DE.brewQuery=''; DE.ui={}; AFTER=deWire;
  return deHTML();
}
function deRerender(){ $('#view').innerHTML=deHTML(); deWire(); }
function deWire(){
  const bi=$('#de-brew-input'); if(bi){ bi.oninput=deBreweryInput; bi.onfocus=deBreweryInput;
    bi.onblur=()=>setTimeout(()=>{ const l=$('#de-brew-list'); if(l) l.innerHTML=''; },160); }
  DE.draft.stops.forEach(s=>deWireStop(s.id));
}
function deWireStop(sid){ const si=$('#de-q-'+sid); if(si) si.oninput=()=>{ deStopUI(sid).q=si.value; deRerenderStopCat(sid); }; }
function deRerenderStop(sid){ const s=DE.draft.stops.find(x=>x.id===sid); const el=$('#de-stop-'+sid); if(el){ el.outerHTML=deStopCard(s); deWireStop(sid); } }
function deRerenderStopCat(sid){ const s=DE.draft.stops.find(x=>x.id===sid); const el=$('#de-cat-'+sid);
  if(el){ el.innerHTML=deStopCatalog(s); const si=$('#de-q-'+sid); if(si){ si.focus(); si.setSelectionRange(si.value.length,si.value.length); } deWireStop(sid); } }
function deSyncMeta(){ if($('#de-date'))DE.draft.date=$('#de-date').value; if($('#de-veh'))DE.draft.vehicleId=$('#de-veh').value||null; if($('#de-note'))DE.draft.note=$('#de-note').value; }

function deHTML(){
  const d=DE.draft;
  const usedBrew=new Set(d.stops.map(s=>s.breweryId));
  const stopCards=d.stops.map(s=>deStopCard(s)).join('');
  const driverChips=DB.drivers.map(dr=>{ const on=d.driverIds.includes(dr.id);
    return `<button class="chip" style="height:34px;border-color:${on?dr.color:'var(--border)'};${on?`background:${dr.color}18`:''}" onclick="deToggleDriver('${dr.id}')">
      <span class="dotc" style="width:10px;height:10px;border-radius:99px;background:${dr.color}"></span>${esc(dr.firstName)} ${esc(dr.lastName)}${on?`<span style="color:${dr.color}">${icon('check',13)}</span>`:''}</button>`; }).join('');
  return `<div class="page">
    ${crumbs([{t:'Dovozy zboží',href:'#/deliveries'},{t:d.id?('Úprava '+d.number):'Nový dovoz'}])}
    ${pageHead('Sklad', d.id?'Úprava dovozu':'Nový dovoz','Vyberte pivovary a produkty k naskladnění. V jednom dovozu lze objet více pivovarů.',
      `<button class="btn btn-ghost" onclick="history.back()">Zrušit</button><button class="btn btn-primary" onclick="deSave()">${icon('check',16)}${d.id?'Uložit':'Vytvořit dovoz'}</button>`)}
    <div class="grid" style="grid-template-columns:1.4fr 1fr;align-items:start">
      <div class="stack" style="gap:14px">
        ${d.stops.length?`<div class="card"><div class="card-head">${icon('route',16)}<h3>Plánovaná trasa svozu</h3>
          <span class="tag" style="margin-left:auto">sklad → pivovary → sklad</span></div>
          <div class="card-pad" style="padding:14px">${routeMap(deliveryStopPoints(d.stops),{h:300,animate:false})}</div></div>`:''}
        <div class="row gap8" style="justify-content:space-between"><div class="section-label" style="margin:0">Pivovary v dovozu (${d.stops.length})</div></div>
        ${deBreweryPicker(usedBrew)}
        ${stopCards||`<div class="empty" style="background:var(--surface);border:1px dashed var(--border-2);border-radius:var(--r-lg)"><div>${icon('brewery',34)}</div><div class="t">Zatím žádný pivovar</div><div>Přidejte pivovar pomocí pole nahoře.</div></div>`}
      </div>
      <div class="stack" style="gap:16px">
        <div class="card"><div class="card-pad"><div class="form-grid" style="grid-template-columns:1fr">
          ${field('Datum dovozu',`<input class="input" type="date" id="de-date" value="${d.date}" onchange="DE.draft.date=this.value">`)}
          ${field('Vůz',sel('de-veh',[['','— vyberte vůz —'],...DB.vehicles.map(v=>[v.id,v.name])],d.vehicleId||''))}
          ${field('Poznámka',txta('de-note',d.note||'','Např. vrátit prázdné sudy…'))}
        </div></div></div>
        <div class="card"><div class="card-head"><h3>Řidiči</h3></div><div class="card-pad" style="display:flex;flex-wrap:wrap;gap:8px">${driverChips}</div></div>
      </div></div></div>`;
}
/* ---- brewery typeahead (above stops) ---- */
function deBreweryPicker(usedBrew){
  const avail=DB.breweries.filter(b=>!usedBrew.has(b.id));
  if(!avail.length) return `<div class="hint" style="padding:2px 2px 4px">Všechny pivovary už jsou v dovozu.</div>`;
  return `<div style="position:relative;margin-bottom:4px">
    <div class="fld">${icon('search',16)}<input id="de-brew-input" autocomplete="off" placeholder="Přidat pivovar — začněte psát název…" value="${esc(DE.brewQuery)}"></div>
    <div id="de-brew-list"></div></div>`;
}
function deBreweryInput(){
  const el=$('#de-brew-input'); if(!el) return; DE.brewQuery=el.value; const q=el.value.toLowerCase().trim();
  const used=new Set(DE.draft.stops.map(s=>s.breweryId));
  const m=DB.breweries.filter(b=>!used.has(b.id)&&(!q||b.name.toLowerCase().includes(q)));
  const list=$('#de-brew-list'); if(!list) return;
  list.innerHTML=`<div style="position:absolute;left:0;right:0;top:100%;margin-top:5px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);z-index:30;max-height:260px;overflow:auto;padding:5px">
    ${m.length?m.map(b=>`<button type="button" class="row gap8" style="width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--r-sm)" onmousedown="dePickBrewery('${b.id}')" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background='none'">
      <span class="dotc" style="width:11px;height:11px;border-radius:3px;background:${b.color};flex:0 0 auto"></span>
      <div style="flex:1;min-width:0"><div class="t-strong" style="font-size:13px">${esc(b.name)}</div>
      <div class="t-mut" style="font-size:11.5px">${productsOf(b.id).length} produktů · ${L.country[b.officialAddress.country]||''}</div></div></button>`).join('')
      :`<div class="t-mut" style="padding:11px;font-size:12.5px">Žádný pivovar neodpovídá „${esc(el.value)}"</div>`}</div>`;
}
function dePickBrewery(bId){ DE.brewQuery=''; deAddStop(bId); }

/* brewery coordinates for the pickup route (warehouse -> breweries -> warehouse) */
function deliveryStopPoints(stops){ return stops.map((s,i)=>{ const b=breweryById(s.breweryId); const a=b.officialAddress;
  return { lat:a.latitude, lng:a.longitude, label:b.name.replace('Pivovar ','').replace('Brauerei','').trim(), seq:i+1, color:b.color }; }); }
/* ---- stop card with embedded catalog (collapsible + reorderable) ---- */
function deStopCard(s){
  const b=breweryById(s.breweryId); const ui=deStopUI(s.id); const cnt=s.items.length; const ks=s.items.reduce((x,i)=>x+i.quantity,0);
  const idx=DE.draft.stops.findIndex(x=>x.id===s.id); const n=DE.draft.stops.length;
  const head=`<div class="card-head" style="cursor:pointer;gap:9px" onclick="deToggleCollapse('${s.id}')">
      <span style="color:var(--text-3);transform:rotate(${ui.collapsed?0:90}deg);transition:.2s;display:inline-flex">${icon('chevR',16)}</span>
      <span class="av" style="width:26px;height:26px;border-radius:8px;background:${b.color}22;color:${b.color};font-size:12px;flex:0 0 auto">${idx+1}</span>
      <h3 style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name)}</h3>
      <span class="tag">${cnt} ${plural(cnt,'položka','položky','položek')} · ${ks} ks</span>
      <button class="icon-btn" style="width:30px;height:30px" onclick="event.stopPropagation();deMoveStop('${s.id}',-1)" ${idx===0?'disabled':''} title="Nahoru">${icon('arrowU',13)}</button>
      <button class="icon-btn" style="width:30px;height:30px" onclick="event.stopPropagation();deMoveStop('${s.id}',1)" ${idx===n-1?'disabled':''} title="Dolů">${icon('arrowD',13)}</button>
      <button class="icon-btn" style="width:30px;height:30px;color:var(--crit)" onclick="event.stopPropagation();deRemoveStop('${s.id}')" title="Odebrat pivovar">${icon('trash',14)}</button></div>`;
  const body=ui.collapsed ? '' : `<div class="card-pad" id="de-cat-${s.id}">${deStopCatalog(s)}</div>`;
  return `<div class="card" id="de-stop-${s.id}">${head}${body}</div>`;
}
function deToggleCollapse(sid){ deStopUI(sid).collapsed=!deStopUI(sid).collapsed; deRerenderStop(sid); }
function deMoveStop(sid,dir){ deSyncMeta(); const a=DE.draft.stops; const i=a.findIndex(s=>s.id===sid); const j=i+dir; if(j<0||j>=a.length)return; [a[i],a[j]]=[a[j],a[i]]; deRerender(); }
function deStopCatalog(s){
  const b=breweryById(s.breweryId); const ui=deStopUI(s.id); const prods=productsOf(b.id);
  const flt=p=>!ui.q||p.name.toLowerCase().includes(ui.q.toLowerCase());
  const kinds=['Keg','Bottle','Can','Multipack','Other']; const kc={}; prods.forEach(p=>{ if(flt(p)) kc[p.kind]=(kc[p.kind]||0)+1; });
  const kindTabs=`<div class="seg wrap" style="margin-bottom:12px;flex-wrap:wrap">
    <button class="${ui.kind==='all'?'on':''}" onclick="deSetKind('${s.id}','all')">Vše</button>
    ${kinds.filter(k=>kc[k]).map(k=>`<button class="${ui.kind===k?'on':''}" onclick="deSetKind('${s.id}','${k}')">${L.kind[k]} <span style="opacity:.6">${kc[k]}</span></button>`).join('')}</div>`;
  const kindOk=p=>ui.kind==='all'||p.kind===ui.kind;
  const shown=prods.filter(p=>flt(p)&&kindOk(p));
  const search=`<div class="fld" style="margin-bottom:12px">${icon('search',16)}<input id="de-q-${s.id}" placeholder="Hledat produkt v pivovaru…" value="${esc(ui.q)}"></div>`;
  const list=shown.length?`<div style="max-height:340px;overflow-y:auto;padding-right:2px">${deGroupList(s,shown)}</div>`
    :`<div class="empty" style="padding:22px"><div class="t">Nic nenalezeno</div></div>`;
  return search+kindTabs+list;
}
function deSetKind(sid,k){ deStopUI(sid).kind=k; deRerenderStopCat(sid); }
function deGroupList(s,prods){
  const groups=[]; const idx={};
  prods.forEach(p=>{ if(idx[p.name]==null){ idx[p.name]=groups.length; groups.push({name:p.name,items:[p]}); } else groups[idx[p.name]].items.push(p); });
  return `<div class="stack" style="gap:9px">${groups.map(g=>g.items.length>1?deVariantCard(s,g):deProductRow(s,g.items[0])).join('')}</div>`;
}
function deQtyCtrl(s,p,item){ return item?`<div class="row gap8" style="flex:0 0 auto"><button class="icon-btn" style="width:30px;height:30px" onclick="deItemQty('${s.id}','${p.id}',-1)">−</button>
    <span class="t-strong tnum" style="min-width:20px;text-align:center">${item.quantity}</span>
    <button class="icon-btn" style="width:30px;height:30px" onclick="deItemQty('${s.id}','${p.id}',1)">+</button></div>`
    :`<button class="btn btn-soft btn-sm" style="flex:0 0 auto" onclick="deAddItem('${s.id}','${p.id}')">${icon('plus',14)}Přidat</button>`; }
function deProductRow(s,p){
  const item=s.items.find(i=>i.productId===p.id);
  return `<div class="row gap12" style="padding:9px 10px;border:1px solid var(--border);border-radius:var(--r);${item?'background:var(--amber-soft);border-color:var(--amber-tint)':''}">
    <div style="flex:1;min-width:0"><div class="t-strong" style="font-size:13px">${esc(p.name)}</div>
      <div class="row gap8 wrap" style="margin-top:4px"><span class="tag">${kindChipText(p.kind)}</span>
        ${p.packageSize!=null?`<span class="tag" style="font-weight:800">${fmtLiters(p.packageSize)}</span>`:''}</div></div>
    ${deQtyCtrl(s,p,item)}</div>`;
}
function deVariantCard(s,g){
  const b=breweryById(g.items[0].breweryId);
  return `<div style="border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
    <div class="row gap8" style="padding:10px 11px;background:var(--surface-2)">
      <span class="dotc" style="width:10px;height:10px;border-radius:3px;background:${b.color};flex:0 0 auto"></span>
      <span class="t-strong" style="font-size:13.5px">${esc(g.name)}</span>
      <span class="tag" style="margin-left:auto">${g.items.length} ${plural(g.items.length,'velikost','velikosti','velikostí')}</span></div>
    ${g.items.map(v=>{ const item=s.items.find(i=>i.productId===v.id);
      return `<div class="row gap8" style="padding:9px 11px;border-top:1px solid var(--border);${item?'background:var(--amber-soft)':''}">
        <span class="tag">${kindChipText(v.kind)}</span>
        <span class="tag" style="font-weight:800">${fmtLiters(v.packageSize)}</span>
        <span class="t-mut" style="font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${esc(v.description||'')}</span>
        ${deQtyCtrl(s,v,item)}</div>`; }).join('')}</div>`;
}
function deAddStop(bId){ deSyncMeta(); DE.draft.stops.push({ id:'ds-'+Math.random().toString(36).slice(2,7), breweryId:bId, note:'', items:[] }); deRerender(); }
function deRemoveStop(sid){ deSyncMeta(); delete DE.ui[sid]; DE.draft.stops=DE.draft.stops.filter(s=>s.id!==sid); deRerender(); }
function deAddItem(sid,pid){ DE.draft.stops.find(s=>s.id===sid).items.push({ productId:pid, quantity:1, note:'' }); deRerenderStop(sid); }
function deItemQty(sid,pid,delta){ const it=DE.draft.stops.find(s=>s.id===sid).items.find(i=>i.productId===pid); if(!it)return; it.quantity+=delta; if(it.quantity<=0)return deRemoveItem(sid,pid); deRerenderStop(sid); }
function deRemoveItem(sid,pid){ const s=DE.draft.stops.find(s=>s.id===sid); s.items=s.items.filter(i=>i.productId!==pid); deRerenderStop(sid); }
function deToggleDriver(id){ deSyncMeta(); const a=DE.draft.driverIds; const i=a.indexOf(id); if(i>=0)a.splice(i,1); else a.push(id); deRerender(); }
function deSave(){ deSyncMeta(); const d=DE.draft; if(!d.stops.length)return toast('Přidejte alespoň jeden pivovar','warnTri');
  if(d.stops.some(s=>!s.items.length))return toast('Každý pivovar musí mít alespoň jeden produkt','warnTri');
  if(d.id){ const dv=DB.deliveries.find(x=>x.id===d.id); Object.assign(dv,{date:d.date,vehicleId:d.vehicleId,driverIds:d.driverIds,note:d.note,stops:d.stops}); toast('Dovoz uložen'); go('deliveries/'+d.id); }
  else { const dv={ id:'d-'+Math.random().toString(36).slice(2,7), number:'DOV-2026-'+(32+DB.deliveries.length), date:d.date, state:'InPlanning',
    vehicleId:d.vehicleId, driverIds:d.driverIds, note:d.note, stops:d.stops }; DB.deliveries.push(dv); toast('Dovoz vytvořen'); go('deliveries/'+dv.id); }
}

/* ============ MODULE: SKLAD (INVENTORY) ============ */
let INV_SEARCH='', INV_BREW='all', INV_LAYOUT='list';
function viewInventory(){
  const ed=canEdit('inventory');
  const totalKs=DB.inventory.reduce((s,i)=>s+i.quantity,0);
  const low=DB.inventory.filter(i=>i.productId&&i.quantity<=3);
  const brewOpts=[['all','Všechny pivovary'],...DB.breweries.map(b=>[b.id,b.name]),['__free','Ostatní (ruční)']];
  AFTER=invWire;
  return `<div class="page">
    ${pageHead('Sklad','Sklad','Evidence zboží na skladě. Naskladňuje dovoz, vyskladňuje vývoz — lze i ručně.',
      ed?`<button class="btn btn-primary" onclick="invForm(null)">${icon('plus',17)}Ruční položka</button>`:'')}
    <div class="card" style="margin-bottom:16px"><div style="display:flex;flex-wrap:wrap;align-items:stretch">
      ${invStat('Položek na skladě',DB.inventory.length,'stock',false,true)}
      ${invStat('Kusů celkem',num(totalKs),'box',false,false)}
      ${invStat('Nízká zásoba',low.length,'warnTri',low.length>0,false)}
      <div style="flex:1 1 340px;min-width:300px;border-left:1px solid var(--border);display:flex;align-items:center;gap:9px;padding:11px 14px;flex-wrap:nowrap">
        <div class="fld" style="flex:1 1 auto;min-width:120px;height:38px">${icon('search',16)}<input id="inv-search" placeholder="Hledat…" value="${esc(INV_SEARCH)}"></div>
        <div style="width:168px;flex:0 0 auto">${sel('inv-brew',brewOpts,INV_BREW)}</div>
        <div class="seg" style="flex:0 0 auto"><button id="inv-lay-list" class="${INV_LAYOUT==='list'?'on':''}" onclick="invSetLayout('list')" title="Seznam">${icon('menu',15)}</button>
          <button id="inv-lay-grid" class="${INV_LAYOUT==='grid'?'on':''}" onclick="invSetLayout('grid')" title="Mřížka">${icon('dash',15)}</button></div>
      </div>
    </div></div>
    <div class="row" style="justify-content:flex-end;margin:-8px 2px 10px"><span class="count-note" id="inv-count">${invCount()} položek</span></div>
    <div id="inv-results">${invResults()}</div></div>`;
}
function invStat(label,val,ic,crit,first){
  return `<div style="flex:0 1 auto;min-width:112px;padding:11px 15px;${first?'':'border-left:1px solid var(--border)'};display:flex;align-items:center;gap:10px">
    <div style="width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;background:${crit?'var(--crit-tint)':'var(--surface-3)'};color:${crit?'var(--crit)':'var(--text-2)'}">${icon(ic,16)}</div>
    <div style="min-width:0"><div class="t-mut" style="font-size:11.5px;font-weight:600;white-space:nowrap">${esc(label)}</div>
      <div class="tnum" style="font-size:19px;font-weight:800;line-height:1.2;${crit?'color:var(--crit)':''}">${val}</div></div></div>`;
}
function invWire(){ const s=$('#inv-search'); if(s) s.oninput=()=>{ INV_SEARCH=s.value; invRerender(); };
  const b=$('#inv-brew'); if(b) b.onchange=()=>{ INV_BREW=b.value; invRerender(); }; }
function invSetLayout(l){ INV_LAYOUT=l; const a=$('#inv-lay-list'),g=$('#inv-lay-grid'); if(a)a.classList.toggle('on',l==='list'); if(g)g.classList.toggle('on',l==='grid'); invRerender(); }
function invRerender(){ const r=$('#inv-results'); if(r) r.innerHTML=invResults(); const c=$('#inv-count'); if(c) c.textContent=invCount()+' položek'; }
function invFiltered(){
  const q=INV_SEARCH.toLowerCase().trim();
  const spec=(INV_BREW!=='all'&&INV_BREW!=='__free');
  const linked=(INV_BREW==='__free')?[]:DB.inventory.filter(i=>i.productId).filter(i=>{ const p=prodById(i.productId); return (!spec||p.breweryId===INV_BREW)&&(!q||p.name.toLowerCase().includes(q)); });
  const free=spec?[]:DB.inventory.filter(i=>!i.productId).filter(i=>!q||(i.name||'').toLowerCase().includes(q));
  return {linked,free};
}
function invCount(){ const {linked,free}=invFiltered(); return linked.length+free.length; }
function invResults(){
  const ed=canEdit('inventory'); const {linked,free}=invFiltered();
  if(!linked.length&&!free.length) return `<div class="empty"><div>${icon('search',34)}</div><div class="t">Nic nenalezeno</div>
    <div>Zkuste jiný filtr nebo hledaný výraz.</div>${(INV_SEARCH||INV_BREW!=='all')?`<button class="btn btn-sm btn-ghost" style="margin-top:12px" onclick="INV_SEARCH='';INV_BREW='all';renderRoute()">Zrušit filtry</button>`:''}</div>`;
  if(INV_LAYOUT==='grid'){
    const all=[...linked,...free];
    return `<div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${all.map(i=>invTile(i,ed)).join('')}</div>`;
  }
  // list layout — grouped by brewery
  const byBrew={}; linked.forEach(i=>{ const p=prodById(i.productId); (byBrew[p.breweryId]=byBrew[p.breweryId]||[]).push(i); });
  const brewSections=DB.breweries.filter(b=>byBrew[b.id]).map(b=>{ const items=byBrew[b.id].sort((x,y)=>KIND_ORDER[prodById(x.productId).kind]-KIND_ORDER[prodById(y.productId).kind]);
    const rows=items.map(i=>{ const p=prodById(i.productId); const lowq=i.quantity<=3;
      return `<tr><td><div class="t-strong">${esc(p.name)}</div><div class="t-mut" style="font-size:12px">${kindChipText(p.kind)}${p.packageSize!=null?' · '+fmtLiters(p.packageSize):''}</div></td>
        <td>${p.priceWithVat?money(p.priceWithVat):'—'}</td>
        <td class="num"><div class="row gap8" style="justify-content:flex-end">${ed?`<button class="icon-btn" style="width:28px;height:28px" onclick="invAdj('${i.id}',-1)">−</button>`:''}
          <span class="tnum t-strong" style="min-width:34px;text-align:center;font-size:15px;${lowq?'color:var(--crit)':''}">${i.quantity}</span>
          ${ed?`<button class="icon-btn" style="width:28px;height:28px" onclick="invAdj('${i.id}',1)">+</button>`:''}</div></td>
        <td>${lowq?'<span class="pill s-crit"><span class="d"></span>nízká zásoba</span>':'<span class="pill s-ok"><span class="d"></span>skladem</span>'}</td>
        <td class="t-mut">${esc(i.note||'')}</td>${ed?`<td style="text-align:right"><button class="icon-btn" style="width:30px;height:30px;color:var(--crit)" onclick="invDel('${i.id}')">${icon('trash',13)}</button></td>`:''}</tr>`; }).join('');
    return `<div style="margin-bottom:8px"><div class="section-label" style="display:flex;align-items:center;gap:8px;margin:16px 0 8px">
      <span class="dotc" style="width:12px;height:12px;border-radius:3px;background:${b.color}"></span>${esc(b.name)}<span class="t-mut">${items.length} položek</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Produkt</th><th>Cena/ks</th><th style="text-align:right">Skladem</th><th>Stav</th><th>Pozn.</th>${ed?'<th></th>':''}</tr></thead><tbody>${rows}</tbody></table></div></div>`; }).join('');
  const freeSection=free.length?`<div style="margin-bottom:8px"><div class="section-label" style="margin:16px 0 8px">${icon('box',14)} Ostatní (ručně evidované)</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Položka</th><th style="text-align:right">Množství</th><th>Pozn.</th>${ed?'<th></th>':''}</tr></thead>

function driverCalendarView(){
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(SEED_TODAY); d.setDate(d.getDate()+i); return d; });
  const H0=6, H1=20, hrs=H1-H0, colH=460;
  const hourLabels=[...Array(hrs+1)].map((_,i)=>`<div style="height:${colH/hrs}px;font-size:10.5px;color:var(--text-3);text-align:right;padding-right:6px;transform:translateY(-6px)">${H0+i}:00</div>`).join('');
  const dayCols=days.map(day=>{ const ds=day.toISOString().slice(0,10); const isToday=ds===SEED_TODAY;
    const blocks=DB.drivers.flatMap(dr=>dr.availabilities.filter(a=>a.from.slice(0,10)===ds).map(a=>{
      const fh=parseInt(a.from.slice(11,13))+parseInt(a.from.slice(14,16))/60, uh=parseInt(a.until.slice(11,13))+parseInt(a.until.slice(14,16))/60;
      const top=Math.max(0,(fh-H0)/hrs*colH), height=Math.max(18,(uh-fh)/hrs*colH);
      return `<div title="${esc(dr.firstName+' '+dr.lastName)} ${a.from.slice(11,16)}–${a.until.slice(11,16)}" style="position:absolute;left:3px;right:3px;top:${top}px;height:${height}px;background:${dr.color}22;border-left:3px solid ${dr.color};border-radius:5px;padding:3px 5px;overflow:hidden;font-size:10.5px;color:var(--text)">
        <div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(dr.lastName)}</div><div style="color:var(--text-2)">${a.from.slice(11,16)}–${a.until.slice(11,16)}</div></div>`; }));
    return `<div style="flex:1;min-width:100px;border-left:1px solid var(--border)">
      <div style="text-align:center;padding:8px 4px;border-bottom:1px solid var(--border);${isToday?'background:var(--amber-soft)':''}">
        <div style="font-size:11px;text-transform:uppercase;color:var(--text-3);font-weight:700">${day.toLocaleDateString('cs-CZ',{weekday:'short'})}</div>
        <div class="tnum" style="font-weight:800;font-size:16px;${isToday?'color:var(--amber-700)':''}">${day.getDate()}.</div></div>
      <div style="position:relative;height:${colH}px">${[...Array(hrs)].map((_,i)=>`<div style="height:${colH/hrs}px;border-bottom:1px solid var(--border);opacity:.5"></div>`).join('')}${blocks.join('')}</div></div>`; }).join('');
  return `<div class="card"><div class="card-pad" style="overflow-x:auto"><div style="display:flex;min-width:760px">
    <div style="width:46px;flex:0 0 auto"><div style="height:53px"></div>${hourLabels}</div>${dayCols}</div>
    <div class="row wrap gap12" style="margin-top:16px">${DB.drivers.map(d=>`<span class="chip"><span class="dotc" style="width:10px;height:10px;border-radius:99px;background:${d.color}"></span>${esc(d.firstName)} ${esc(d.lastName)}</span>`).join('')}</div>
  </div></div>`;
}

      <div class="divider"></div><div class="section-label">Role</div>
      <div class="row gap8" style="margin-bottom:6px">
        <button class="chip" id="role-admin" style="height:36px" onclick="userToggleAdmin()"><span id="role-admin-ic">${USER_DRAFT.roles.includes('Admin')?icon('check',14):''}</span> Administrátor (plný přístup)</button></div>
      <div class="hint">Administrátor má vždy přístup ke všem modulům. Pro jemné řízení práv ponechte roli Uživatel.</div>
      <div class="divider"></div><div class="section-label">Práva k modulům</div>
      <div id="perm-matrix"></div>
    </div>
    <div class="drawer-foot"><button class="btn btn-ghost" data-scrim-close>Zrušit</button><button class="btn btn-primary" id="us-save">${icon('check',16)}Uložit</button></div>`,{wide:true});
  renderPermMatrix();
  $('#us-save').onclick=()=>{ const un=val('us-un'); if(!un)return toast('Zadejte uživatelské jméno','warnTri');
    const data={ firstName:val('us-fn'), lastName:val('us-ln'), userName:un, roles:USER_DRAFT.roles, perms:USER_DRAFT.perms };
    if(id){ Object.assign(DB.users.find(x=>x.id===id),data); if(ME.id===id)ME=DB.users.find(x=>x.id===id); toast('Uživatel upraven'); }
    else { data.id='u-'+Math.random().toString(36).slice(2,7); DB.users.push(data); toast('Uživatel vytvořen'); }
    closeOverlay(); buildShell(); renderRoute(); };
  $$('[data-scrim-close]').forEach(x=>x.onclick=closeOverlay);
}
function userToggleAdmin(){ const isA=USER_DRAFT.roles.includes('Admin');
  USER_DRAFT.roles= isA? ['User'] : ['Admin'];
  $('#role-admin-ic').innerHTML=USER_DRAFT.roles.includes('Admin')?icon('check',14):'';
  $('#role-admin').style.background=USER_DRAFT.roles.includes('Admin')?'var(--amber-soft)':''; $('#role-admin').style.borderColor=USER_DRAFT.roles.includes('Admin')?'var(--amber)':'var(--border)';
  renderPermMatrix(); }
function renderPermMatrix(){
  const admin=USER_DRAFT.roles.includes('Admin');
  const levels=[['none','Bez přístupu','var(--text-3)'],['view','Jen čtení','var(--info)'],['edit','Úpravy','var(--ok)']];
  $('#perm-matrix').innerHTML=`<div class="tbl-wrap" style="${admin?'opacity:.5;pointer-events:none':''}"><table class="tbl" style="min-width:0"><thead><tr><th>Modul</th>
    ${levels.map(([,l])=>`<th style="text-align:center">${l}</th>`).join('')}</tr></thead><tbody>
    ${PERM_MODULES.map(([m,label,ic])=>{ const cur=admin?'edit':(USER_DRAFT.perms[m]||'none');
      return `<tr><td><div class="row gap8">${icon(ic,15)}<span class="t-strong">${label}</span></div></td>
      ${levels.map(([lv,,col])=>`<td style="text-align:center"><label style="cursor:pointer;display:inline-flex"><input type="radio" name="perm-${m}" ${cur===lv?'checked':''} onchange="USER_DRAFT.perms['${m}']='${lv}'" style="width:17px;height:17px;accent-color:${col}"></label></td>`).join('')}</tr>`; }).join('')}
  </tbody></table></div>${admin?'<div class="hint" style="margin-top:8px">Administrátor má automaticky úpravy ve všech modulech.</div>':''}`;
}

/* ============ GLOBAL SEARCH ============ */
/* ============ COMMAND PALETTE (⌘K) ============ */
const CMDK={ items:[], sel:0 };
function cmdkSearch(q){
  q=q.trim().toLowerCase(); const res=[];
  if(!q){ // quick nav to modules when empty
    NAV.forEach(sec=>sec.items.forEach(([m,ic,lbl])=>{ if(canSee(m)) res.push({ic,title:lbl,sub:'Přejít do modulu',path:m,kind:'Modul'}); }));
    return res;
  }
  if(canSee('orders')) DB.orders.forEach(o=>{ const c=clientById(o.clientId); if((o.number||'').toLowerCase().includes(q)||c.name.toLowerCase().includes(q))
    res.push({ic:'order',title:o.number,sub:c.name+' · '+(L.orderState[o.state]||''),path:'orders/'+o.id,kind:'Objednávka'}); });
  if(canSee('clients')) DB.clients.forEach(c=>{ if(c.name.toLowerCase().includes(q)||(c.businessName||'').toLowerCase().includes(q))
    res.push({ic:'client',title:c.name,sub:(c.businessName?c.businessName+' · ':'')+(L.region[c.region]||''),path:'clients/'+c.id,kind:'Klient'}); });
  if(canSee('breweries')) DB.breweries.forEach(b=>{ if(b.name.toLowerCase().includes(q)) res.push({ic:'brewery',title:b.name,sub:'Pivovar',path:'breweries/'+b.id,kind:'Pivovar'}); });
  if(canSee('breweries')) DB.products.forEach(p=>{ if(p.name.toLowerCase().includes(q)){ const b=breweryById(p.breweryId);
    res.push({ic:'box',title:p.name+(p.packageSize!=null?' ('+fmtLiters(p.packageSize)+')':''),sub:b.name+' · '+money(p.priceWithVat),path:'breweries/'+b.id+'?tab=cenik',kind:'Produkt'}); } });
  if(canSee('shipments')) DB.shipments.forEach(s=>{ if((s.number||'').toLowerCase().includes(q)||s.name.toLowerCase().includes(q))
    res.push({ic:'ship',title:s.name,sub:s.number+' · '+(L.shipState[s.state]||''),path:'shipments/'+s.id,kind:'Vývoz'}); });
  if(canSee('deliveries')) DB.deliveries.forEach(d=>{ if((d.number||'').toLowerCase().includes(q))
    res.push({ic:'import',title:d.number,sub:'Dovoz · '+(L.deliveryState[d.state]||''),path:'deliveries/'+d.id,kind:'Dovoz'}); });
  return res.slice(0,10);
}
function openCommandPalette(){
  $('#overlay').innerHTML=`<div class="scrim cmdk-scrim" data-scrim><div class="cmdk-panel" role="dialog" aria-label="Hledat">
    <div class="cmdk-input-wrap">${icon('search',18)}<input id="cmdk-input" autocomplete="off" placeholder="Hledat objednávky, klienty, produkty, pivovary…"><kbd class="cmdk-kbd">ESC</kbd></div>
    <div id="cmdk-results" class="cmdk-results"></div></div></div>`;
  $('.cmdk-scrim').addEventListener('mousedown',e=>{ if(e.target===e.currentTarget) closeOverlay(); });
  const inp=$('#cmdk-input');
  inp.oninput=()=>{ CMDK.sel=0; renderCmdk(inp.value); };
  inp.onkeydown=e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); CMDK.sel=Math.min(CMDK.sel+1,CMDK.items.length-1); paintCmdkSel(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); CMDK.sel=Math.max(CMDK.sel-1,0); paintCmdkSel(); }
    else if(e.key==='Enter'){ e.preventDefault(); const it=CMDK.items[CMDK.sel]; if(it) cmdkGo(it.path); }
    else if(e.key==='Escape'){ closeOverlay(); }
  };
  renderCmdk(''); inp.focus();
  document.addEventListener('keydown',escClose);
}
function renderCmdk(q){
  CMDK.items=cmdkSearch(q); const box=$('#cmdk-results'); if(!box) return;
  if(!CMDK.items.length){ box.innerHTML=`<div class="t-mut" style="padding:26px;text-align:center;font-size:13.5px">Nic nenalezeno pro „${esc(q)}"</div>`; return; }
  box.innerHTML=CMDK.items.map((it,i)=>`<button class="cmdk-item ${i===CMDK.sel?'on':''}" data-i="${i}" onmousedown="event.preventDefault();cmdkGo('${it.path}')" onmouseenter="CMDK.sel=${i};paintCmdkSel()">
    <span class="cmdk-ic">${icon(it.ic,17)}</span>
    <span style="flex:1;min-width:0"><span class="cmdk-t">${esc(it.title)}</span><span class="cmdk-s">${esc(it.sub)}</span></span>
    <span class="tag">${esc(it.kind)}</span></button>`).join('');
  paintCmdkSel();
}
function paintCmdkSel(){ $$('.cmdk-item').forEach((el,i)=>{ el.classList.toggle('on',i===CMDK.sel); if(i===CMDK.sel&&el.scrollIntoView) el.scrollIntoView({block:'nearest'}); }); }
function cmdkGo(path){ closeOverlay(); go(path); }

/* ============ BOOT ============ */
function boot(){
  document.documentElement.setAttribute('data-theme',UIS.theme);
  buildShell(); initCombos();
  window.addEventListener('hashchange',renderRoute);
  window.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){ e.preventDefault(); if($('#cmdk-input')) closeOverlay(); else openCommandPalette(); } });
  if(!location.hash) location.hash='#/dashboard';
  renderRoute();
}
boot();

</script>
