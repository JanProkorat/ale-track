/* ============ MODULE: DODAVATELÉ (SUPPLIERS) ============
   Companies we buy everything-but-beer from: CO₂ and Biogon bottles, kegs and
   crates, sanitation. Same address pair as a brewery or a client, plus the two
   things that make a supplier different — weekly opening hours (what a dispatcher
   checks before sending a van) and a price list where one physical good is priced
   once per charge kind. Nothing here reaches into orders, vývozy, sklad or dovozy:
   this is a registry, and buying against it is a separate feature. */

/* ---- opening hours ----------------------------------------------------------
   Stored as weekly-recurring intervals, several per day, none = closed. All the
   reasoning below is string comparison on 'HH:MM', which sorts correctly. */
/* Monday-first weekday of a Date — JS getDay() counts from Sunday. */
function weekdayIdx(d){ return (d.getDay()+6)%7; }
/* 'HH:MM' of a Date, comparable against stored interval bounds. */
function hhmm(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
/* Deliberately the real clock, not SEED_TODAY: the seeded "today" is a Sunday, and
   pinning open/closed to it would leave every supplier permanently shut. Every
   function below takes `at` explicitly so the logic stays testable. */
function supNow(){ return new Date(); }
/* Intervals of one weekday, earliest first. */
function hoursOfDay(s,day){ return (s.hours||[]).filter(h=>h.day===day).sort((a,b)=>a.from.localeCompare(b.from)); }
/* A whole day in one interval — how a nonstop self-service point is stored. */
function isNonstop(list){ return list.length===1&&list[0].from==='00:00'&&list[0].to==='24:00'; }
/* '07:00' -> '7:00'; leaves '24:00' and minutes alone. */
function hm(t){ return (t||'').replace(/^0(\d:)/,'$1'); }
function hoursText(list){ if(!list.length) return 'zavřeno'; if(isNonstop(list)) return 'nonstop';
  return list.map(h=>hm(h.from)+'–'+hm(h.to)).join(' · '); }
/* Open or closed at `at`, and what happens next: `nextDay` is null when the next
   opening is later the same day, and `next` is null when there are no hours at all. */
function openState(s,at){
  at=at||supNow();
  const day=weekdayIdx(at), t=hhmm(at), today=hoursOfDay(s,day);
  const cur=today.find(h=>h.from<=t&&t<h.to);
  if(cur) return { open:true, until:cur.to, nonstop:isNonstop(today), next:null, nextDay:null };
  const later=today.find(h=>h.from>t);
  if(later) return { open:false, next:later.from, nextDay:null };
  for(let i=1;i<=7;i++){ const d=(day+i)%7, hs=hoursOfDay(s,d);
    if(hs.length) return { open:false, next:hs[0].from, nextDay:d }; }
  return { open:false, next:null, nextDay:null };
}
/* The sentence a dispatcher reads: can I send a van there, and if not, when? */
function openStateText(st){
  if(st.open) return st.nonstop?'nonstop':'otevřeno do '+hm(st.until);
  if(!st.next) return 'bez otevírací doby';
  return st.nextDay==null?('otevře v '+hm(st.next)):('otevře '+WEEKDAYS[st.nextDay]+' '+hm(st.next));
}
function openBadge(st){ return `<span class="pill ${st.open?'s-ok':'s-grey'}"><span class="d"></span>${
  st.open?(st.nonstop?'nonstop':'otevřeno'):'zavřeno'}</span>`; }
/* The editor's <input type="time"> maxes out at 23:59, so a whole-day interval typed
   as 00:00–23:59 is stored as the canonical 00:00–24:00. */
function normalizeInterval(h){ return { day:h.day, from:h.from, to:(h.from==='00:00'&&h.to==='23:59')?'24:00':h.to }; }

/* ---- price list ---- */
const CHARGE_COLOR={ Fill:'var(--amber-700)', Purchase:'var(--ok)', Deposit:'var(--info)', Rent:'#7C3AED', Other:'var(--text-2)' };
function chargeChip(k){ return `<span class="tag" style="color:${CHARGE_COLOR[k]||'var(--text-2)'}">${esc(L.chargeKind[k]||k)}</span>`; }
function supGoods(s){ return (s.goods||[]).slice(); }
function goodById(s,gid){ return (s.goods||[]).find(g=>g.id===gid); }
function pricesOrdered(g){ return (g.prices||[]).slice().sort((a,b)=>CHARGE_ORDER.indexOf(a.kind)-CHARGE_ORDER.indexOf(b.kind)); }
function supPriceCount(s){ return supGoods(s).reduce((n,g)=>n+(g.prices||[]).length,0); }
/* Cheapest refill on the list — the number worth comparing between suppliers. */
function cheapestFill(s){ const f=supGoods(s).flatMap(g=>(g.prices||[]).filter(p=>p.kind==='Fill').map(p=>p.priceWithVat));
  return f.length?Math.min(...f):null; }
/* The one price an order picker shows for a good — its Fill charge, or the
   first price row when it has none (e.g. a pure Purchase/Deposit good). */
function goodPrimaryPrice(g){ const ps=g.prices||[]; return ps.find(p=>p.kind==='Fill')||ps[0]||null; }

/* ---- list ---- */
/* Search key: folds diacritics like saleNorm does, and additionally the subscript
   digits gas names are written with — nobody types 'CO₂' on a keyboard, so 'co2'
   has to match it, the same way 'frydlant' matches 'Frýdlant'. */
const SUBSCRIPTS='₀₁₂₃₄₅₆₇₈₉';
function supNorm(v){ return saleNorm(v).replace(/[₀-₉]/g,d=>String(SUBSCRIPTS.indexOf(d))); }
let SUP_SEARCH='';
function supFiltered(){ const q=supNorm(SUP_SEARCH);
  return DB.suppliers.filter(s=>!q||supNorm(s.name).includes(q)||supNorm(s.businessName).includes(q)
    ||supNorm(s.officialAddress.city).includes(q)||supGoods(s).some(g=>supNorm(g.name).includes(q)))
    .sort((a,b)=>a.name.localeCompare(b.name,'cs')); }
function viewSuppliers(){
  AFTER=supWire;
  return `<div class="page">
    ${pageHead('Evidence','Dodavatelé','Firmy, kde kupujeme nebo plníme všechno kromě piva — CO₂ a Biogon, obaly, sanitaci.',
      canEdit('suppliers')?`<button class="btn btn-primary" onclick="supplierForm(null)">${icon('plus',17)}Nový dodavatel</button>`:'')}
    <div class="toolbar">
      <div class="fld" style="min-width:330px">${icon('search',16)}<input id="sup-search" style="flex:1" placeholder="Hledat dodavatele nebo zboží…" value="${esc(SUP_SEARCH)}"></div>
      <span class="count-note" id="sup-count">${supCountText()}</span></div>
    <div id="sup-results">${supResults()}</div></div>`;
}
function supCountText(){ const n=supFiltered().length; return n+' '+plural(n,'dodavatel','dodavatelé','dodavatelů'); }
function supWire(){ const el=$('#sup-search'); if(el) el.oninput=()=>{ SUP_SEARCH=el.value; supRerender(); }; }
function supRerender(){ const r=$('#sup-results'); if(r) r.innerHTML=supResults();
  const c=$('#sup-count'); if(c) c.textContent=supCountText(); }
function supResults(){
  const list=supFiltered();
  if(!list.length) return `<div class="empty"><div>${icon('supplier',34)}</div><div class="t">Žádní dodavatelé</div>
    ${SUP_SEARCH?`<button class="btn btn-sm btn-ghost" style="margin-top:12px" onclick="SUP_SEARCH='';renderRoute()">Zrušit hledání</button>`
      :`<div>Přidejte firmu, kde kupujete CO₂, obaly nebo sanitaci.</div>`}</div>`;
  const today=weekdayIdx(supNow());
  const rows=list.map(s=>{ const st=openState(s), goods=supGoods(s);
    return `<tr class="clickable" onclick="go('suppliers/${s.id}')">
      <td><div class="row-lead">${avatar(s.id,initials(s.name))}
        <div><div class="t-strong">${esc(s.name)}</div><div class="t-mut" style="font-size:12px">${esc(s.businessName||'')}</div></div></div></td>
      <td>${fmtAddr(s.officialAddress)}</td>
      <td class="num tnum">${goods.length}</td>
      <td><div class="row gap8">${openBadge(st)}${st.nonstop?''/* the badge already says nonstop */
        :`<span class="t-mut" style="font-size:12px">${esc(hoursText(hoursOfDay(s,today)))}</span>`}</div></td>
      <td>${(s.contacts||[]).length?s.contacts.map(c=>`<span class="tag" title="${esc(c.value)}">${icon(c.type==='Email'?'mail':'phone',11)}${esc(c.value)}</span>`).join(' '):'<span class="t-mut">—</span>'}</td>
      <td style="text-align:right">${icon('chevR',16)}</td></tr>`; }).join('');
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Dodavatel</th><th>Sídlo</th>
    <th style="text-align:right">Zboží</th><th>Dnes</th><th>Kontakty</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---- detail ---- */
function viewSupplierDetail(id){
  id=id.split('?')[0]; const s=supplierById(id); if(!s) return notFound('Dodavatel');
  const tab=(location.hash.split('?tab=')[1])||'info';
  const ed=canEdit('suppliers');
  const goods=supGoods(s), st=openState(s);
  const rems=DB.reminders.filter(r=>r.kind==='Supplier'&&r.sectionId===id);
  const tabs=`<div class="tabs">
    ${supTab('info','Info a kontakty','info',tab)}
    ${supTab('hours','Otevírací doba','clock',tab)}
    ${supTab('cenik','Ceník','wallet',tab,goods.length)}
    ${supTab('reminders','Připomínky','bell',tab,rems.length)}
    ${supTab('notes','Poznámky','note',tab)}</div>`;
  let body='';
  if(tab==='info') body=supInfoView(s,goods,st,ed);
  else if(tab==='hours') body=supHoursView(s,st,ed);
  else if(tab==='cenik') body=supCenikView(s,goods,ed);
  else if(tab==='reminders') body=remindersView(rems,ed,'Supplier',id);
  else body=notesView(s,'supplier');
  return `<div class="page">
    ${detailHead('suppliers','Zpět na dodavatele',s.name,{
      lead:openStateText(st), status:openBadge(st),
      meta:[esc(s.businessName||''),esc(s.officialAddress.city),guidNote(s.id)],
      actions:ed?`<button class="btn btn-ghost" onclick="supplierForm('${id}')">${icon('edit',16)}Upravit</button>
        <button class="btn btn-danger btn-icon" onclick="delSupplier('${id}')">${icon('trash',16)}</button>`:''})}
    ${tabs}${body}</div>`;
}
function supTab(key,label,ic,cur,cnt){ return `<button class="${cur===key?'on':''}" onclick="location.hash='#/suppliers/'+curId()+'?tab=${key}';renderRoute()">${icon(ic,15)}${label}${cnt!=null?`<span class="cnt">${cnt}</span>`:''}</button>`; }

    <div class="card"><div class="card-head"><h3>Údaje</h3></div><div class="card-pad stack" style="gap:12px">
      <div class="kv"><span class="k">Obchodní název</span><span class="v">${esc(s.businessName||'—')}</span></div>
      <div class="kv"><span class="k">Dnes</span><span class="v">${openBadge(st)} <span class="t-mut" style="font-size:12.5px">${esc(hoursText(hoursOfDay(s,weekdayIdx(supNow()))))}</span></span></div>
      <div class="kv"><span class="k">Identifikátor</span><span class="v">${guidNote(s.id)}</span></div></div></div>
    <div class="card"><div class="card-head"><h3>Ceník</h3></div><div class="card-pad">

        <div class="ti-ico" style="width:46px;height:46px;flex:0 0 auto;background:${st.open?'var(--ok-tint)':'var(--surface-3)'};color:${st.open?'var(--ok)':'var(--text-2)'}">${icon('clock',22)}</div>

          <div class="row gap8">${openBadge(st)}<span class="t-strong">${esc(openStateText(st))}</span></div>

function supCenikView(s,goods,ed){
  const rows=goods.map(g=>{
    const ps=pricesOrdered(g), span=Math.max(1,ps.length);
    const goodCell=`<td rowspan="${span}" style="vertical-align:top">
      <div class="row gap8" style="align-items:flex-start">
        <span style="color:var(--text-3);margin-top:1px;flex:0 0 auto">${icon('cylinder',16)}</span>
        <div style="min-width:0"><div class="t-strong">${esc(g.name)}${g.size?` <span class="tag">${esc(g.size)}</span>`:''}</div>
          ${g.description?`<div class="t-mut" style="font-size:12px;margin-top:2px">${esc(g.description)}</div>`:''}</div></div></td>`;
    const actCell=ed?`<td rowspan="${span}" style="vertical-align:top">
      <div class="row gap8" style="justify-content:flex-end">
        <button class="icon-btn" style="width:30px;height:30px" title="Upravit zboží" onclick="supGoodForm('${s.id}','${g.id}')">${icon('edit',13)}</button>
        <button class="icon-btn" style="width:30px;height:30px;color:var(--crit)" title="Smazat zboží" onclick="delSupGood('${s.id}','${g.id}')">${icon('trash',13)}</button></div></td>`:'';
    if(!ps.length) return `<tr>${goodCell}<td colspan="4" class="t-mut" style="font-size:13px">Bez ceny — doplňte ji tlačítkem úpravy.</td>${actCell}</tr>`;
    return ps.map((p,i)=>`<tr>${i===0?goodCell:''}
      <td>${chargeChip(p.kind)}</td>
      <td class="num tnum t-strong" style="text-align:right">${money(p.priceWithVat)}</td>
      <td class="num tnum t-mut" style="text-align:right">${p.priceWithoutVat!=null?money(p.priceWithoutVat):'—'}</td>
      <td class="t-mut" style="font-size:12px">${esc(p.note||'')}</td>
      ${i===0?actCell:''}</tr>`).join('');
  }).join('');
  return `<div class="card-pad" style="padding:0">
    ${ed?`<div class="toolbar"><button class="btn btn-ghost btn-sm" onclick="supGoodForm('${s.id}',null)">${icon('plus',15)}Přidat zboží</button>
      <span class="count-note">${goods.length} ${plural(goods.length,'druh','druhy','druhů')} zboží · ${supPriceCount(s)} ${plural(supPriceCount(s),'cena','ceny','cen')}</span></div>`:''}
    ${goods.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Zboží</th><th>Účel</th>
      <th style="text-align:right">s DPH</th><th style="text-align:right">bez DPH</th><th>Poznámka</th>${ed?'<th></th>':''}</tr></thead>
      <tbody>${rows}</tbody></table></div>`
      :`<div class="empty"><div>${icon('cylinder',36)}</div><div class="t">Prázdný ceník</div>
        <div>Přidejte zboží a k němu cenu za plnění, nákup, zálohu nebo nájem.</div></div>`}</div>`;
}

function supplierForm(id){
  const s=id?supplierById(id):{ name:'',businessName:'',note:'',officialAddress:{country:'Czechia'},contactAddress:null,contacts:[] };
  CONTACT_DRAFT=(s.contacts||[]).map(x=>({...x}));
  const hasContact=!!s.contactAddress;
  openOverlay(`<div class="drawer-head">${icon('supplier',20)}<h2>${id?'Upravit dodavatele':'Nový dodavatel'}</h2><button class="icon-btn" data-scrim-close>${icon('close',16)}</button></div>
    <div class="drawer-body">
      <div class="form-grid">
        ${field('Název',inp('sp-name',s.name,'Linde Gas — plnírna Liberec'),{req:true})}
        ${field('Obchodní název',inp('sp-biz',s.businessName||'','Linde Gas a.s.'))}
        ${field('Provozní poznámka',txta('sp-note',s.note||'','Kam se hlásit, jak se platí…'),{col2:true,hint:'Co má řidič vědět, než tam vyrazí.'})}
      </div>
      <div class="divider"></div><div class="section-label">Fakturační adresa</div>${addressFields('spof',s.officialAddress)}
      <div class="divider"></div><label class="row gap8" style="font-weight:700;font-size:13px;cursor:pointer"><input type="checkbox" id="sp-hascontact" ${hasContact?'checked':''} onchange="$('#spc-wrap').style.display=this.checked?'block':'none'"> Provozovna je na jiné adrese</label>
      <div id="spc-wrap" style="display:${hasContact?'block':'none'};margin-top:12px">${addressFields('spcon',s.contactAddress)}</div>
      <div class="divider"></div><div class="section-label">Kontakty</div><div id="contacts-list"></div>
      <button class="btn btn-ghost btn-sm" onclick="addContactRow()" style="margin-top:10px">${icon('plus',15)}Přidat kontakt</button>
    </div>
    <div class="drawer-foot"><button class="btn btn-ghost" data-scrim-close>Zrušit</button><button class="btn btn-primary" id="sp-save">${icon('check',16)}Uložit</button></div>`);
  renderContacts();
  $('#sp-save').onclick=()=>{
    const name=val('sp-name'); if(!name) return toast('Vyplňte název','warnTri');
    syncContactDraft();
    const data={ name, businessName:val('sp-biz'), note:val('sp-note'), officialAddress:readAddress('spof'),
      contactAddress:$('#sp-hascontact').checked?readAddress('spcon'):null, contacts:CONTACT_DRAFT.filter(x=>x.value) };
    if(id){ Object.assign(supplierById(id),data); toast('Dodavatel upraven'); }
    else { data.id='sp-'+Math.random().toString(36).slice(2,7); data.hours=[]; data.goods=[]; data.notes=[]; data.reminders=[];
      DB.suppliers.push(data); toast('Dodavatel vytvořen'); }
    closeOverlay(); renderRoute();
  };
  $$('[data-scrim-close]').forEach(x=>x.onclick=closeOverlay);
}
function delSupplier(id){ confirmDialog('Smazat dodavatele?','Smaže se i jeho ceník, otevírací doba a připomínky. Tuto akci nelze vrátit.',()=>{
  DB.suppliers=DB.suppliers.filter(s=>s.id!==id);
  DB.reminders=DB.reminders.filter(r=>!(r.kind==='Supplier'&&r.sectionId===id));
  toast('Dodavatel smazán','trash'); go('suppliers'); }); }

let HRS_DRAFT=[];
function supHoursForm(sid){
  const s=supplierById(sid); HRS_DRAFT=(s.hours||[]).map(h=>({...h}));
  openOverlay(`<div class="drawer-head">${icon('clock',20)}<h2>Otevírací doba</h2><button class="icon-btn" data-scrim-close>${icon('close',16)}</button></div>
    <div class="drawer-body">
      <div class="card" style="background:var(--amber-soft);border-color:var(--amber-tint);margin-bottom:16px"><div class="card-pad" style="display:flex;gap:12px">
        <span style="color:var(--amber-700);flex:0 0 auto">${icon('info',18)}</span><div style="font-size:13px;color:var(--text-2)">
          Jeden řádek = jeden interval. Obědová pauza se zadává jako <b>dva intervaly ve stejný den</b>.
          Den bez intervalu je zavřeno; <b>0:00–23:59</b> znamená nonstop.</div></div></div>
      <div id="hrs-list"></div>
      <button class="btn btn-ghost btn-sm" onclick="addHrsRow()" style="margin-top:10px">${icon('plus',15)}Přidat interval</button>
    </div>
    <div class="drawer-foot"><button class="btn btn-ghost" data-scrim-close>Zrušit</button><button class="btn btn-primary" id="hrs-save">${icon('check',16)}Uložit</button></div>`);
  renderHrs();
  $('#hrs-save').onclick=()=>{
    syncHrs();
    const bad=HRS_DRAFT.find(h=>!(h.from<h.to));
    if(bad) return toast('Interval musí končit později, než začíná','warnTri');
    s.hours=HRS_DRAFT.map(normalizeInterval).sort((a,b)=>(a.day-b.day)||a.from.localeCompare(b.from));
    toast('Otevírací doba uložena'); closeOverlay(); renderRoute();
  };
  $$('[data-scrim-close]').forEach(x=>x.onclick=closeOverlay);
}
function renderHrs(){ $('#hrs-list').innerHTML=HRS_DRAFT.map((h,i)=>`<div class="row gap8" style="margin-bottom:8px">
  <select class="select" style="width:130px;flex:0 0 auto" data-hi="${i}" data-f="day">${WEEKDAYS_LONG.map((lbl,d)=>`<option value="${d}" ${h.day===d?'selected':''}>${lbl}</option>`).join('')}</select>
  <input class="input" type="time" value="${esc(h.from||'07:00')}" data-hi="${i}" data-f="from" style="width:120px;flex:0 0 auto">
  <span class="t-mut">–</span>
  <input class="input" type="time" value="${esc(h.to==='24:00'?'23:59':(h.to||'15:00'))}" data-hi="${i}" data-f="to" style="width:120px;flex:0 0 auto">
  <button class="icon-btn" style="width:38px;flex:0 0 auto" onclick="rmHrsRow(${i})">${icon('trash',14)}</button></div>`).join('')
  ||`<div class="t-mut" style="font-size:13px">Zatím nezadaná — dodavatel se zobrazuje jako zavřený.</div>`; }
function syncHrs(){ $$('#hrs-list [data-hi]').forEach(el=>{ const h=HRS_DRAFT[+el.dataset.hi];
  h[el.dataset.f]=el.dataset.f==='day'?+el.value:el.value; }); }
function addHrsRow(){ syncHrs(); HRS_DRAFT.push({day:0,from:'07:00',to:'15:00'}); renderHrs(); }
function rmHrsRow(i){ syncHrs(); HRS_DRAFT.splice(i,1); renderHrs(); }

function renderPrices(){ $('#prc-list').innerHTML=PRC_DRAFT.map((p,i)=>`<div class="row gap8" style="margin-bottom:8px">

function delSupGood(sid,gid){ const s=supplierById(sid), g=goodById(s,gid); if(!g) return;
  confirmDialog('Smazat zboží?',`„${g.name}“ zmizí z ceníku i se všemi cenami.`,()=>{

/* ============ ZMĚNY OBJEDNÁVEK (client ledger) ============
   A deviation lives BESIDE the order, never in it: the order stays the plan, so the
   papers printed before departure stay true. What was actually delivered is plan +
   deltas, computed on the fly and never stored as a third number.

   Owned by the client rather than the order, which is what lets a plain debt exist
   with no delivery behind it — today that gets typed into an order note nobody can
   filter or close. */
function ledState(e){ return e.resolvedAt?'resolved':(e.resolvedByOrderId?'assigned':'open'); }
function ledgerOf(clientId){ return DB.ledger.filter(e=>e.clientId===clientId)
  .sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')); }
/* "Open" means somebody still has to settle it. Informational rows (an address that
   moved) are deliberately excluded — they belong in the history, not in a to-do. */
function ledgerOpen(clientId){ return ledgerOf(clientId).filter(e=>e.requiresFollowUp&&!e.resolvedAt); }
function ledgerForOrder(orderId){ return DB.ledger.filter(e=>e.orderId===orderId); }
/* Two different questions about the same line, and conflating them double-bills.
   - What was delivered: a permanent fact about that handover, so resolution is
     irrelevant. Used by the diffs and by the invoice.
   - What is still open on that line: used by the upsert, which may only rewrite a row
     nobody has settled yet. A settled row is history and gets a new row beside it. */
/* The four quantity targets share one code path — that is the whole reason the enum is
   typed by target rather than by event. They differ only in what identifies the line:
   a product for beer, the row's own id for a return or an extra. */
const QTY_TARGETS=['ProductQuantity','SupplierGoodQuantity','ReturnQuantity','CustomExtraQuantity'];
function isQtyTarget(t){ return QTY_TARGETS.includes(t); }
function ledgerLines(orderId,target,key){ return DB.ledger.filter(e=>e.orderId===orderId
  && e.target===target && e.lineKey===key); }
function ledgerLineFor(orderId,target,key){ const all=ledgerLines(orderId,target,key);
  return all.find(e=>!e.resolvedAt)||all[all.length-1]; }
function ledgerOpenLineFor(orderId,target,key){ return ledgerLines(orderId,target,key).find(e=>!e.resolvedAt); }
function ledgerQtyFor(orderId,productId){ return ledgerLineFor(orderId,'ProductQuantity',productId); }
function ledgerOpenQtyFor(orderId,productId){ return ledgerOpenLineFor(orderId,'ProductQuantity',productId); }
function ledDelta(e){ return (e.actualQuantity||0)-(e.plannedQuantity||0); }
/* added -> nothing was planned; removed -> nothing arrived; otherwise a plain change. */
function ledRowStatus(e){ if(!e.plannedQuantity) return 'added'; if(!e.actualQuantity) return 'removed'; return 'chg'; }
function ledgerMoney(clientId){ let owesUs=0,weOwe=0;
  ledgerOpen(clientId).filter(e=>e.target==='Money').forEach(e=>{ if(e.amount>=0) owesUs+=e.amount; else weOwe+=-e.amount; });
  return {owesUs,weOwe}; }

/* The tag that carries the meaning when colour cannot — a colour-blind reader and a
   black-and-white printout both get the words. */
function ledTag(e){
  if(isQtyTarget(e.target)){
    const st=ledRowStatus(e), d=ledDelta(e);
    // A return moves the other way: pieces come back to us, so "more than planned" is the
    // client handing over extra, not us delivering extra. Same arithmetic, opposite words.
    const ret=e.target==='ReturnQuantity';
    if(st==='added') return `<span class="chg-tag t-new">${icon('plus',10)}${ret?'vráceno navíc':'přidáno na místě'}</span>`;
    if(st==='removed') return `<span class="chg-tag t-less">${ret?'nevráceno':'nevyloženo'}</span>`;
    // A return has no good direction — too few and the client still owes empties, too many
    // and we are holding deposits that are not ours. So it never gets the green treatment
    // that "delivered extra" earns, where the pieces are simply billed.
    const tone=d<0?'t-less':ret?'t-new':'t-more';
    return `<span class="chg-tag ${tone}">${d<0?(ret?'nevráceno':'nevyloženo'):(ret?'vráceno navíc':'navíc')} ${Math.abs(d)} ks</span>`;
  }
  if(e.target==='Money') return `<span class="chg-tag t-info">${e.amount>=0?'klient dluží':'dlužíme klientovi'}</span>`;
  return `<span class="chg-tag t-info">změna</span>`;
}
/* One-line human wording, derived from the sign — which is why the enum is typed by
   target and not by event: there is no NotUnloaded/DeliveredExtra pair to keep in sync. */
function ledgerHeadline(e){
  if(isQtyTarget(e.target)){
    const p=e.productId?prodById(e.productId):null;
    const n=p?p.name:(e.lineName||'Položka'); const d=ledDelta(e); const st=ledRowStatus(e);
    const ret=e.target==='ReturnQuantity';
    const verb=ret?'vráceno':'dodáno';
    if(st==='added') return `${esc(n)} — ${ret?`vráceno ${e.actualQuantity} ks navíc`:`přidáno ${e.actualQuantity} ks na místě`}`;
    if(st==='removed') return `${esc(n)} — ${ret?'nevráceno':'nevyloženo'} ${e.plannedQuantity} ks`;
    return `${esc(n)} — ${d<0?(ret?'nevráceno':'nevyloženo'):(ret?'navíc vráceno':'navíc')} ${Math.abs(d)} ks (plán ${e.plannedQuantity}, ${verb} ${e.actualQuantity})`;
  }
  if(e.target==='Money') return e.amount>=0?`Klient dluží ${money(e.amount)}`:`Dlužíme klientovi ${money(-e.amount)}`;
  if(e.target==='DeliveryAddress') return `Vyloženo jinde než v objednávce`;
  if(e.target==='DeliveryDate') return `Dovezeno jiný den, než bylo v objednávce`;
  return esc(e.note||'Změna');
}
function ledIcon(t){ return t==='Money'?'wallet':t==='DeliveryAddress'?'pin':t==='DeliveryDate'?'cal'
  :t==='ReturnQuantity'?'arrowU':t==='CustomExtraQuantity'?'tag':'box'; }
/* The inline diff: the old value struck through, the new one highlighted. */
function qtyDiff(planned,actual){
  return `<span class="diff-old">${planned} ks</span> <span class="diff-new">${actual} ks</span>`;
}
function textDiff(oldV,newV){
  return `<div><span class="diff-old">${esc(oldV||'—')}</span></div><div class="diff-new">${esc(newV||'—')}</div>`;
}

/* Merges an order's planned lines with its deltas. Does not only decorate: rows that
   exist as a delta but not in the plan are APPENDED, which is why a new array comes
   back rather than a map over the old one. Both the order detail and the shipment's
   nakládka call this, so the two screens cannot drift. */
function applyLedger(items,orderId){
  // Resolved entries stay in the diff: settling the consequence with the client does not
  // change the fact that seven of ten arrived.
  const entries=ledgerForOrder(orderId).filter(e=>e.target==='ProductQuantity');
  const rows=items.map(it=>({ it, entry: it.productId?entries.find(e=>e.productId===it.productId):null }));
  entries.filter(e=>ledRowStatus(e)==='added'&&!items.some(it=>it.productId===e.productId))
    .forEach(e=>rows.push({ it:{ id:'led-'+e.id, productId:e.productId, quantity:0, reminderState:null }, entry:e, appended:true }));
  return rows;
}
function ledgerRowClass(entry){ if(!entry) return ''; const st=ledRowStatus(entry);
  return st==='added'?'row-added':st==='removed'?'row-removed':'row-chg'; }
/* What the order is actually worth once the deviations are applied. Kept beside the
   plan rather than replacing it: the footer has to agree with the rows above it, and
   the rows above it show what was delivered. */
function ledgerTotals(o,rows){ let items=0,price=0;
  rows.forEach(r=>{ const it=r.it; const qty=r.entry?r.entry.actualQuantity:it.quantity; items+=qty;
    if(it.supplierGoodId){ const s=supplierById(it.supplierId); const g=s?goodById(s,it.supplierGoodId):null;
      const pr=g?goodPrimaryPrice(g):null; price+=(pr?pr.priceWithVat:0)*qty; }
    else price+=priceFor(prodById(it.productId),o.clientId).price*qty; });
  return {items,price}; }

/* A free-form quantity list — returns, extras — merged with its deviations. Same shape
   as applyLedger for products: decorate what is planned, append what only exists as a
   delta, so a return the client invented at the door still shows up. */
function ledgerSimpleRows(rows,orderId,target){
  const entries=ledgerForOrder(orderId).filter(e=>e.target===target);
  const out=rows.map(r=>({ r, entry: entries.find(e=>e.lineKey===r.id) }));
  entries.filter(e=>ledRowStatus(e)==='added'&&!rows.some(r=>r.id===e.lineKey))
    .forEach(e=>out.push({ r:{ id:e.lineKey, name:e.lineName, description:e.lineName, quantity:0, note:'' }, entry:e, appended:true }));
  return out;
}
/* One card for a free-form list. Returns and extras render identically — they differ only
   in the field the label lives in and in the words the tag uses. */
function ledgerSimpleCard(title,ic,rows,orderId,target,editable){
  const merged=ledgerSimpleRows(rows,orderId,target);
  if(!merged.length) return '';
  return `<div class="card"><div class="card-head">${icon(ic,16)}<h3>${title}</h3>
      <span class="tag">${merged.length}</span>
      ${editable?`<button class="btn btn-sm btn-ghost" style="margin-left:auto" onclick="ledgerDrawer('${orderId}')">${icon('edit',13)}Zaznamenat změnu</button>`:''}</div>
    <div class="card-pad stack" style="gap:0">
      ${merged.map(({r,entry})=>{ const qty=entry?entry.actualQuantity:r.quantity;
        const cls=ledgerRowClass(entry);
        return `<div class="row" style="justify-content:space-between;gap:10px;padding:9px 10px;border-radius:var(--r-sm);
            ${cls==='row-added'?'background:var(--info-tint)':cls==='row-removed'?'background:var(--crit-tint)':cls==='row-chg'?'background:var(--warn-tint)':''}">
          <div style="min-width:0">
            <div class="t-strong" style="font-size:13px;${cls==='row-removed'?'text-decoration:line-through':''}">${esc(r.name||r.description)}</div>
            ${r.note?`<div class="t-mut" style="font-size:11.5px">${esc(r.note)}</div>`:''}
            ${entry?`<div style="margin-top:3px">${ledTag(entry)}</div>`:''}</div>
          <div class="tnum" style="flex:0 0 auto;text-align:right">
            ${entry?(ledRowStatus(entry)==='added'?`<span class="diff-new">${qty} ks</span>`:qtyDiff(r.quantity,qty))
              :`<span class="t-strong">${r.quantity} ks</span>`}</div></div>`; }).join('')}
    </div></div>`;
}

/* ---- the shared drawer: record what actually happened --------------------------
   Opened from the order detail and from a stop in the shipment's nakládka. The
   "actual" column is prefilled from the STORED deviation, not from the plan —
   otherwise reopening it after a save would record the delta a second time and
   double the debt. Saving is an upsert, never an append. */
function ledgerDrawer(orderId){
  const o=DB.orders.find(x=>x.id===orderId); if(!o) return;
  const cl=clientById(o.clientId);
  const prodItems=o.items.filter(it=>it.productId);
  const addable=DB.products.filter(p=>!prodItems.some(it=>it.productId===p.id));
  // The plan to diff against is what was LOADED once the run has left — a dokládka added
  // at the ramp is on the van, so measuring the handover against the order's original
  // number would report pieces as missing that were never supposed to be there.
  const ship=DB.shipments.find(x=>x.stops.some(st=>st.orderId===orderId));
  const stop=ship?ship.stops.find(st=>st.orderId===orderId):null;
  const loaded=ship&&ship.state!=='Created'&&stop
    ? Object.fromEntries(stop.items.map(i=>[i.productId,slQty(i)])) : {};
  const plannedOf=it=>loaded[it.productId]!=null?loaded[it.productId]:it.quantity;
  const rows=prodItems.map(it=>{ const p=prodById(it.productId); const e=ledgerQtyFor(orderId,it.productId);
    const planned=plannedOf(it); const actual=e?e.actualQuantity:planned;
    return `<tr><td><div class="t-strong" style="font-size:13px">${esc(p.name)}</div>
      <div class="t-mut" style="font-size:11.5px">${kindChipText(p.kind)}${p.packageSize!=null?' · '+fmtLiters(p.packageSize):''}
      ${planned!==it.quantity?` · objednáno ${it.quantity}, naloženo ${planned}`:''}</div></td>
      <td class="num tnum t-mut">${planned} ks</td>
      <td style="width:104px"><input class="input" id="ld-q-${it.productId}" type="number" min="0" value="${actual}" style="text-align:right"></td></tr>`; }).join('');
  const added=ledgerForOrder(orderId).filter(e=>e.target==='ProductQuantity'&&!e.resolvedAt&&ledRowStatus(e)==='added');
  const addedRows=added.map(e=>{ const p=prodById(e.productId);
    return `<tr><td><div class="t-strong" style="font-size:13px">${esc(p.name)}</div>
      <div class="row gap8" style="margin-top:2px">${ledTag(e)}</div></td>
      <td class="num tnum t-mut">—</td>
      <td style="width:104px"><input class="input" id="ld-q-${e.productId}" type="number" min="0" value="${e.actualQuantity}" style="text-align:right"></td></tr>`; }).join('');
  const moneyE=ledgerForOrder(orderId).find(e=>e.target==='Money'&&!e.resolvedAt);
  const addrE=ledgerForOrder(orderId).find(e=>e.target==='DeliveryAddress');
  openOverlay(`<div class="drawer-head">${icon('edit',20)}<h2>Zaznamenat změnu</h2><button class="icon-btn" data-scrim-close>${icon('close',16)}</button></div>
    <div class="drawer-body">
      <div class="row gap8" style="margin-bottom:4px">${avatar(cl.id,initials(cl.name))}
        <div><div class="t-strong">${esc(cl.name)}</div><div class="t-mut" style="font-size:12px">${o.number} · ${L.orderState[o.state]}</div></div></div>
      <p style="margin:12px 0 0;color:var(--text-2);font-size:12.5px">Objednávka zůstane plánem — přepisujete jen sloupec
        <span class="t-strong">Skutečně</span>. Rozdíl se uloží jako změna vedle objednávky.</p>
      <div class="divider"></div><div class="section-label">Položky</div>
      <div class="tbl-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>Produkt</th>
        <th style="text-align:right">Plán</th><th style="text-align:right">Skutečně</th></tr></thead>
        <tbody>${rows}${addedRows}</tbody></table></div>
      ${ledgerDrawerSimple('Vratky','ret',o.returns||[],orderId,'ReturnQuantity','Vráceno')}
      ${ledgerDrawerSimple('Položky navíc','ext',o.extras||[],orderId,'CustomExtraQuantity','Předáno')}
      <div class="divider"></div><div class="section-label">Přidat produkt vzatý na místě</div>
      <div class="row gap8">
        <div style="flex:1">${sel('ld-newprod',[['','— vyberte —'],...addable.slice(0,60).map(p=>[p.id,p.name])])}</div>
        <div style="width:96px">${inp('ld-newqty','','ks','number')}</div>
      </div>
      <div class="divider"></div><div class="section-label">Peníze</div>
      ${field('Rozdíl v Kč — plus když klient dluží nám, minus když my jemu',
        inp('ld-money',moneyE?String(moneyE.amount):'','např. 2610','number'))}
      ${field('Poznámka ke změně',txta('ld-note',moneyE?(moneyE.note||''):'','Co se stalo a co se musí dořešit…'))}
      ${addrE?`<div class="divider"></div><div class="section-label">Adresa</div>
        <div class="led-item is-resolved"><div class="led-ico">${icon('pin',15)}</div><div style="flex:1">
        ${textDiff(addrE.plannedText,addrE.actualText)}
        <div class="t-mut" style="font-size:11.5px;margin-top:4px">Zapsáno automaticky při změně adresy pod jedoucím vývozem.</div></div></div>`:''}
    </div>
    <div class="drawer-foot"><button class="btn btn-ghost" data-scrim-close>Zrušit</button>
      <button class="btn btn-primary" id="ld-save">${icon('check',16)}Uložit změny</button></div>`);
  $('#ld-save').onclick=()=>ledgerSave(orderId);
  $$('[data-scrim-close]').forEach(b=>b.onclick=closeOverlay);
}
/* Returns and extras get the same plan-vs-actual table as the products. Prefilled from
   the stored deviation for the same reason: a second save must not record the delta twice. */
function ledgerDrawerSimple(title,prefix,rows,orderId,target,actualLabel){
  const merged=ledgerSimpleRows(rows,orderId,target);
  if(!merged.length) return '';
  return `<div class="divider"></div><div class="section-label">${title}</div>
    <div class="tbl-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>Položka</th>
      <th style="text-align:right">Plán</th><th style="text-align:right">${actualLabel}</th></tr></thead>
      <tbody>${merged.map(({r,entry})=>`<tr>
        <td><div class="t-strong" style="font-size:13px">${esc(r.name||r.description)}</div>
          ${entry?`<div style="margin-top:2px">${ledTag(entry)}</div>`:''}</td>
        <td class="num tnum t-mut">${r.quantity} ks</td>
        <td style="width:104px"><input class="input" id="ld-${prefix}-${r.id}" type="number" min="0"
          value="${entry?entry.actualQuantity:r.quantity}" style="text-align:right"></td></tr>`).join('')}</tbody></table></div>`;
}
function ledgerSave(orderId){
  const o=DB.orders.find(x=>x.id===orderId); if(!o) return;
  let touched=0;
  /* Upsert, not insert: an existing unresolved row for the line is rewritten, and it is
     DELETED when the actual returns to the plan — the ledger holds no no-op rows. */
  function upsertLine(target,key,planned,actual,extra){
    // Only an unresolved row may be rewritten. A settled one is history and gets a new
    // row beside it — which is also what the real partial unique index permits.
    const cur=ledgerOpenLineFor(orderId,target,key);
    if(actual===planned){ if(cur){ DB.ledger=DB.ledger.filter(e=>e!==cur); touched++; } return; }
    if(cur){ cur.actualQuantity=actual; cur.plannedQuantity=planned; touched++; return; }
    DB.ledger.push({ id:'led-'+Math.random().toString(36).slice(2,7), clientId:o.clientId, orderId, stopId:orderId,
      target, lineKey:key, productId:null, orderItemId:null, lineName:null,
      plannedQuantity:planned, actualQuantity:actual, plannedText:null, actualText:null, amount:null,
      note:'', requiresFollowUp:true, resolvedAt:null, resolvedBy:null, resolutionNote:null,
      resolvedByOrderId:null, createdAt:daysFromNow(0), createdBy:ME.id, ...extra });
    touched++;
  }
  function upsertQty(productId,planned,actual){
    const oi=o.items.find(i=>i.productId===productId);
    // Pieces taken at the door are not a debt of goods — they are already with the client
    // and get billed. Only a short delivery leaves something to settle.
    upsertLine('ProductQuantity',productId,planned,actual,
      { productId, orderItemId:oi?oi.id:null, requiresFollowUp: actual<planned });
  }
  /* Returns and extras need following up in BOTH directions: too few empties back and the
     client still owes them, too many and we are holding deposits that are not ours. */
  function upsertSimple(target,row,planned,actual){
    upsertLine(target,row.id,planned,actual,{ lineName:row.name||row.description });
  }
  const ship=DB.shipments.find(x=>x.stops.some(st=>st.orderId===orderId));
  const stop=ship?ship.stops.find(st=>st.orderId===orderId):null;
  const loaded=ship&&ship.state!=='Created'&&stop
    ? Object.fromEntries(stop.items.map(i=>[i.productId,slQty(i)])) : {};
  o.items.filter(it=>it.productId).forEach(it=>{
    const el=$('#ld-q-'+it.productId); if(!el) return;
    const planned=loaded[it.productId]!=null?loaded[it.productId]:it.quantity;
    upsertQty(it.productId,planned,Math.max(0,parseInt(el.value)||0));
  });
  ledgerForOrder(orderId).filter(e=>e.target==='ProductQuantity'&&!e.resolvedAt&&ledRowStatus(e)==='added')
    .slice().forEach(e=>{ const el=$('#ld-q-'+e.productId); if(el) upsertQty(e.productId,0,Math.max(0,parseInt(el.value)||0)); });
  [['ret','returns','ReturnQuantity'],['ext','extras','CustomExtraQuantity']].forEach(([prefix,coll,target])=>{
    ledgerSimpleRows(o[coll]||[],orderId,target).forEach(({r})=>{
      const el=$('#ld-'+prefix+'-'+r.id); if(!el) return;
      upsertSimple(target,r,r.quantity,Math.max(0,parseInt(el.value)||0));
    });
  });
  const np=val('ld-newprod'), nq=parseInt(val('ld-newqty'))||0;
  if(np&&nq>0) upsertQty(np,0,nq);
  const amt=val('ld-money')===''?null:Number(val('ld-money'));
  const note=val('ld-note');
  const cur=ledgerForOrder(orderId).find(e=>e.target==='Money'&&!e.resolvedAt);
  if(amt===null||amt===0){ if(cur){ DB.ledger=DB.ledger.filter(e=>e!==cur); touched++; } }
  else if(cur){ cur.amount=amt; cur.note=note; touched++; }
  else { DB.ledger.push({ id:'led-'+Math.random().toString(36).slice(2,7), clientId:o.clientId, orderId, stopId:orderId,
      target:'Money', productId:null, orderItemId:null, plannedQuantity:null, actualQuantity:null,
      plannedText:null, actualText:null, amount:amt, note, requiresFollowUp:true, resolvedAt:null,
      resolvedBy:null, resolutionNote:null, resolvedByOrderId:null, createdAt:daysFromNow(0), createdBy:ME.id }); touched++; }
  closeOverlay(); toast(touched?`Změny uloženy (${touched})`:'Nic se nezměnilo'); renderRoute();
}

    price+=(pr?pr.priceWithVat:0)*it.quantity; }
  else price+=priceFor(prodById(it.productId),o.clientId).price*it.quantity; }); return {items,price}; }

function delOrder(id){ confirmDialog('Zrušit objednávku?','Objednávka bude nastavena jako Zrušená.',()=>{

function orderHistoryProducts(clientId){
  const seen=new Set(); const list=[];
  DB.orders.filter(o=>o.clientId===clientId).sort((a,b)=>(b.createdDate||'').localeCompare(a.createdDate||''))
    .forEach(o=>o.items.forEach(it=>{ if(!seen.has(it.productId)){ seen.add(it.productId); const p=prodById(it.productId); if(p) list.push(p); } }));
  return list;
}

/* ---- open points of the selected client, shown ABOVE the cart -------------------
   Above, not below: it has to be read before the cart is built, not at the save
   button. This is the whole reason the ledger exists — the missing pieces and the
   money differences have to survive into the next order. */
function oeOpenItems(){
  const d=OE.draft; if(!d.clientId) return '';
  const open=ledgerOpen(d.clientId).filter(e=>e.orderId!==d.id);
  if(!open.length) return '';
  const rows=open.map(e=>{
    const owed=e.target==='ProductQuantity'?Math.max(0,(e.plannedQuantity||0)-(e.actualQuantity||0)):0;
    const inCart=owed?((d.items.find(it=>it.productId===e.productId)||{}).quantity||0):0;
    const settling=OE.settle.includes(e.id);
    /* Binary resolution means a short top-up would close the whole debt, so the
       shortfall is shown here rather than discovered after the fact. */
    const short=settling&&inCart<owed;
    return `<div class="led-item is-${ledState(e)}" style="padding:9px 10px">
      <div class="led-ico" style="width:26px;height:26px">${icon(ledIcon(e.target),13)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:700">${ledgerHeadline(e)}</div>
        ${e.note?`<div class="t-mut" style="font-size:11px;margin-top:2px">${esc(e.note)}</div>`:''}
        ${owed?`<div class="t-mut" style="font-size:11px;margin-top:3px">
          dluh ${owed} ks${settling?` · přidáno ${inCart} ks`:''}
          ${short?`<span class="chg-tag t-less" style="margin-left:4px">chybí ${owed-inCart} ks</span>`:''}
          ${settling&&!short?`<span class="chg-tag t-more" style="margin-left:4px">${icon('check',10)}dorovnáno</span>`:''}</div>`:''}
        ${ledState(e)==='assigned'?`<div class="t-mut" style="font-size:11px;margin-top:3px">už zařazeno do jiné objednávky</div>`:''}
      </div>
      ${owed&&!settling&&ledState(e)==='open'?`<button class="btn btn-sm btn-soft" style="flex:0 0 auto" onclick="oeSettle('${e.id}')">${icon('plus',13)}Přidat</button>`:''}
      ${settling?`<button class="btn btn-sm btn-ghost" style="flex:0 0 auto" onclick="oeUnsettle('${e.id}')">Zrušit</button>`:''}
    </div>`; }).join('');
  return `<div class="card" style="border-color:var(--warn)"><div class="card-head" style="background:var(--warn-tint)">
      ${icon('warnTri',16)}<h3 style="color:var(--warn)">Nedořešeno u tohoto klienta</h3><span class="tag">${open.length}</span></div>
    <div class="card-pad stack" style="gap:8px">${rows}</div></div>`;
}
/* Adds the owed pieces to the cart and links the entry to this draft. Linking is not
   the same as closing: the entry stays open, badged "in order X", until that order is
   actually delivered — otherwise cancelling it would make the debt vanish. */
function oeSettle(id){
  const e=DB.ledger.find(x=>x.id===id); if(!e) return;
  const owed=Math.max(0,(e.plannedQuantity||0)-(e.actualQuantity||0));
  if(!owed) return;
  syncOEmeta();
  const it=OE.draft.items.find(x=>x.productId===e.productId);
  if(it) it.quantity+=owed;
  else OE.draft.items.push({ id:'oi-'+Math.random().toString(36).slice(2,7), productId:e.productId, quantity:owed, reminderState:null });
  if(!OE.settle.includes(id)) OE.settle.push(id);
  oeFullRerender(); toast(`${owed} ks přidáno do objednávky`);
}
function oeUnsettle(id){ OE.settle=OE.settle.filter(x=>x!==id); oeFullRerender(); }

function oeTotals(){ let items=0,price=0; OE.draft.items.forEach(it=>{ items+=it.quantity;
  if(it.supplierGoodId){ const s=supplierById(it.supplierId); const g=s?goodById(s,it.supplierGoodId):null; const pr=g?goodPrimaryPrice(g):null;
    price+=(pr?pr.priceWithVat:0)*it.quantity; }
  else price+=priceFor(prodById(it.productId),OE.draft.clientId).price*it.quantity; }); return {items,price}; }

  const kindOk=p=>OE.kind==='all'||p.kind===OE.kind;
  content=DB.breweries.map(b=>{ const prods=productsOf(b.id).filter(p=>flt(p)&&kindOk(p)); if(!prods.length) return '';

  }).join('')||`<div class="empty" style="padding:30px"><div class="t">Žádné produkty v této kategorii</div></div>`;

/* group products by name so same-name / different-size variants cluster together */
function oeGroupList(prods,histBadge){
  const groups=[]; const idx={};
  prods.forEach(p=>{ if(idx[p.name]==null){ idx[p.name]=groups.length; groups.push({name:p.name,items:[p]}); } else groups[idx[p.name]].items.push(p); });
  return `<div class="stack" style="gap:9px">${groups.map(g=>g.items.length>1?oeVariantCard(g,histBadge):oeProductRow(g.items[0],histBadge)).join('')}</div>`;
}

/* ============ ROUTE MAP (stylized SVG, geographic projection) ============ */
const MAP_BOUNDS={ latMin:50.50, latMax:51.20, lngMin:14.72, lngMax:15.14 };
function projP(lat,lng,W,H,pad){ const b=MAP_BOUNDS;
  return { x: pad+(lng-b.lngMin)/(b.lngMax-b.lngMin)*(W-2*pad), y: pad+(b.latMax-lat)/(b.latMax-b.latMin)*(H-2*pad) }; }
function haversine(a,b){ const R=6371,d2r=Math.PI/180; const dLat=(b.lat-a.lat)*d2r,dLng=(b.lng-a.lng)*d2r;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*d2r)*Math.cos(b.lat*d2r)*Math.sin(dLng/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
function routeStats(pts){ let km=0; for(let i=1;i<pts.length;i++) km+=haversine(pts[i-1],pts[i]);
  const min=Math.round(km/45*60)+ (pts.length-1)*12; return { km:Math.round(km*10)/10, min }; }
function fmtDur(min){ const h=Math.floor(min/60),m=min%60; return h?`${h} h ${m} min`:`${m} min`; }
// stopPts: [{lat,lng,label,seq,color}], depot auto-added first & last

  const proj=seq.map(p=>({ ...p, ...projP(p.lat,p.lng,W,H,pad) }));
  const line=proj.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const cities=[['Žitava',50.897,14.807],['Zhořelec',51.152,14.988],['Liberec',50.770,15.058],['Hrádek n.N.',50.853,14.844],['Frýdlant',50.921,15.079]];
  const stats=stopPts.length?routeStats(seq):{km:0,min:0};
  const markers=proj.map((p,i)=>{ if(p.depot&&i>0) return '';
    if(p.depot) return `<g><circle cx="${p.x}" cy="${p.y}" r="15" fill="var(--navy)" stroke="#fff" stroke-width="3"/>
      <g transform="translate(${p.x-7},${p.y-7})" stroke="#fff" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">${IC.stock}</g>

  const cityDots=cities.map(([n,la,lo])=>{ const q=projP(la,lo,W,H,pad); return `<g opacity=".5"><circle cx="${q.x}" cy="${q.y}" r="2.5" fill="var(--text-3)"/>

      <rect width="${W}" height="${H}" fill="url(#grid)"/>
      <path d="M120 ${H} Q 300 ${H*0.55} 520 ${H*0.62} T ${W} ${H*0.35}" fill="none" stroke="var(--info)" stroke-width="6" opacity=".18" stroke-linecap="round"/>
      <path d="M${pad} ${H*0.3} Q ${W*0.4} ${H*0.15} ${W-pad} ${H*0.42}" fill="none" stroke="var(--ok)" stroke-width="42" opacity=".07" stroke-linecap="round"/>

/* ============ DELIVERY PLACES (client's own stop locations) ============ */
/* Inverse of projP — turns a click anywhere on the picker SVG back into
   lat/lng. The SVG uses preserveAspectRatio="xMidYMid slice", so the viewBox is
   scaled by max() and centre-cropped; both have to be undone here. */
function unprojP(clientX,clientY,svg,W,H,pad){
  const r=svg.getBoundingClientRect(); const b=MAP_BOUNDS;
  const s=Math.max(r.width/W,r.height/H);
  const x=(clientX-r.left-(r.width-W*s)/2)/s, y=(clientY-r.top-(r.height-H*s)/2)/s;
  return { lat: b.latMax-(y-pad)/(H-2*pad)*(b.latMax-b.latMin),
           lng: b.lngMin+(x-pad)/(W-2*pad)*(b.lngMax-b.lngMin) };
}

function estWeight(p){ if(!p) return 0; if(p.kind==='Keg') return (p.packageSize||30)*1.05+8; if(p.kind==='Bottle') return (p.packageSize||0.5)*20*1.1; if(p.kind==='Can'||p.kind==='Multipack') return (p.packageSize||6)*1.05; return 5; }
function advanceShip(id,to){ const s=DB.shipments.find(x=>x.id===id); s.state=to;

      // The order carrying a make-good has arrived, so the entries it settles close now.
      DB.ledger.filter(e=>e.resolvedByOrderId===o.id&&!e.resolvedAt).forEach(e=>{
        e.resolvedAt=daysFromNow(0); e.resolvedBy=ME.id; e.resolutionNote=`Vyřešeno objednávkou ${o.number}.`; }); } });
    let deducted=0; s.stops.forEach(st=>st.items.forEach(it=>{ const dq=it.dokladkaQty||0; if(dq>0){ const inv=DB.inventory.find(i=>i.id===it.fromInventoryId)||DB.inventory.find(i=>i.productId===it.productId);

/* ============ VÝVOZ — NAKLÁDKA (loading, invoices, dokládka) ============ */
function slFind(s,itemId){ for(const st of s.stops){ const it=st.items.find(i=>i.id===itemId); if(it) return it; } return null; }

      return `<tr class="${ledgerRowClass(led)}">

        <td style="width:34px;text-align:right">${pure&&editable?`<button class="icon-btn" style="width:28px;height:28px;color:var(--crit)" title="Odebrat" onclick="slRemoveItem('${it.id}')">${icon('trash',12)}</button>`:''}</td></tr>`; }).join('');
    // Products the client took at the door have no loaded row to decorate, so they are

    const ledOpen=stLed.filter(e=>!e.resolvedAt).length;
    const addrLed=stLed.find(e=>e.target==='DeliveryAddress');
    return `<div style="margin-bottom:6px">

          <div><div class="row gap8" style="flex-wrap:wrap"><span class="t-strong" style="font-size:13.5px">${esc(cl.name)}</span>
            ${st.addressKind==='Place'?`<span class="tag" style="border-color:var(--info);color:var(--info)">${icon('pin',11)}${esc((placeById(st.clientId,st.placeId)||{name:'místo'}).name)}</span>`:''}

            <div class="t-mut" style="font-size:11.5px">${st.addressKind==='Place'?placeAddrText(placeById(st.clientId,st.placeId)):`${fmtAddr(a)} · ${L.addrKind[st.addressKind]}`}</div>

        <div class="row gap8">
          ${canEdit('clients')&&st.orderId&&(s.state==='InTransit'||s.state==='Delivered')?`<button class="btn btn-sm btn-soft" onclick="ledgerDrawer('${st.orderId}')">${icon('edit',14)}Zaznamenat změnu</button>`:''}

        :`<div class="t-mut" style="font-size:12.5px;padding:8px 2px">Klient nemá v této nakládce žádné položky.</div>`}</div>`; }).join('');
  return `<div class="card"><div class="card-head">${icon('box',18)}<h3>Nakládka</h3>

        <div class="t-mut" style="font-size:13px">${num(totalPieces)} ks · <span class="t-strong" style="color:var(--amber-700)">${money(loadValue)}</span></div>

function slAddDokladka(orderId){ SL.dokStop=orderId;

  openOverlay(`<div class="modal-head">${icon('stock',18)}<h3>Dokládka ze skladu</h3><button class="icon-btn" data-scrim-close>${icon('close',16)}</button></div>

      <div class="form-grid" style="grid-template-columns:1fr">
        ${field('Produkt (skladem)',sel('dok-prod',stock.map(i=>{const p=prodById(i.productId);return [i.id,`${p.name}${p.packageSize!=null?' ('+fmtLiters(p.packageSize)+')':''} — skladem ${i.quantity} ks`];})))}
        ${field('Počet kusů',inp('dok-qty','1','','number'))}
      </div></div>

  $('#dok-save').onclick=slSaveDokladka; $$('[data-scrim-close]').forEach(b=>b.onclick=closeOverlay);
}
function slSaveDokladka(){ const invId=val('dok-prod'); const qty=parseInt(val('dok-qty'))||0;
  const inv=DB.inventory.find(i=>i.id===invId); if(!inv) return toast('Vyberte produkt','warnTri');
  if(qty<=0) return toast('Zadejte počet kusů','warnTri');
  if(qty>inv.quantity) return toast('Na skladě je jen '+inv.quantity+' ks','warnTri');
  const s=DB.shipments.find(x=>x.id===SL.shipId); const st=s.stops.find(x=>x.orderId===SL.dokStop); if(!st) return;
  const existing=st.items.find(i=>i.productId===inv.productId);
  if(existing){ existing.dokladkaQty=(existing.dokladkaQty||0)+qty; existing.fromInventoryId=inv.id; toast('Dokládka sloučena k položce'); }
  else { st.items.push({ id:'dok-'+Math.random().toString(36).slice(2,7), productId:inv.productId, quantity:0, dokladkaQty:qty, loaded:false, checked:false, source:'dokladka', fromInventoryId:inv.id }); toast('Dokládka přidána do nakládky'); }

/* ============ VÝVOZ — FAKTURACE ============
   Mirrors the backend shape: one invoice per (shipment, client, seq), each holding
   lines that reference a source item (order item / dokládka) + a quantity. A line
   whose source item belongs to another client's order is a cross-client line.
   NOTE: the fak* prefix is deliberate — inv* belongs to the Sklad module. */
let FA={ shipId:null, invId:null, lineId:null, closed:{} };
function fakNewId(){ return 'fak-'+Math.random().toString(36).slice(2,7); }
function fakLineId(){ return 'fl-'+Math.random().toString(36).slice(2,7); }
/** Every billable item in the shipment, paired with the stop (= ordering client) it came from. */
/* Billable sources: the stop's loaded lines, plus one synthetic line per product the
   client took at the door. Those have no loaded row to bill from — in the real schema
   they are their own invoice-line source kind (InvoiceLineSourceKind.LedgerEntry),
   which is what stops them going unbilled, the most expensive failure of the lot. */
function fakBillables(s){
  return s.stops.slice().sort((a,b)=>a.order-b.order).flatMap(st=>{
    const rows=st.items.map(it=>({it,st}));
    if(!st.orderId) return rows;
    ledgerForOrder(st.orderId).filter(e=>e.target==='ProductQuantity'
        &&ledRowStatus(e)==='added'&&!st.items.some(it=>it.productId===e.productId))
      .forEach(e=>rows.push({ it:{ id:'ledit-'+e.id, productId:e.productId, quantity:0, dokladkaQty:0,
        loaded:true, checked:true, source:'ledger' }, st, led:e }));
    return rows;
  });
}
/* What actually gets billed for one line. The deviation applies whether or not it has
   been settled with the client: seven of ten delivered is an invoice for seven, and it
   stays seven — the three that follow later are billed on THAT run's invoice. Letting a
   closed entry restore the plan would bill those pieces twice. */
function fakQty(it,st){
  const led=st&&st.orderId?ledgerQtyFor(st.orderId,it.productId):null;
  return led?led.actualQuantity:slQty(it);
}
/* Resolves an invoice line back to what it bills. Goes through fakBillables rather than
   st.items directly, so a line billing a product taken at the door — which has no loaded
   row — still resolves and renders. Counting it but failing to render it is how an
   invoice ends up with a total its own rows do not add up to. */
function fakSrc(s,itemId){ const hit=fakBillables(s).find(({it})=>it.id===itemId); return hit||null; }
function fakStopIndex(s,clientId){ const so=s.stops.slice().sort((a,b)=>a.order-b.order); const i=so.findIndex(st=>st.clientId===clientId); return i<0?99:i; }
function fakHomeFor(s,clientId){ let v=s.invoices.filter(x=>x.clientId===clientId).sort((a,b)=>a.seq-b.seq)[0];
  if(!v){ v={id:fakNewId(),clientId,seq:1,lines:[]}; s.invoices.push(v); } return v; }
/** Reconcile — the one piece of real logic. Guarantees: every client in the shipment has
 *  at least one invoice, every line points at an item still present, and every loaded piece
 *  is covered exactly once. Surplus lands on the ordering client's 1st invoice.
 *  Anything it had to change to an ALREADY-split item is appended to s.fakLog, so the UI can
 *  tell the user their split was adjusted underneath them. Materialising the default split for
 *  the first time is not a change and is never logged. */
function fakEnsure(s){
  if(!s.invoices) s.invoices=[];
  const log=[];
  const src=fakBillables(s);
  const clients=[...new Set(src.map(x=>x.st.clientId))];
  clients.forEach(cid=>{ if(!s.invoices.some(v=>v.clientId===cid)) s.invoices.push({id:fakNewId(),clientId:cid,seq:1,lines:[]}); });
  s.invoices=s.invoices.filter(v=>clients.includes(v.clientId)||v.lines.length);
  // lines pointing at items that left the shipment entirely
  const known=new Set(src.map(x=>x.it.id));
  s.invoices.forEach(v=>{ v.lines=v.lines.filter(l=>{
    if(known.has(l.itemId)) return true;
    log.push({t:'gone',productId:(s.fakItemProduct||{})[l.itemId],qty:l.qty}); return false; }); });
  src.forEach(({it,st})=>{
    const total=fakQty(it,st);
    let assigned=0; s.invoices.forEach(v=>v.lines.forEach(l=>{ if(l.itemId===it.id) assigned+=l.qty; }));
    const diff=total-assigned;
    if(diff>0){ const home=fakHomeFor(s,st.clientId); const l=home.lines.find(x=>x.itemId===it.id);
      // assigned>0 means this item was already split — so this is drift, not first materialisation
      if(assigned>0) log.push({t:'inc',productId:it.productId,qty:diff,clientId:st.clientId});
      if(l) l.qty+=diff; else home.lines.push({id:fakLineId(),itemId:it.id,qty:diff}); }
    else if(diff<0){ let over=-diff;
      log.push({t:'dec',productId:it.productId,qty:over,clientId:st.clientId});
      // Trim order: other clients' invoices first, then the ordering client's extra invoices,
      // and their 1st invoice last — so a quantity cut never turns an ordinary line into a
      // cross-client one by wiping the owner's claim first.
      const rank=v=>(v.clientId===st.clientId?1:0);
      s.invoices.slice().sort((a,b)=>rank(a)-rank(b)||b.seq-a.seq).forEach(v=>v.lines.forEach(l=>{
        if(l.itemId===it.id&&over>0){ const t=Math.min(over,l.qty); l.qty-=t; over-=t; } })); }
  });
  s.invoices.forEach(v=>{ v.lines=v.lines.filter(l=>l.qty>0); });
  // remember itemId -> productId so a later removal can still name the product
  s.fakItemProduct=Object.fromEntries(src.map(({it})=>[it.id,it.productId]));
  if(log.length) s.fakLog=[...(s.fakLog||[]),...log];
  return s.invoices;
}
function fakClearLog(){ const s=DB.shipments.find(x=>x.id===SL.shipId); if(!s) return;
  delete s.fakLog; fakRerender(); }
/** Banner telling the user the split was adjusted because the loading changed under it. */
function fakLogBanner(s){
  const log=s.fakLog||[]; if(!log.length) return '';
  const items=log.map(e=>{ const p=prodById(e.productId); const nm=esc(p?p.name:'položka');
    if(e.t==='gone') return `<li><b>${nm}</b> — odebrána z nakládky, řádky faktur zrušeny (${e.qty} ks)`;
    if(e.t==='inc') return `<li><b>${nm}</b> — přidáno ${e.qty} ks na 1. fakturu objednavatele`;
    return `<li><b>${nm}</b> — odebráno ${e.qty} ks (nejdřív z přefakturovaných)`; }).join('');
  return `<div class="row gap12" style="align-items:flex-start;padding:11px 13px;margin-bottom:12px;
      border:1px solid var(--amber);background:var(--amber-soft);border-radius:var(--r)">
    <span style="color:var(--amber-700);flex:0 0 auto;margin-top:1px">${icon('warnTri',17)}</span>
    <div style="flex:1;min-width:0">
      <div class="t-strong" style="font-size:13px">Množství v nakládce se změnilo — rozdělení na faktury bylo upraveno</div>
      <ul style="margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--text-2);line-height:1.65">${items}</ul>
      <div class="t-mut" style="font-size:11.5px;margin-top:6px">Zkontrolujte rozdělení, případně kusy přesuňte ručně.</div>
    </div>
    <button class="icon-btn" style="width:26px;height:26px;flex:0 0 auto" title="Skrýt" onclick="fakClearLog()">${icon('close',14)}</button>
  </div>`;
}
function fakSorted(s){ return s.invoices.slice().sort((a,b)=>fakStopIndex(s,a.clientId)-fakStopIndex(s,b.clientId)||a.seq-b.seq); }
function fakPieces(v){ return v.lines.reduce((x,l)=>x+l.qty,0); }
function fakValue(s,v){ return v.lines.reduce((x,l)=>{ const q=fakSrc(s,l.itemId);
  return x+((q?prodById(q.it.productId)?.priceWithVat:0)||0)*l.qty; },0); }
function fakLabel(s,v){ const cl=clientById(v.clientId); return `${cl?cl.name:'—'} · Faktura ${v.seq}`; }
function fakIsCross(s,v,l){ const q=fakSrc(s,l.itemId); return !!q&&q.st.clientId!==v.clientId; }
/** Clients that own a band, in route order. */
function fakClients(s){ const order=[...new Set(fakBillables(s).map(x=>x.st.clientId))];
  s.invoices.forEach(v=>{ if(!order.includes(v.clientId)) order.push(v.clientId); });
  return order.sort((a,b)=>fakStopIndex(s,a)-fakStopIndex(s,b)); }
function fakInvoicesOf(s,cid){ return s.invoices.filter(v=>v.clientId===cid).sort((a,b)=>a.seq-b.seq); }
function fakRerender(){ const s=DB.shipments.find(x=>x.id===SL.shipId); const el=$('#ship-inv'); if(el&&s) el.innerHTML=shipInvoiceCard(s); }

/* ---- band collapse state (per shipment + client) ---- */
function fakBandKey(s,cid){ return s.id+':'+cid; }
function fakBandOpen(s,cid){ return !FA.closed[fakBandKey(s,cid)]; }
function fakToggleBand(cid){ const s=DB.shipments.find(x=>x.id===SL.shipId); if(!s) return;
  const k=fakBandKey(s,cid); FA.closed[k]=!FA.closed[k]; fakRerender(); }
function fakSetAllBands(closed){ const s=DB.shipments.find(x=>x.id===SL.shipId); if(!s) return;
  fakClients(s).forEach(cid=>{ FA.closed[fakBandKey(s,cid)]=closed; }); fakRerender(); }

/* ---- rendering ----
   Lines are full-width table rows, not cards: a client normally has exactly one
   invoice, and a fixed-width card would leave most of the row empty. The invoice
   only gets its own sub-header row once a client actually has more than one. */
/** Collapse an invoice's lines to one row per product. The same product can arrive from
 *  several sources (own order, another client's order, stock) — those become chips on the
 *  single row rather than duplicate rows. `parts` keeps the exact per-source breakdown, which
 *  is what a move actually operates on. */
function fakGroups(s,v){
  const map=new Map(); const order=[];
  v.lines.forEach(l=>{ const q=fakSrc(s,l.itemId); if(!q) return;
    let g=map.get(q.it.productId);
    if(!g){ g={productId:q.it.productId,qty:0,parts:[]}; map.set(q.it.productId,g); order.push(q.it.productId); }
    g.qty+=l.qty; g.parts.push({line:l,src:q}); });
  return order.map(k=>map.get(k));
}
/** Human label for where one part's pieces came from. */
function fakPartOrigin(s,v,part){
  if(part.src.it.source==='dokladka') return 'ze skladu';
  if(part.src.st.clientId!==v.clientId) return `z obj. ${clientById(part.src.st.clientId)?.name||'—'}`;
  return 'z vlastní objednávky';
}
/** One product row on an invoice: name, origin chips, total quantity, value, move action. */
function fakGroupTr(s,v,g,editable){
  const p=prodById(g.productId);
  const merged=g.parts.length>1;
  const qty=n=>merged?`${n} ks `:'';
  const chip=(cls,ic,txt)=>`<span class="pill ${cls}" style="height:19px;font-size:10.5px;padding:0 7px">${icon(ic,10)}${txt}</span>`;
  const stock=g.parts.filter(x=>x.src.it.source==='dokladka').reduce((a,x)=>a+x.line.qty,0);
  const withDokladka=g.parts.some(x=>x.src.it.source!=='dokladka'&&(x.src.it.dokladkaQty||0)>0);
  const foreign=new Map();
  g.parts.forEach(x=>{ if(x.src.it.source!=='dokladka'&&x.src.st.clientId!==v.clientId)
    foreign.set(x.src.st.clientId,(foreign.get(x.src.st.clientId)||0)+x.line.qty); });
  const badges=[
    stock>0?chip('s-info','stock',stock===g.qty?'ze skladu':`${stock} ks ze skladu`):'',
    withDokladka?chip('s-info','stock','obsahuje dokládku'):'',
    ...[...foreign].map(([cid,n])=>chip('s-amber','warnTri',`${qty(n)}z obj. ${esc(clientById(cid)?.name||'—')}`)),
  ].filter(Boolean).join('');
  return `<tr>
    <td><div class="row gap8" style="flex-wrap:wrap">
      <span class="t-strong" style="font-size:13px">${esc(p?p.name:'—')}</span>
      <span class="tag">${kindChipText(p?.kind)}${p?.packageSize!=null?' · '+fmtLiters(p.packageSize):''}</span>${badges}</div></td>
    <td class="num"><span class="t-strong">${g.qty} ks</span></td>
    <td class="num">${money((p?.priceWithVat||0)*g.qty)}</td>
    <td style="width:44px;text-align:right">${editable?`<button class="icon-btn" style="width:26px;height:26px" title="Přesunout kusy na jinou fakturu"
      onclick="fakMoveModal('${v.id}','${g.productId}')">${icon('moveTo',13)}</button>`:''}</td></tr>`;
}
/** Tinted group header for one invoice — only rendered when the client has 2+. */
function fakInvoiceTr(s,v,editable){
  return `<tr style="background:var(--surface-2)">
    <td class="t-strong" style="font-size:12px">Faktura ${v.seq}</td>
    <td class="num t-strong" style="font-size:12px">${fakPieces(v)} ks</td>
    <td class="num t-strong" style="font-size:12px;color:var(--amber-700)">${money(fakValue(s,v))}</td>
    <td style="text-align:right">${editable&&v.seq>1?`<button class="icon-btn" style="width:26px;height:26px;color:var(--crit)" title="Smazat fakturu" onclick="fakDelete('${v.id}')">${icon('trash',12)}</button>`:''}</td></tr>`;
}
function fakEmptyTr(){ return `<tr><td colspan="4" class="t-mut" style="font-size:12.5px">Zatím bez položek — přesuňte je z jiné faktury.</td></tr>`; }
/** One client band: header with the stop number + rollup, then that client's invoice cards
 *  stacked full-width below it. Bands stack vertically, so nothing wraps sideways. */
function fakBand(s,cid,first,editable){
  const vs=fakInvoicesOf(s,cid); const cl=clientById(cid); const idx=fakStopIndex(s,cid);
  const pieces=vs.reduce((x,v)=>x+fakPieces(v),0);
  const value=vs.reduce((x,v)=>x+fakValue(s,v),0);
  const cross=vs.reduce((n,v)=>n+v.lines.filter(l=>fakIsCross(s,v,l)).length,0);
  const open=fakBandOpen(s,cid);
  const split=vs.length>1;   // only label individual invoices once there is more than one
  const rows=vs.map(v=>{
    const lines=fakGroups(s,v).map(g=>fakGroupTr(s,v,g,editable)).join('')||fakEmptyTr();
    return (split?fakInvoiceTr(s,v,editable):'')+lines;
  }).join('');
  return `<div style="padding:12px 0;${first?'':'border-top:1px solid var(--border)'}">
    <div class="row gap8" style="flex-wrap:wrap;margin-bottom:${open?'10px':'0'}">
      <span class="av" style="width:26px;height:26px;background:${colorFor(cid)};color:#fff;font-size:12px;flex:0 0 auto">${idx<99?idx+1:'?'}</span>
      <div style="flex:1;min-width:0">
        <div class="t-strong" style="font-size:13.5px">${esc(cl?cl.name:'—')}</div>
        <div class="t-mut" style="font-size:11.5px">${vs.length} ${plural(vs.length,'faktura','faktury','faktur')} · ${num(pieces)} ks · ${money(value)}</div></div>
      ${cross?`<span class="pill s-amber"><span class="d"></span>${cross}× přefakturováno</span>`:''}
      ${editable?`<button class="btn btn-sm btn-ghost" onclick="fakAddFor('${cid}')">${icon('plus',13)}Faktura</button>`:''}
      <button class="icon-btn" style="width:28px;height:28px;transition:transform .15s;transform:${open?'rotate(180deg)':'none'}"
        title="${open?'Sbalit':'Rozbalit'}" onclick="fakToggleBand('${cid}')">${icon('chevD',15)}</button>
    </div>
    ${open?`<div class="tbl-wrap"><table class="tbl" style="min-width:0">
      <thead><tr><th>Produkt</th><th style="text-align:right;width:90px">Množství</th><th style="text-align:right;width:120px">Hodnota</th><th style="width:44px"></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`:''}
  </div>`;
}
function shipInvoiceCard(s){
  const editable=canEdit('shipments')&&s.state!=='Delivered'&&s.state!=='Cancelled';
  fakEnsure(s);
  const clients=fakClients(s);
  const totalPieces=fakBillables(s).reduce((x,{it,st})=>x+fakQty(it,st),0);
  const billed=s.invoices.reduce((x,v)=>x+fakPieces(v),0);
  const totalValue=s.invoices.reduce((x,v)=>x+fakValue(s,v),0);
  const crossN=s.invoices.reduce((n,v)=>n+v.lines.filter(l=>fakIsCross(s,v,l)).length,0);
  const rest=totalPieces-billed;
  const openN=clients.filter(cid=>fakBandOpen(s,cid)).length;
  const bands=clients.map((cid,i)=>fakBand(s,cid,i===0,editable)).join('')
    ||`<div class="t-mut" style="font-size:13px;padding:8px 2px">Vývoz nemá žádné položky k fakturaci.</div>`;
  return `<div class="card"><div class="card-head">${icon('wallet',18)}<h3>Fakturace</h3>
      <span class="sub" style="margin-left:auto">Rozdělení položek vývozu na faktury — pro fakturaci klientům</span></div>
    <div class="card-pad">
      ${fakLogBanner(s)}
      <div class="row gap8" style="justify-content:space-between;flex-wrap:wrap">
        <div class="row gap8" style="flex-wrap:wrap">
          <span class="pill s-grey"><span class="d"></span>${s.invoices.length} ${plural(s.invoices.length,'faktura','faktury','faktur')} · ${clients.length} ${plural(clients.length,'klient','klienti','klientů')}</span>
          <span class="pill ${rest===0?'s-ok':'s-crit'}"><span class="d"></span>${rest===0?`vše rozděleno · ${num(billed)} ks`:`${num(rest)} ks nerozděleno`}</span>
          ${crossN?`<span class="pill s-amber"><span class="d"></span>${crossN} ${plural(crossN,'položka fakturována','položky fakturovány','položek fakturováno')} jinému klientovi</span>`:''}
        </div>
        <div class="row gap8">
          <span class="t-mut" style="font-size:13px">Celkem <span class="t-strong" style="color:var(--amber-700)">${money(totalValue)}</span></span>
          ${clients.length>1?`<button class="btn btn-sm btn-ghost" onclick="fakSetAllBands(${openN>0})">${icon(openN>0?'arrowU':'arrowD',13)}${openN>0?'Sbalit vše':'Rozbalit vše'}</button>`:''}</div>
      </div>
      ${bands}
    </div></div>`;
}

/** Resolve the product group a move dialog is operating on. */
function fakGroupOf(s,invId,productId){
  const v=s.invoices.find(x=>x.id===invId); if(!v) return null;
  return fakGroups(s,v).find(g=>g.productId===productId)||null;
}
/** Move N pieces of one product to another invoice — including an invoice of a different client.
 *  Rows are merged per product, so when a product on this invoice came from several sources the
 *  dialog asks which origin to take the pieces from. */
function fakMoveModal(invId,productId){
  const s=DB.shipments.find(x=>x.id===SL.shipId); if(!s) return;
  const from=s.invoices.find(x=>x.id===invId); const g=fakGroupOf(s,invId,productId);
  if(!from||!g||!g.parts.length) return;
  const p=prodById(productId);
  FA.shipId=s.id; FA.invId=invId; FA.productId=productId;
  // biggest part first, so the default pick is the most likely one
  const parts=g.parts.slice().sort((a,b)=>b.line.qty-a.line.qty);
  const owners=[...new Set(g.parts.map(x=>x.src.st.clientId))];
  const groups=fakClients(s).map(cid=>{
    const vs=fakInvoicesOf(s,cid); if(!vs.length) return '';
    const cl=clientById(cid);
    const opts=vs.filter(v=>v.id!==invId).map(v=>`<option value="${v.id}">Faktura ${v.seq} — ${fakPieces(v)} ks</option>`).join('')
      +`<option value="new:${cid}">+ nová faktura ${Math.max(...vs.map(v=>v.seq))+1}</option>`;
    return `<optgroup label="${esc(cl?cl.name:'—')}${owners.includes(cid)?' — objednavatel':''}">${opts}</optgroup>`; }).join('');
  const srcField=parts.length>1
    ? field('Původ kusů',`<select class="select" id="fmv-src">${parts.map(x=>
        `<option value="${x.line.id}">${esc(fakPartOrigin(s,from,x))} — ${x.line.qty} ks</option>`).join('')}</select>`,
        {hint:'Tento produkt je na faktuře z více zdrojů. Přesouvá se vždy z jednoho z nich.'})
    : '';
  openOverlay(`<div class="modal-head">${icon('moveTo',18)}<h3>Přesunout na jinou fakturu</h3><button class="icon-btn" data-scrim-close>${icon('close',16)}</button></div>
    <div class="modal-body">
      <div class="row gap12" style="padding:11px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);margin-bottom:14px">
        <div style="flex:1;min-width:0"><div class="t-strong" style="font-size:13px">${esc(p?p.name:'—')}</div>
          <div class="t-mut" style="font-size:11.5px">z ${esc(fakLabel(s,from))} · ${esc(fakPartOrigin(s,from,parts[0]))}${parts.length>1?` a ${parts.length-1} dalš${parts.length===2?'ího zdroje':'ích zdrojů'}`:''}</div></div>
        <span class="tnum t-strong">${g.qty} ks</span></div>
      <div class="form-grid" style="grid-template-columns:1fr">
        ${srcField}
        ${field('Počet kusů k přesunu',inp('fmv-qty',String(parts[0].line.qty),'','number'),{hint:`Ze zvoleného zdroje lze přesunout nejvýš ${parts[0].line.qty} ks. Zbytek zůstane zde.`})}
        ${field('Cílová faktura',`<select class="select" id="fmv-target">${groups}</select>`,{hint:'Můžete zvolit i fakturu jiného klienta — položka se označí jako přefakturovaná.'})}
      </div></div>
    <div class="modal-foot"><button class="btn btn-ghost" data-scrim-close>Zrušit</button>
      <button class="btn btn-primary" id="fmv-save">${icon('moveTo',15)}Přesunout</button></div>`,{center:true});
  $('#fmv-save').onclick=fakSaveMove; $$('[data-scrim-close]').forEach(b=>b.onclick=closeOverlay);
}
function fakSaveMove(){
  const s=DB.shipments.find(x=>x.id===FA.shipId); if(!s) return closeOverlay();
  const from=s.invoices.find(x=>x.id===FA.invId); const g=fakGroupOf(s,FA.invId,FA.productId);
  if(!from||!g||!g.parts.length) return closeOverlay();
  const pick=val('fmv-src');
  const part=(pick&&g.parts.find(x=>x.line.id===pick))
    ||(g.parts.length===1?g.parts[0]:g.parts.slice().sort((a,b)=>b.line.qty-a.line.qty)[0]);
  if(!part) return toast('Vyberte původ kusů','warnTri');
  const l=part.line;
  const qty=parseInt(val('fmv-qty'))||0; const target=val('fmv-target');
  if(qty<=0) return toast('Zadejte počet kusů','warnTri');
  if(qty>l.qty) return toast('Z tohoto zdroje lze přesunout jen '+l.qty+' ks','warnTri');
  let to;
  if(target.startsWith('new:')){ const cid=target.slice(4);
    const seq=Math.max(0,...s.invoices.filter(v=>v.clientId===cid).map(v=>v.seq))+1;
    to={id:fakNewId(),clientId:cid,seq,lines:[]}; s.invoices.push(to); }
  else to=s.invoices.find(v=>v.id===target);
  if(!to) return toast('Vyberte cílovou fakturu','warnTri');
  const ex=to.lines.find(x=>x.itemId===l.itemId);
  if(ex) ex.qty+=qty; else to.lines.push({id:fakLineId(),itemId:l.itemId,qty});
  l.qty-=qty; if(l.qty<=0) from.lines=from.lines.filter(x=>x.id!==l.id);
  FA.closed[fakBandKey(s,to.clientId)]=false;   // never hide the destination
  closeOverlay(); fakRerender(); toast(`Přesunuto ${qty} ks → ${fakLabel(s,to)}`);
}
/** Add an empty extra invoice for one client, ready to receive moved lines. */
function fakAddFor(clientId){
  const s=DB.shipments.find(x=>x.id===SL.shipId); if(!s) return;
  const seq=Math.max(0,...s.invoices.filter(v=>v.clientId===clientId).map(v=>v.seq))+1;
  s.invoices.push({id:fakNewId(),clientId,seq,lines:[]});
  FA.closed[fakBandKey(s,clientId)]=false;
  fakRerender(); toast(`Faktura ${seq} pro ${clientById(clientId)?.name} vytvořena`);
}
/** Deleting an invoice just drops it — reconcile returns its pieces to the ordering client's 1st invoice. */
function fakDelete(invId){
  const s=DB.shipments.find(x=>x.id===SL.shipId); const v=s&&s.invoices.find(x=>x.id===invId); if(!v) return;
  const n=fakPieces(v);
  const go=()=>{ s.invoices=s.invoices.filter(x=>x.id!==invId); fakRerender();
    toast(n?`Faktura smazána — ${n} ks vráceno objednavateli`:'Faktura smazána','trash'); };
  if(n) confirmDialog('Smazat fakturu?',`Faktura obsahuje ${n} ks. Položky se vrátí na 1. fakturu klienta, který je objednal.`,go);
  else go();
}

/* ---- Shipment planner ---- */
let SH={ draft:null, drag:null, regionFilter:'all' };
function shipmentUsedOrderIds(exceptId){ const set=new Set(); DB.shipments.forEach(s=>{ if(s.id===exceptId)return; s.stops.forEach(st=>set.add(st.orderId)); }); return set; }
function viewShipmentEditor(id){
  if(id){ const s=DB.shipments.find(x=>x.id===id); SH.draft={ id:s.id, number:s.number, name:s.name, deliveryDate:s.deliveryDate, vehicleId:s.vehicleId,
    driverIds:[...s.driverIds], stops:s.stops.map(st=>({...st})), extraCustom:(s.extraCustom||[]).map(e=>({...e})) }; }
  else SH.draft={ id:null, name:'', deliveryDate:daysFromNow(2)+'T07:00', vehicleId:null, driverIds:[], stops:[], extraCustom:[] };
  SH.regionFilter='all';
  return seHTML();
}
function seRerender(){ $('#view').innerHTML=seHTML(); }
function seHTML(){
  const d=SH.draft;
  const used=shipmentUsedOrderIds(d.id);
  const avail=DB.orders.filter(o=>['New','Planning','Delivering'].includes(o.state)&&(!used.has(o.id)||d.stops.some(st=>st.orderId===o.id)));

  const pts=shipStopPoints(d.stops);
  const veh=vehicleById(d.vehicleId);
  const totalWeight=stopsSorted.reduce((w,st)=>{const o=DB.orders.find(x=>x.id===st.orderId);return w+ (o?o.items.reduce((x,it)=>x+estWeight(prodById(it.productId))*it.quantity,0):0);},0);
  // available orders list — region filter
  const regionsPresent=[...new Set(avail.map(o=>clientById(o.clientId).region))].sort((a,b)=>(L.region[a]||a).localeCompare(L.region[b]||b));
