/* Stacked rather than laid out in a row: the rail is the narrow column and three inputs
   side by side would not survive it. The note hides behind a toggle for the same reason —
   most lines never get one. */
function tillCartLine(it){
  const stock=saleStock(it.inventoryId), over=it.quantity>stock;
  const noteOpen=TILL.noteOpen[it.inventoryId]||!!it.note;
  const label=esc(saleItemName(it));
  return `<div style="border:1px solid var(--border);border-radius:var(--r);padding:10px">
    <div class="row gap8" style="align-items:flex-start">
      <div style="flex:1;min-width:0"><div class="t-strong" style="font-size:13px">${label}</div>
        <div style="font-size:11px;color:${over?'var(--crit)':'var(--text-3)'}">${over?`skladem jen ${stock}`
          :`skladem ${stock}${it.listPrice!=null?' · ceník '+money(it.listPrice):' · bez ceníku'}`}</div></div>
      <button class="icon-btn" style="width:26px;height:26px;color:var(--crit)" onclick="tillRemove('${it.inventoryId}')" aria-label="Odebrat ${label}">${icon('trash',13)}</button></div>
    <div class="row gap8" style="margin-top:9px">
      <button class="icon-btn" style="width:28px;height:28px" onclick="tillStep('${it.inventoryId}',-1)" aria-label="Snížit počet ${label}">−</button>
      <input class="input tnum" id="till-q-${it.inventoryId}" type="number" min="0" max="${stock}" value="${it.quantity}"
        style="width:58px;height:30px;padding:0 6px;text-align:center" oninput="tillQty('${it.inventoryId}',this.value)" aria-label="Počet ${label}">
      <button class="icon-btn" style="width:28px;height:28px" onclick="tillStep('${it.inventoryId}',1)" ${it.quantity>=stock?'disabled':''} aria-label="Zvýšit počet ${label}">+</button>
      <input class="input tnum" id="till-p-${it.inventoryId}" type="number" min="0" step="1" value="${it.unitPrice!=null?it.unitPrice:''}" placeholder="cena"
        style="width:82px;height:30px;padding:0 7px;text-align:right" oninput="tillPrice('${it.inventoryId}',this.value)" aria-label="Cena za kus ${label}">
      <span class="tnum t-strong" id="till-lt-${it.inventoryId}" style="flex:1;text-align:right;font-size:13px">${money((it.quantity||0)*(it.unitPrice||0))}</span></div>
    ${noteOpen
      ? `<input class="input" id="till-n-${it.inventoryId}" value="${esc(it.note||'')}" placeholder="Poznámka k položce" style="margin-top:9px;height:32px"
          oninput="tillLineNote('${it.inventoryId}',this.value)" aria-label="Poznámka k ${label}">`
      : `<button style="margin-top:9px;background:none;border:0;padding:0;color:var(--text-3);font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px"
          onclick="tillOpenNote('${it.inventoryId}')">${icon('note',13)}poznámka</button>`}
  </div>`;
}
function tillRefreshCart(){ const c=$('#till-cart'); if(c) c.innerHTML=tillCart(); tillRefreshTotals(); }
function tillRefreshTotals(){
  const t=saleTotals(TILL.draft);
  const c=$('#till-sum-count'); if(c) c.textContent=t.items+' '+plural(t.items,'kus','kusy','kusů');
  const m=$('#till-sum-total'); if(m) m.textContent=money(t.total);
}
function tillAdd(invId,price,qty){
  const inv=DB.inventory.find(i=>i.id===invId); if(!inv) return;
  const ex=TILL.draft.items.find(x=>x.inventoryId===invId);
  if(ex) ex.quantity=Math.min(ex.quantity+1,inv.quantity);
  // Any path that adds without naming a price still lands on the buyer's own price —
  // tillStep reaches here that way, and a line must not depend on which button opened it.
  else {
    const p=inv.productId?prodById(inv.productId):null;
    const resolved=price!=null?price:(p?priceFor(p,tillClientId()).price:null);
    TILL.draft.items.push(saleLine(inv,Math.min(Math.max(qty||1,1),inv.quantity),resolved));
  }
  tillRerenderCatalog(); tillRefreshCart();
}
function tillStep(invId,delta){
  const it=TILL.draft.items.find(x=>x.inventoryId===invId);
  if(!it) return tillAdd(invId);
  const next=it.quantity+delta;
  if(next<=0) TILL.draft.items=TILL.draft.items.filter(x=>x.inventoryId!==invId);
  else it.quantity=Math.min(next,saleStock(invId));
  tillRerenderCatalog(); tillRefreshCart();
}
function tillQty(invId,raw){
  const it=TILL.draft.items.find(x=>x.inventoryId===invId); if(!it) return;
  const stock=saleStock(invId); let v=parseInt(raw); if(isNaN(v)) v=0;
  // Clamped at the input rather than only on save: you cannot hand over what is not there.
  if(v>stock){ v=stock; const el=$('#till-q-'+invId); if(el) el.value=stock; toast('Na skladě je jen '+stock+' ks','warnTri'); }
  if(v<0) v=0;
  it.quantity=v; tillLineTotal(it); tillRefreshTotals(); tillRerenderCatalog();
}
function tillPrice(invId,raw){
  const it=TILL.draft.items.find(x=>x.inventoryId===invId); if(!it) return;
  const v=parseFloat((raw||'').replace(',','.'));
  it.unitPrice=(raw===''||isNaN(v))?null:v; tillLineTotal(it); tillRefreshTotals();
}
function tillLineNote(invId,v){ const it=TILL.draft.items.find(x=>x.inventoryId===invId); if(it) it.note=v; }
function tillOpenNote(invId){ TILL.noteOpen[invId]=true; tillRefreshCart(); const el=$('#till-n-'+invId); if(el) el.focus(); }
function tillLineTotal(it){ const el=$('#till-lt-'+it.inventoryId);
  if(el) el.textContent=money((it.quantity||0)*(it.unitPrice||0)); }
function tillRemove(invId){ TILL.draft.items=TILL.draft.items.filter(x=>x.inventoryId!==invId); delete TILL.noteOpen[invId];
  tillRerenderCatalog(); tillRefreshCart(); }
function tillSave(complete){
  tillSync(); const d=TILL.draft;
  if(!d.items.length) return toast('Přidejte alespoň jednu položku','warnTri');
  if(d.buyerKind==='Client'&&!d.clientId) return toast('Vyberte klienta','warnTri');
  if(d.items.some(i=>!i.quantity)) return toast('Každá položka musí mít počet větší než 0','warnTri');
  // The invoice block is required on every save, draft included — an invoiced sale that
  // cannot be chased is not a saved sale.
  if(d.payment==='Invoice'){
    if(!(d.billing.name||'').trim()) return toast('Vyplňte název pro fakturu','warnTri');
    if(!d.billing.dueDate) return toast('Vyplňte splatnost faktury','warnTri');
  }
  if(complete){
    if(d.items.some(i=>i.unitPrice==null||i.unitPrice<=0)) return toast('Doplňte cenu u všech položek','warnTri');
    const over=d.items.find(i=>i.quantity>saleStock(i.inventoryId));
    if(over) return toast('Na skladě je jen '+saleStock(over.inventoryId)+' ks: '+over.name,'warnTri');
  }
  const payload={ date:d.date, buyerKind:d.buyerKind, clientId:d.buyerKind==='Client'?d.clientId:null,
    buyerName:d.buyerKind==='Walkin'?d.buyerName:'', payment:d.payment,
    billing:d.payment==='Invoice'?{...d.billing}:null, items:d.items.map(i=>({...i})), note:d.note };
  let sale;
  if(d.id){ sale=DB.sales.find(x=>x.id===d.id); Object.assign(sale,payload); }
  else { sale={ id:'s-'+Math.random().toString(36).slice(2,7), publicId:newPublicId(), state:'Draft',
      soldBy:ME.id, completedAt:null, ...payload };
    DB.sales.push(sale); d.id=sale.id; d.publicId=sale.publicId; }
  if(complete) completeSale(sale.id,()=>go('sales/'+sale.id));
  else { toast('Prodej uložen jako rozpracovaný'); go('sales/'+sale.id); }
}

/* ============ MODULE: REPORTY (GARÁŽOVÝ PRODEJ) ============
   What the counter took, what moved off the shelf and who bought it. Same shape as the
   vývoz Reporty: one page, three tabs, a shared period preset. */
let SREP={ tab:'revenue', period:90, gran:'week' };
const SREP_TONE={ amber:'#F08C00', info:'#0E7C9B', ok:'#15873F', grey:'#5A6675', crit:'#C22A2A' };
const SREP_TOP_N=10;

/* ---- synthetic history of completed counter sales (~6 months) ---- */
let SALES_HISTORY=null;
function salesHistory(){ if(!SALES_HISTORY) SALES_HISTORY=buildSalesHistory(); return SALES_HISTORY; }
function buildSalesHistory(){
  const rnd=mulberry32(20260817), sellable=DB.inventory.filter(i=>i.productId), clients=DB.clients;
  const today=new Date(SEED_TODAY), recs=[];
  for(let back=181; back>=0; back--){
    const day=new Date(today); day.setDate(day.getDate()-back);
    const iso=day.toISOString().slice(0,10), dow=day.getDay();
    if(dow===0) continue;                                   // u pultu se v neděli nezavírá
    const busy=(dow===5||dow===6)?2.6:1.1;                  // pátek a sobota táhnou
    const nSales=Math.max(0,Math.round(busy*(0.3+rnd()*1.5)));
    for(let n=0;n<nSales;n++){
      const isClient=rnd()<0.42;
      const client=isClient?clients[Math.floor(rnd()*clients.length)]:null;
      const payment=isClient&&rnd()<0.62?'Invoice':'Cash';
      const items=[];
      const nLines=1+Math.floor(rnd()*3);
      for(let l=0;l<nLines;l++){
        const inv=sellable[Math.floor(rnd()*sellable.length)], p=prodById(inv.productId);
        const qty=p.kind==='Keg'?1+Math.floor(rnd()*3):1+Math.floor(rnd()*6);
        // Sleva u pravidelných odběratelů — ceník je strop, ne pravidlo.
        const disc=isClient&&rnd()<0.35?Math.round(p.priceWithVat*(0.05+rnd()*0.12)):0;
        items.push({ inventoryId:inv.id, name:p.name, kind:p.kind, packageSize:p.packageSize,
          qty, unitPrice:p.priceWithVat-disc, listPrice:p.priceWithVat });
      }
      recs.push({ date:iso, buyerKind:isClient?'Client':'Walkin', clientId:client?client.id:null, payment, items });
    }
  }
  return recs;
}
function srRecs(){ const c=new Date(SEED_TODAY); c.setDate(c.getDate()-SREP.period);
  const ci=c.toISOString().slice(0,10); return salesHistory().filter(r=>r.date>=ci); }
function srTotal(r){ return r.items.reduce((a,i)=>a+i.qty*i.unitPrice,0); }
function srUnits(r){ return r.items.reduce((a,i)=>a+i.qty,0); }
function srLitres(r){ return r.items.reduce((a,i)=>a+(i.packageSize||0)*i.qty,0); }
function srWeekStart(iso){ const d=new Date(iso); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return d.toISOString().slice(0,10); }
function srBucket(r){ return SREP.gran==='month'?r.date.slice(0,7):srWeekStart(r.date); }
function srSetTab(t){ SREP.tab=t; renderRoute(); }
function srSetPeriod(p){ SREP.period=p; renderRoute(); }
function srSetGran(g){ SREP.gran=g; renderRoute(); }
function srKpi(label,val,sub,ic,tone){ return repKpi(label,val,sub,ic,SREP_TONE[tone]||SREP_TONE.amber); }
function srEmpty(msg){ return `<div class="card" style="margin-top:16px"><div class="empty">${esc(msg)}</div></div>`; }

function viewSalesReports(){
  const recs=srRecs();
  const controls=`<div class="toolbar" style="margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div class="seg"><button class="${SREP.tab==='revenue'?'on':''}" onclick="srSetTab('revenue')">Tržby</button>
      <button class="${SREP.tab==='products'?'on':''}" onclick="srSetTab('products')">Zboží</button>
      <button class="${SREP.tab==='buyers'?'on':''}" onclick="srSetTab('buyers')">Kupující</button></div>
    <div class="seg"><button class="${SREP.period===30?'on':''}" onclick="srSetPeriod(30)">30 dní</button>
      <button class="${SREP.period===90?'on':''}" onclick="srSetPeriod(90)">90 dní</button>
      <button class="${SREP.period===180?'on':''}" onclick="srSetPeriod(180)">6 měsíců</button></div>
    <span class="count-note" style="margin-left:auto">${nf(recs.length)} prodejů · ${REP_RANGE[SREP.period]}</span></div>`;
  const body=SREP.tab==='products'?srProducts(recs):SREP.tab==='buyers'?srBuyers(recs):srRevenue(recs);
  return `<div class="page">
    ${pageHead('Garážový prodej','Reporty','Dokončené prodeje · '+REP_RANGE[SREP.period]+'. Data v prototypu jsou generovaná.','')}
    ${controls}${body}</div>`;
}

/* Tržby — what the counter took, how it was paid for, and what is still owed. */
function srRevenue(recs){
  const revenue=recs.reduce((a,r)=>a+srTotal(r),0);
  const units=recs.reduce((a,r)=>a+srUnits(r),0);
  const litres=recs.reduce((a,r)=>a+srLitres(r),0);
  const avg=recs.length?revenue/recs.length:0;
  const buckets=sumBy(recs,srBucket,srTotal);
  const points=[...buckets.keys()].sort().map(k=>({label:k,value:buckets.get(k)}));
  const payParts=['Cash','Invoice'].map((p,i)=>({ label:L.payment[p],
    value:recs.filter(r=>r.payment===p).reduce((a,r)=>a+srTotal(r),0),
    color:TYPE_PALETTE[i===0?0:3] })).filter(p=>p.value>0);
  // The outstanding-invoice table is the only part of this screen that is not window-bound:
  // an invoice that went unpaid months ago is exactly the one worth chasing today.
  const unpaid=DB.sales.filter(saleUnpaid).sort((a,b)=>saleOverdueDays(b)-saleOverdueDays(a));
  const unpaidSum=unpaid.reduce((a,s)=>a+saleTotals(s).total,0);
  const overdueLabel=s=>{ const od=saleOverdueDays(s);
    if(!s.billing||!s.billing.dueDate) return ['s-grey','Bez splatnosti'];
    if(!od){ const to=Math.max(0,Math.round((new Date(s.billing.dueDate)-new Date(SEED_TODAY))/86400000));
      return ['s-grey','Do splatnosti '+to+' dní']; }
    return [od>30?'s-crit':'s-amber','Po splatnosti '+od+' dní']; };
  const kpis=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px">
    ${srKpi('Tržba celkem',money(revenue),null,'wallet','amber')}
    ${srKpi('Prodejů',nf(recs.length),null,'cart','info')}
    ${srKpi('Průměrný nákup',money(Math.round(avg)),null,'chart','grey')}
    ${srKpi('Prodáno',nf(units)+' ks',fmtLiters(Math.round(litres)),'box','ok')}
  </div>`;
  if(!recs.length&&!unpaid.length) return kpis+srEmpty('Za zvolené období nejsou žádná data.');
  return kpis+`<div class="stack" style="gap:16px">
    <div class="grid" style="grid-template-columns:1.25fr 1fr;align-items:start;gap:16px">
      <div class="card"><div class="card-head"><span style="color:var(--amber)">${icon('chart',18)}</span><h3>Tržby v čase</h3>
        <div class="seg" style="margin-left:auto"><button class="${SREP.gran==='week'?'on':''}" onclick="srSetGran('week')">Týdně</button>
          <button class="${SREP.gran==='month'?'on':''}" onclick="srSetGran('month')">Měsíčně</button></div></div>
        <div class="card-pad">${chArea(points,{})}</div></div>
      <div class="card"><div class="card-head"><span style="color:var(--amber)">${icon('wallet',18)}</span><h3>Podle způsobu platby</h3></div>
        <div class="card-pad" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
          ${chDonut(payParts,{center:{v:money(revenue),l:'tržba'}})}<div style="flex:1;min-width:150px">${legend(payParts,money)}</div></div></div>
    </div>
    <div class="card"><div class="card-head"><span style="color:var(--amber)">${icon('invoice',18)}</span>
      <h3>Neuhrazené faktury · ${money(unpaidSum)}</h3></div>
      ${unpaid.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Prodej</th><th>Odběratel</th><th>Splatnost</th><th>Stav</th>
        <th style="text-align:right">Částka</th></tr></thead><tbody>${unpaid.map(s=>{ const [cls,lbl]=overdueLabel(s);
          return `<tr class="clickable" onclick="go('sales/${s.id}')"><td>${fdate(s.date)}</td><td style="font-weight:600">${esc(saleBuyer(s))}</td>
            <td>${s.billing&&s.billing.dueDate?fdate(s.billing.dueDate):'—'}</td>
            <td><span class="pill ${cls}"><span class="d"></span>${esc(lbl)}</span></td>
            <td class="num tnum t-strong">${money(saleTotals(s).total)}</td></tr>`; }).join('')}</tbody></table></div>`
        :`<div class="empty" style="padding:30px"><div>${icon('check',30)}</div><div class="t">Všechny faktury jsou uhrazené.</div></div>`}</div>
  </div>`;
}

/* Zboží — what moved off the shelf, what it was discounted by, and what is not moving. */
function srProducts(recs){
  const lines=recs.flatMap(r=>r.items);
  const byName=new Map();
  lines.forEach(i=>{ const key=i.name+(i.packageSize!=null?' ('+fmtLiters(i.packageSize)+')':'');
    const e=byName.get(key)||{name:key,kind:i.kind,units:0,litres:0,discount:0,revenue:0};
    e.units+=i.qty; e.litres+=(i.packageSize||0)*i.qty; e.discount+=(i.listPrice-i.unitPrice)*i.qty;
    e.revenue+=i.unitPrice*i.qty; byName.set(key,e); });
  const products=[...byName.values()].sort((a,b)=>b.revenue-a.revenue);
  const discount=products.reduce((a,p)=>a+p.discount,0);
  const listValue=products.reduce((a,p)=>a+p.revenue,0)+discount;
  const share=listValue?discount/listValue*100:0;
  const kindParts=[...sumBy(lines,i=>i.kind||'Other',i=>i.unitPrice*i.qty).entries()].sort((a,b)=>b[1]-a[1])
    .map(([k,v],i)=>({label:L.kind[k]||k, value:v, color:TYPE_PALETTE[i%TYPE_PALETTE.length]}));
  // Stock coverage is an approximation and says so: the shelf is a live number with no
  // ledger behind it, so this relates today's stock to the window's sales rate.
  const soldByInv=sumBy(lines,i=>i.inventoryId,i=>i.qty);
  const cover=DB.inventory.map(inv=>{ const p=inv.productId?prodById(inv.productId):null;
    const sold=soldByInv.get(inv.id)||0;
    return { name:p?p.name+(p.packageSize!=null?' ('+fmtLiters(p.packageSize)+')':''):inv.name,
      quantity:inv.quantity, sold, days:sold?inv.quantity/(sold/SREP.period):null }; })
    .sort((a,b)=>(b.days==null?1e9:b.days)-(a.days==null?1e9:a.days));
  const neverSold=cover.filter(c=>c.days==null).length;
  // "Never sold" is a different fact from "a very long cover" and must not read as one.
  const fmtCover=d=>{ if(d==null) return '—'; if(d>365) return '> 1 rok';
    const w=Math.round(d); return w<1?'< 1 den':w+' '+plural(w,'den','dny','dní'); };
  const top=products.slice(0,SREP_TOP_N).map(p=>({label:p.name,value:p.revenue,color:'var(--amber)'}));
  const kpis=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px">
    ${srKpi('Druhů zboží prodáno',nf(products.length),null,'brewery','amber')}
    ${srKpi('Slevy celkem',money(discount),nf(share,1)+' % z ceníkové ceny','tag','info')}
    ${srKpi('Položek skladem',nf(cover.length),null,'stock','grey')}
    ${srKpi('Bez prodeje',nf(neverSold),'za zvolené období','clock',neverSold>0?'crit':'ok')}
  </div>`;
  if(!products.length&&!cover.length) return kpis+srEmpty('Za zvolené období nejsou žádná data.');
  return kpis+`<div class="stack" style="gap:16px">
    <div class="grid" style="grid-template-columns:1.25fr 1fr;align-items:start;gap:16px">
      <div class="card"><div class="card-head"><span style="color:var(--amber)">${icon('brewery',18)}</span>
        <h3>Nejprodávanější zboží (top ${SREP_TOP_N})</h3></div><div class="card-pad">${hBars(top,{fmt:money})}</div></div>
      <div class="card"><div class="card-head"><span style="color:var(--amber)">${icon('box',18)}</span><h3>Podle balení</h3></div>
        <div class="card-pad" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
          ${chDonut(kindParts,{center:{v:money(listValue-discount),l:'tržba'}})}<div style="flex:1;min-width:150px">${legend(kindParts,money)}</div></div></div>
    </div>
    <div class="card"><div class="card-head"><span style="color:var(--amber)">${icon('cart',18)}</span><h3>Všechno prodané zboží</h3></div>
      ${products.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Zboží</th><th>Balení</th><th style="text-align:right">Kusů</th>
        <th style="text-align:right">Objem</th><th style="text-align:right">Sleva</th><th style="text-align:right">Tržba</th></tr></thead>
        <tbody>${products.map(p=>`<tr><td style="font-weight:600">${esc(p.name)}</td><td>${p.kind?kindChip(p.kind):'—'}</td>
          <td class="num tnum">${nf(p.units)}</td><td class="num tnum">${fmtLiters(Math.round(p.litres))}</td>
          <td class="num tnum">${money(p.discount)}</td><td class="num tnum t-strong">${money(p.revenue)}</td></tr>`).join('')}</tbody></table></div>`
        :`<div class="empty" style="padding:30px"><div class="t">Za zvolené období se nic neprodalo.</div></div>`}</div>
    <div class="card"><div class="card-head"><span style="color:var(--amber)">${icon('clock',18)}</span><h3>Ležáky na skladě</h3></div>
      ${cover.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Zboží</th><th style="text-align:right">Na skladě</th>
        <th style="text-align:right">Prodáno</th><th style="text-align:right">Vystačí na</th></tr></thead>
        <tbody>${cover.map(c=>`<tr><td style="font-weight:600">${esc(c.name)}</td><td class="num tnum">${nf(c.quantity)} ks</td>
          <td class="num tnum">${nf(c.sold)} ks</td><td class="num tnum ${c.days==null?'t-mut':''}">${fmtCover(c.days)}</td></tr>`).join('')}</tbody></table></div>`
        :`<div class="empty" style="padding:30px"><div class="t">Sklad je prázdný.</div></div>`}</div>
  </div>`;
}

/* Kupující — who buys at the counter. Walk-ins are one bucket and carry no link: the sale
   records at most a typed name, which identifies nobody. */
function srBuyers(recs){
  const revenue=recs.reduce((a,r)=>a+srTotal(r),0);
  const kindParts=['Client','Walkin'].map((k,i)=>({ label:L.saleBuyerKind[k],
    value:recs.filter(r=>r.buyerKind===k).reduce((a,r)=>a+srTotal(r),0),
    color:TYPE_PALETTE[i===0?0:3] })).filter(p=>p.value>0);
  const byClient=DB.clients.map(c=>{ const rr=recs.filter(r=>r.clientId===c.id);
    return { c, sales:rr.length, revenue:rr.reduce((a,r)=>a+srTotal(r),0),
      last:rr.map(r=>r.date).sort().slice(-1)[0]||null }; })
    .filter(x=>x.sales>0).sort((a,b)=>b.revenue-a.revenue);
  const clientRevenue=byClient.reduce((a,x)=>a+x.revenue,0);
  const repeat=byClient.filter(x=>x.sales>1).length;
  const oneTime=recs.filter(r=>r.buyerKind==='Walkin').length;
  const pct=(v,t)=>t?nf(v/t*100,1)+' %':'—';
  const top=byClient.slice(0,SREP_TOP_N).map(x=>({label:x.c.name,value:x.revenue,color:'var(--amber)'}));
  const kpis=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px">
    ${srKpi('Klientů nakoupilo',nf(byClient.length),null,'client','info')}
    ${srKpi('Opakovaní kupující',nf(repeat),null,'history','ok')}
    ${srKpi('Jednorázoví kupující',nf(oneTime),null,'users','grey')}
    ${srKpi('Podíl klientů na tržbě',pct(clientRevenue,revenue),money(clientRevenue),'chart','amber')}
  </div>`;
  if(!recs.length) return kpis+srEmpty('Za zvolené období nejsou žádná data.');
  return kpis+`<div class="stack" style="gap:16px">
    <div class="grid" style="grid-template-columns:1fr 1.25fr;align-items:start;gap:16px">
      <div class="card"><div class="card-head"><span style="color:var(--amber)">${icon('users',18)}</span><h3>Klienti vs. jednorázoví</h3></div>
        <div class="card-pad" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
          ${chDonut(kindParts,{center:{v:money(revenue),l:'tržba'}})}<div style="flex:1;min-width:150px">${legend(kindParts,money)}</div></div></div>
      <div class="card"><div class="card-head"><span style="color:var(--amber)">${icon('client',18)}</span>
        <h3>Nejlepší klienti (top ${SREP_TOP_N})</h3></div><div class="card-pad">${hBars(top,{fmt:money})}</div></div>
    </div>
    <div class="card"><div class="card-head"><span style="color:var(--amber)">${icon('client',18)}</span><h3>Všichni klienti</h3></div>
      ${byClient.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Klient</th><th style="text-align:right">Nákupů</th>
        <th style="text-align:right">Poslední nákup</th><th style="text-align:right">Tržba</th><th style="text-align:right">Podíl</th></tr></thead>
        <tbody>${byClient.map(x=>`<tr class="clickable" onclick="go('clients/${x.c.id}')"><td style="font-weight:600">${esc(x.c.name)}</td>
          <td class="num tnum">${nf(x.sales)}</td><td class="num">${fdate(x.last)}</td>
          <td class="num tnum t-strong">${money(x.revenue)}</td><td class="num tnum">${pct(x.revenue,revenue)}</td></tr>`).join('')}</tbody></table></div>`
        :`<div class="empty" style="padding:30px"><div class="t">Za zvolené období nakoupili jen jednorázoví kupující.</div></div>`}</div>
  </div>`;
}

function driverCalendarView(){
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(SEED_TODAY); d.setDate(d.getDate()+i); return d; });
  const H0=6, H1=20, hrs=H1-H0, colH=460;
  const hourLabels=[...Array(hrs+1)].map((_,i)=>`<div style="height:${colH/hrs}px;font-size:10.5px;color:var(--text-3);text-align:right;padding-right:6px;transform:translateY(-6px)">${H0+i}:00</div>`).join('');
  const dayCols=days.map(day=>{ const ds=day.toISOString().slice(0,10); const isToday=ds===SEED_TODAY;
    const blocks=DB.drivers.flatMap(dr=>dr.availabilities.filter(a=>a.from.slice(0,10)===ds).map(a=>{
      const fh=parseInt(a.from.slice(11,13))+parseInt(a.from.slice(14,16))/60, uh=parseInt(a.until.slice(11,13))+parseInt(a.until.slice(14,16))/60;
      const top=Math.max(0,(fh-H0)/hrs*colH), height=Math.max(18,(uh-fh)/hrs*colH);
      return `<div title="${esc(dr.firstName+' '+dr.lastName)} ${a.from.slice(11,16)}–${a.until.slice(11,16)}" style="position:absolute;left:3px;right:3px;top:${top}px;height:${height}px;background:${dr.color}22;border-left:3px solid ${dr.color};border-radius:5px;padding:3px 5px;overflow:hidden;font-size:10.5px;color:var(--text)">
        <div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(dr.lastName)}</div><div style="color:var(--text-2)">${a.from.slice(11,16)}–${a.until.slice(11,16)}</div></div>`; }));
    return `<div style="flex:1;min-width:100px;border-left:1px solid var(--border)">
      <div style="text-align:center;padding:8px 4px;border-bottom:1px solid var(--border);${isToday?'background:var(--amber-soft)':''}">
        <div style="font-size:11px;text-transform:uppercase;color:var(--text-3);font-weight:700">${day.toLocaleDateString('cs-CZ',{weekday:'short'})}</div>
        <div class="tnum" style="font-weight:800;font-size:16px;${isToday?'color:var(--amber-700)':''}">${day.getDate()}.</div></div>
      <div style="position:relative;height:${colH}px">${[...Array(hrs)].map((_,i)=>`<div style="height:${colH/hrs}px;border-bottom:1px solid var(--border);opacity:.5"></div>`).join('')}${blocks.join('')}</div></div>`; }).join('');
  return `<div class="card"><div class="card-pad" style="overflow-x:auto"><div style="display:flex;min-width:760px">
    <div style="width:46px;flex:0 0 auto"><div style="height:53px"></div>${hourLabels}</div>${dayCols}</div>
    <div class="row wrap gap12" style="margin-top:16px">${DB.drivers.map(d=>`<span class="chip"><span class="dotc" style="width:10px;height:10px;border-radius:99px;background:${d.color}"></span>${esc(d.firstName)} ${esc(d.lastName)}</span>`).join('')}</div>
  </div></div>`;
}

function renderAv(){ $('#av-list').innerHTML=AV_DRAFT.map((a,i)=>`<div class="row gap8" style="margin-bottom:8px">
  <input class="input" type="date" value="${a.from?a.from.slice(0,10):''}" data-ai="${i}" data-f="date" style="flex:1">

  <button class="icon-btn" style="width:38px;flex:0 0 auto" onclick="rmAvRow(${i})">${icon('trash',14)}</button></div>`).join('')||'<div class="t-mut" style="font-size:13px">Zatím žádné termíny.</div>'; }
function syncAv(){ AV_DRAFT.forEach((a,i)=>{ const date=$(`[data-ai="${i}"][data-f="date"]`), from=$(`[data-ai="${i}"][data-f="from"]`), until=$(`[data-ai="${i}"][data-f="until"]`);

  const rows=DB.users.map(u=>`<tr class="clickable" onclick="${ed?`userForm('${u.id}')`:''}">
    <td><div class="row-lead">${avatar(u.id,initials(u.firstName,u.lastName))}
      <div><div class="t-strong">${esc(u.firstName||'')} ${esc(u.lastName||'')}</div><div class="t-mut mono" style="font-size:12px">@${esc(u.userName)}</div></div></div></td>
    <td>${u.roles.map(r=>`<span class="pill ${r==='Admin'?'s-amber':'s-grey'}"><span class="d"></span>${r==='Admin'?'Administrátor':'Uživatel'}</span>`).join(' ')}</td>
    <td>${permSummary(u)}</td>
    ${ed?`<td style="text-align:right"><button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();userForm('${u.id}')">${icon('edit',14)}Práva</button></td>`:''}</tr>`).join('');
  return `<div class="page">
    ${pageHead('Správa','Uživatelé','Správa uživatelů a jejich práv k jednotlivým modulům.', ed?`<button class="btn btn-primary" onclick="userForm(null)">${icon('plus',17)}Nový uživatel</button>`:'')}
    <div class="card" style="margin-bottom:16px;background:var(--amber-soft);border-color:var(--amber-tint)"><div class="card-pad row gap12">
      <span style="color:var(--amber-700)">${icon('shield',18)}</span><div style="font-size:13px;color:var(--text-2)"><b>Granulární oprávnění.</b> U každého uživatele lze nastavit přístup <b>ke každému modulu zvlášť</b> — bez přístupu / jen čtení / úpravy. (Rozšíření oproti současnému API, které zná jen role Admin/Uživatel.)</div></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Uživatel</th><th>Role</th><th>Práva k modulům</th>${ed?'<th></th>':''}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
let USER_DRAFT=null;
function userForm(id){
  const u=id?DB.users.find(x=>x.id===id):{ firstName:'',lastName:'',userName:'',roles:['User'],perms:makePerms({}) };
  USER_DRAFT={ ...u, roles:[...u.roles], perms:{...u.perms} };
  openOverlay(`<div class="drawer-head wide">${icon('users',20)}<h2>${id?'Upravit uživatele':'Nový uživatel'}</h2><button class="icon-btn" data-scrim-close>${icon('close',16)}</button></div>
    <div class="drawer-body">
      <div class="form-grid">
        ${field('Jméno',inp('us-fn',u.firstName||'','Eva'))}${field('Příjmení',inp('us-ln',u.lastName||'','Dvořáková'))}
        ${field('Uživatelské jméno',inp('us-un',u.userName||'','dispecer'),{req:true})}
        ${field('Heslo',inp('us-pw','',id?'(beze změny)':'••••••••','password'),{req:!id})}
      </div>
      <div class="divider"></div><div class="section-label">Role</div>
      <div class="row gap8" style="margin-bottom:6px">
        <button class="chip" id="role-admin" style="height:36px" onclick="userToggleAdmin()"><span id="role-admin-ic">${USER_DRAFT.roles.includes('Admin')?icon('check',14):''}</span> Administrátor (plný přístup)</button></div>
      <div class="hint">Administrátor má vždy přístup ke všem modulům. Pro jemné řízení práv ponechte roli Uživatel.</div>
      <div class="divider"></div><div class="section-label">Práva k modulům</div>
      <div id="perm-matrix"></div>
    </div>
    <div class="drawer-foot"><button class="btn btn-ghost" data-scrim-close>Zrušit</button><button class="btn btn-primary" id="us-save">${icon('check',16)}Uložit</button></div>`,{wide:true});
  renderPermMatrix();
  $('#us-save').onclick=()=>{ const un=val('us-un'); if(!un)return toast('Zadejte uživatelské jméno','warnTri');
    const data={ firstName:val('us-fn'), lastName:val('us-ln'), userName:un, roles:USER_DRAFT.roles, perms:USER_DRAFT.perms };
    if(id){ Object.assign(DB.users.find(x=>x.id===id),data); if(ME.id===id)ME=DB.users.find(x=>x.id===id); toast('Uživatel upraven'); }
    else { data.id='u-'+Math.random().toString(36).slice(2,7); DB.users.push(data); toast('Uživatel vytvořen'); }
    closeOverlay(); buildShell(); renderRoute(); };
  $$('[data-scrim-close]').forEach(x=>x.onclick=closeOverlay);
}
function userToggleAdmin(){ const isA=USER_DRAFT.roles.includes('Admin');
  USER_DRAFT.roles= isA? ['User'] : ['Admin'];
  $('#role-admin-ic').innerHTML=USER_DRAFT.roles.includes('Admin')?icon('check',14):'';
  $('#role-admin').style.background=USER_DRAFT.roles.includes('Admin')?'var(--amber-soft)':''; $('#role-admin').style.borderColor=USER_DRAFT.roles.includes('Admin')?'var(--amber)':'var(--border)';
  renderPermMatrix(); }
function renderPermMatrix(){
  const admin=USER_DRAFT.roles.includes('Admin');
  const levels=[['none','Bez přístupu','var(--text-3)'],['view','Jen čtení','var(--info)'],['edit','Úpravy','var(--ok)']];
  $('#perm-matrix').innerHTML=`<div class="tbl-wrap" style="${admin?'opacity:.5;pointer-events:none':''}"><table class="tbl" style="min-width:0"><thead><tr><th>Modul</th>
    ${levels.map(([,l])=>`<th style="text-align:center">${l}</th>`).join('')}</tr></thead><tbody>
    ${PERM_MODULES.map(([m,label,ic])=>{ const cur=admin?'edit':(USER_DRAFT.perms[m]||'none');
      return `<tr><td><div class="row gap8">${icon(ic,15)}<span class="t-strong">${label}</span></div></td>
      ${levels.map(([lv,,col])=>`<td style="text-align:center"><label style="cursor:pointer;display:inline-flex"><input type="radio" name="perm-${m}" ${cur===lv?'checked':''} onchange="USER_DRAFT.perms['${m}']='${lv}'" style="width:17px;height:17px;accent-color:${col}"></label></td>`).join('')}</tr>`; }).join('')}
  </tbody></table></div>${admin?'<div class="hint" style="margin-top:8px">Administrátor má automaticky úpravy ve všech modulech.</div>':''}`;
}

/* ============ GLOBAL SEARCH ============ */
/* ============ COMMAND PALETTE (⌘K) ============ */
const CMDK={ items:[], sel:0 };
function cmdkSearch(q){
  q=q.trim().toLowerCase(); const res=[];
  if(!q){ // quick nav to modules when empty
    NAV.forEach(sec=>sec.items.forEach(([m,ic,lbl])=>{ if(canSee(m)) res.push({ic,title:lbl,sub:'Přejít do modulu',path:m,kind:'Modul'}); }));
    return res;
  }
  if(canSee('orders')) DB.orders.forEach(o=>{ const c=clientById(o.clientId); if((o.number||'').toLowerCase().includes(q)||c.name.toLowerCase().includes(q))
    res.push({ic:'order',title:o.number,sub:c.name+' · '+(L.orderState[o.state]||''),path:'orders/'+o.id,kind:'Objednávka'}); });
  if(canSee('clients')) DB.clients.forEach(c=>{ if(c.name.toLowerCase().includes(q)||(c.businessName||'').toLowerCase().includes(q))
    res.push({ic:'client',title:c.name,sub:(c.businessName?c.businessName+' · ':'')+(L.region[c.region]||''),path:'clients/'+c.id,kind:'Klient'}); });
  if(canSee('breweries')) DB.breweries.forEach(b=>{ if(b.name.toLowerCase().includes(q)) res.push({ic:'brewery',title:b.name,sub:'Pivovar',path:'breweries/'+b.id,kind:'Pivovar'}); });
  if(canSee('breweries')) DB.products.forEach(p=>{ if(p.name.toLowerCase().includes(q)){ const b=breweryById(p.breweryId);
    res.push({ic:'box',title:p.name+(p.packageSize!=null?' ('+fmtLiters(p.packageSize)+')':''),sub:b.name+' · '+money(p.priceWithVat),path:'breweries/'+b.id+'?tab=cenik',kind:'Produkt'}); } });
  const qs=supNorm(q); // 'co2' has to reach 'CO₂' — see supNorm
  if(canSee('suppliers')) DB.suppliers.forEach(s=>{ if(supNorm(s.name).includes(qs)||supNorm(s.businessName).includes(qs))
    res.push({ic:'supplier',title:s.name,sub:(s.businessName?s.businessName+' · ':'')+openStateText(openState(s)),path:'suppliers/'+s.id,kind:'Dodavatel'}); });
  if(canSee('suppliers')) DB.suppliers.forEach(s=>supGoods(s).forEach(g=>{ if(supNorm(g.name).includes(qs)){ const fill=(g.prices||[]).find(p=>p.kind==='Fill')||g.prices[0];
    res.push({ic:'cylinder',title:g.name+(g.size?' ('+g.size+')':''),sub:s.name+(fill?' · '+L.chargeKind[fill.kind]+' '+money(fill.priceWithVat):''),path:'suppliers/'+s.id+'?tab=cenik',kind:'Zboží'}); } }));
  if(canSee('shipments')) DB.shipments.forEach(s=>{ if((s.number||'').toLowerCase().includes(q)||s.name.toLowerCase().includes(q))
    res.push({ic:'ship',title:s.name,sub:s.number+' · '+(L.shipState[s.state]||''),path:'shipments/'+s.id,kind:'Vývoz'}); });
  if(canSee('deliveries')) DB.deliveries.forEach(d=>{ if((d.number||'').toLowerCase().includes(q))
    res.push({ic:'import',title:d.number,sub:'Dovoz · '+(L.deliveryState[d.state]||''),path:'deliveries/'+d.id,kind:'Dovoz'}); });
  if(canSee('sales')) DB.sales.forEach(s=>{ if(saleNumber(s).toLowerCase().includes(q)||saleNorm(saleBuyer(s)).includes(saleNorm(q)))
    res.push({ic:'cart',title:saleNumber(s),sub:saleBuyer(s)+' · '+(L.saleState[s.state]||''),path:'sales/'+s.id,kind:'Prodej'}); });
  return res.slice(0,10);
}
function openCommandPalette(){
  $('#overlay').innerHTML=`<div class="scrim cmdk-scrim" data-scrim><div class="cmdk-panel" role="dialog" aria-label="Hledat">
    <div class="cmdk-input-wrap">${icon('search',18)}<input id="cmdk-input" autocomplete="off" placeholder="Hledat objednávky, klienty, produkty, pivovary…"><kbd class="cmdk-kbd">ESC</kbd></div>
    <div id="cmdk-results" class="cmdk-results"></div></div></div>`;
  $('.cmdk-scrim').addEventListener('mousedown',e=>{ if(e.target===e.currentTarget) closeOverlay(); });
  const inp=$('#cmdk-input');
  inp.oninput=()=>{ CMDK.sel=0; renderCmdk(inp.value); };
  inp.onkeydown=e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); CMDK.sel=Math.min(CMDK.sel+1,CMDK.items.length-1); paintCmdkSel(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); CMDK.sel=Math.max(CMDK.sel-1,0); paintCmdkSel(); }
    else if(e.key==='Enter'){ e.preventDefault(); const it=CMDK.items[CMDK.sel]; if(it) cmdkGo(it.path); }
    else if(e.key==='Escape'){ closeOverlay(); }
  };
  renderCmdk(''); inp.focus();
  document.addEventListener('keydown',escClose);
}
function renderCmdk(q){
  CMDK.items=cmdkSearch(q); const box=$('#cmdk-results'); if(!box) return;
  if(!CMDK.items.length){ box.innerHTML=`<div class="t-mut" style="padding:26px;text-align:center;font-size:13.5px">Nic nenalezeno pro „${esc(q)}"</div>`; return; }
  box.innerHTML=CMDK.items.map((it,i)=>`<button class="cmdk-item ${i===CMDK.sel?'on':''}" data-i="${i}" onmousedown="event.preventDefault();cmdkGo('${it.path}')" onmouseenter="CMDK.sel=${i};paintCmdkSel()">
    <span class="cmdk-ic">${icon(it.ic,17)}</span>
    <span style="flex:1;min-width:0"><span class="cmdk-t">${esc(it.title)}</span><span class="cmdk-s">${esc(it.sub)}</span></span>
    <span class="tag">${esc(it.kind)}</span></button>`).join('');
  paintCmdkSel();
}
function paintCmdkSel(){ $$('.cmdk-item').forEach((el,i)=>{ el.classList.toggle('on',i===CMDK.sel); if(i===CMDK.sel&&el.scrollIntoView) el.scrollIntoView({block:'nearest'}); }); }
function cmdkGo(path){ closeOverlay(); go(path); }

/* ============ BOOT ============ */
/* ============ LOGIN ============ */
function renderLogin(){
  const app=$('#app'); app.className='';
  app.innerHTML=`<div class="login-wrap">
    <div class="login-brand">
      <div class="login-glow"></div><div class="login-bubbles">${[...Array(9)].map((_,i)=>`<span style="left:${8+i*10}%;width:${6+(i%4)*5}px;height:${6+(i%4)*5}px;animation-delay:${i*0.7}s;animation-duration:${7+i%5}s"></span>`).join('')}</div>
      <div class="login-brand-top">${logoSVG(40)}<span class="login-wordmark">Ale<b>Track</b></span></div>
      <div class="login-brand-mid">
        <h1>Řízení distribuce piva<br>na jednom místě.</h1>
        <p>Pivovary, klienti, objednávky, vývozy s optimalizací trasy a sklad — přehledně, rychle a bez papírů.</p>
        <ul class="login-feats">
          <li>${icon('order',17)}Objednávky s historií klienta</li>
          <li>${icon('route',17)}Vývozy s plánováním trasy</li>
          <li>${icon('stock',17)}Sklad, dovozy a nakládka</li>
        </ul></div>
      <div class="login-brand-foot">© 2026 AleTrack · verze prototyp</div>
    </div>
    <div class="login-form-col">
      <button class="icon-btn login-theme" onclick="setTheme(UIS.theme==='dark'?'light':'dark')" title="Přepnout motiv">${icon(UIS.theme==='dark'?'sun':'moon',18)}</button>
      <div class="login-card">
        <div class="login-logo-sm">${logoSVG(38)}<span class="login-wordmark" style="color:var(--text)">Ale<b style="color:var(--amber)">Track</b></span></div>
        <h2>Přihlášení</h2>
        <p class="login-sub">Zadejte přihlašovací údaje pro vstup do aplikace.</p>
        <div id="login-err"></div>
        <form id="login-form" onsubmit="return loginSubmit()">
          <div class="field" style="margin-bottom:14px"><label>Uživatelské jméno</label>
            <div class="fld" style="height:44px">${icon('users',16)}<input id="login-user" autocomplete="username" placeholder="např. admin" value="admin"></div></div>
          <div class="field" style="margin-bottom:14px"><label>Heslo</label>
            <div class="fld" style="height:44px">${icon('shield',16)}<input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••••" value="demo">
              <button type="button" class="login-eye" onclick="const i=$('#login-pass');i.type=i.type==='password'?'text':'password';this.innerHTML=i.type==='password'?icon('eye',16):icon('close',16)" title="Zobrazit heslo">${icon('eye',16)}</button></div></div>
          <div class="row" style="justify-content:space-between;margin-bottom:18px">
            <label class="row gap8" style="font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer"><input type="checkbox" checked style="width:16px;height:16px"> Zapamatovat si mě</label>
            <a class="login-link" onclick="toast('Kontaktujte administrátora pro reset hesla.','info')">Zapomenuté heslo?</a></div>
          <button type="submit" class="btn btn-primary" style="width:100%;height:46px;font-size:15px" id="login-submit">${icon('logout',17)}Přihlásit se</button>
        </form>
        <div class="login-demo">
          <div class="login-divider"><span>Demo účty</span></div>
          <div class="row gap8" style="flex-wrap:wrap;justify-content:center">
            ${DB.users.map(u=>`<button class="chip" style="cursor:pointer" onclick="loginDemo('${u.userName}')">${avatar(u.id,initials(u.firstName,u.lastName))}${esc(u.firstName)} · ${u.roles.includes('Admin')?'admin':'uživatel'}</button>`).join('')}
          </div></div>
      </div>
    </div></div>`;
}
function loginSubmit(){
  const u=(val('login-user')||'').trim().toLowerCase(); const p=val('login-pass')||'';
  const user=DB.users.find(x=>x.userName.toLowerCase()===u);
  if(!user||!p){ $('#login-err').innerHTML=`<div class="login-error">${icon('warnTri',16)}Nesprávné uživatelské jméno nebo heslo.</div>`; return false; }
  ME=user; AUTH=true; buildShell(); location.hash='#/dashboard'; renderRoute();
  toast('Vítejte zpět, '+(ME.firstName||ME.userName)+'!','check');
  return false;
}
function loginDemo(userName){ const uEl=$('#login-user'), pEl=$('#login-pass'); if(uEl)uEl.value=userName; if(pEl)pEl.value='demo'; loginSubmit(); }
function logout(){ closeOverlay(); AUTH=false; ME=DB.users[0]; document.documentElement.setAttribute('data-theme',UIS.theme); renderLogin(); }

/* ============ BOOT ============ */
function boot(){
  document.documentElement.setAttribute('data-theme',UIS.theme);
  initCombos();
  window.addEventListener('hashchange',()=>{ if(AUTH) renderRoute(); });
  window.addEventListener('keydown',e=>{ if(AUTH&&(e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){ e.preventDefault(); if($('#cmdk-input')) closeOverlay(); else openCommandPalette(); } });
  if(AUTH){ buildShell(); if(!location.hash) location.hash='#/dashboard'; renderRoute(); }
  else renderLogin();
}
boot();

</script>
